<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<title>F&B Manager</title>
<style>
:root{
  --green:#0f6b4f;--green2:#16815f;--bg:#f5f7f6;--card:#fff;--text:#17211d;--muted:#718078;
  --line:#e4e9e6;--danger:#c93b3b;--warn:#c47a00;--ok:#218b5b;--shadow:0 8px 24px rgba(20,50,38,.08);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:255px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;z-index:20;padding:18px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;font-weight:800;font-size:20px;color:var(--green)}
.brand-badge{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center}
.nav-section{font-size:11px;text-transform:uppercase;color:#98a39e;font-weight:800;padding:14px 12px 7px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#4c5953;display:flex;gap:11px;align-items:center}
.nav button:hover,.nav button.active{background:#eaf5f0;color:var(--green);font-weight:700}.icon{width:22px;text-align:center}
.main{margin-left:255px;flex:1;min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}
.top-title{font-weight:800;font-size:20px}.top-actions{display:flex;gap:10px;align-items:center}.circle{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%}
.content{padding:24px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:5px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:10px;font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:850;margin-top:7px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
.section-title{font-size:16px;font-weight:800;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:flex;flex-direction:column;gap:10px}.list-item{padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.badge.ok{background:#e7f6ed;color:var(--ok)}.badge.warn{background:#fff3d9;color:var(--warn)}.badge.danger{background:#fde8e8;color:var(--danger)}.badge.info{background:#e8f1ff;color:#3165a8}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.table td.num{text-align:right}.table th.num{text-align:right}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.search{min-width:220px;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:#fff}.alert + .alert{margin-top:10px}.alert.danger{background:#fff0f0}.alert.warn{background:#fff8e8}.alert.ok{background:#edf9f2}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}
.progress{height:8px;background:#edf1ef;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:99px}
.modal-back{position:fixed;inset:0;background:rgba(12,22,18,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-back.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#56645d}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.recipe-line{display:grid;grid-template-columns:1.7fr .8fr .8fr auto;gap:8px;align-items:end;margin-bottom:8px}.recipe-line .remove{width:40px}
.pos-layout{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;text-align:left}.product-card:hover{border-color:#9bcbb9}.product-card .price{font-weight:850;color:var(--green);margin-top:7px}
.cart-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.pos-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:0 14px}.content{padding:16px}.menu-btn{display:block!important}.two,.three{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:flex-start}.page-head h1{font-size:23px}}
.menu-btn{display:none}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}.mobile-overlay.show{display:block}
.toast{position:fixed;right:20px;bottom:20px;background:#17211d;color:#fff;padding:12px 16px;border-radius:11px;z-index:200;box-shadow:var(--shadow);display:none}.toast.show{display:block}
</style>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="remy-bakery-apple-touch-icon.png">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-badge">F</div> F&B Manager</div>
  <div class="nav">
    <div class="nav-section">Tổng quan</div>
    <button data-page="dashboard" class="active"><span class="icon">🏠</span>Trang chủ</button>
    <div class="nav-section">Quản lý</div>
    <button data-page="ingredients"><span class="icon">🥚</span>Nguyên liệu</button>
    <button data-page="recipes"><span class="icon">🧾</span>Công thức</button>
    <button data-page="products"><span class="icon">🍰</span>Sản phẩm</button>
    <button data-page="inventory"><span class="icon">📦</span>Kho</button>
    <button data-page="production"><span class="icon">🏭</span>Sản xuất</button>
    <button data-page="pos"><span class="icon">🛒</span>Bán hàng</button>
    <button data-page="cashflow"><span class="icon">💰</span>Dòng tiền</button>
    <div class="nav-section">Theo dõi</div>
    <button data-page="alerts"><span class="icon">🚨</span>Cảnh báo</button>
    <button data-page="reports"><span class="icon">📊</span>Báo cáo</button>
    <div class="nav-section">Hệ thống</div>
    <button data-page="settings"><span class="icon">⚙️</span>Cài đặt</button>
  </div>
</aside>
<div class="mobile-overlay" id="overlay"></div>
<main class="main">
<header class="topbar">
  <div class="top-actions"><button class="circle menu-btn" id="menuBtn">☰</button><div class="top-title" id="topTitle">Trang chủ</div></div>
  <div class="top-actions"><button class="circle" onclick="go('alerts')" title="Cảnh báo">🔔</button><button class="circle" id="v9AccountBtn" onclick="v9OpenAccount()" title="Tài khoản">☁️</button></div>
</header>
<section class="content" id="view"></section>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

const KEY='fnb_manager_v1';
const money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n||0);
const num=n=>new Intl.NumberFormat('vi-VN').format(n||0);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const defaultData={
  ingredients:[
    {id:'i1',name:'Bột mì số 8',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:32000},
    {id:'i2',name:'Đường cát',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:22000},
    {id:'i3',name:'Trứng gà',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:52000},
    {id:'i4',name:'Bơ lạt',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:180000},
    {id:'i5',name:'Cream cheese',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:220000},
  ],
  batches:[
    {id:'b1',ingredientId:'i1',qty:5000,unit:'g',pricePerUnit:32,expiry:'2026-08-28',lot:'BM-0826'},
    {id:'b2',ingredientId:'i2',qty:4000,unit:'g',pricePerUnit:22,expiry:'2026-09-10',lot:'DU-0826'},
    {id:'b3',ingredientId:'i3',qty:3000,unit:'g',pricePerUnit:52,expiry:'2026-08-19',lot:'TR-0816'},
    {id:'b4',ingredientId:'i4',qty:1200,unit:'g',pricePerUnit:180,expiry:'2026-08-18',lot:'BO-0816'},
    {id:'b5',ingredientId:'i5',qty:700,unit:'g',pricePerUnit:220,expiry:'2026-08-25',lot:'CC-0816'}
  ],
  recipes:[
    {id:'r1',name:'Cốt bánh bông lan',yield:20,lines:[{ingredientId:'i1',qty:500},{ingredientId:'i2',qty:300},{ingredientId:'i3',qty:400},{ingredientId:'i4',qty:100}]},
    {id:'r2',name:'Sốt phô mai',yield:50,lines:[{ingredientId:'i5',qty:1000},{ingredientId:'i2',qty:120},{ingredientId:'i3',qty:100}]}
  ],
  products:[
    {id:'p1',name:'Bánh bông lan phô mai',price:49000,components:[{recipeId:'r1',qty:1},{recipeId:'r2',qty:1}],stock:32},
    {id:'p2',name:'Bánh bông lan cơ bản',price:39000,components:[{recipeId:'r1',qty:1}],stock:18},
  ],
  plans:[], sales:[], cash:[],
  settings:{tax:8,profit:35,packaging:2000,overhead:8}
};
let db=defaultData;
function save(){
window.dispatchEvent(new CustomEvent('fnb:data-saved'));
}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('topTitle').textContent=({dashboard:'Trang chủ',ingredients:'Nguyên liệu',recipes:'Công thức',products:'Sản phẩm',inventory:'Kho',production:'Sản xuất',pos:'Bán hàng',cashflow:'Dòng tiền',alerts:'Cảnh báo',reports:'Báo cáo',settings:'Cài đặt'})[page];render(page);closeMenu()}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById('menuBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')};
document.getElementById('overlay').onclick=closeMenu;



function impactedProducts(ingredientId){return db.products.filter(p=>productCostBreakdown(p).some(x=>x.ingredientId===ingredientId))}
function ingredientImpactHtml(ingredientId){
 const ing=db.ingredients.find(i=>i.id===ingredientId);
 const items=impactedProducts(ingredientId);
 return items.map(p=>{
  const b=productCostBreakdown(p).find(x=>x.ingredientId===ingredientId);
  return `<div class="list-item"><div class="row"><b>${p.name}</b><span>Cost ${money(productCost(p))}</span></div><div style="font-size:12px;color:var(--muted);margin-top:5px">Dùng ${num(b.qty)} ${b.unit} · Chi phí từ ${ing.name}: ${money(b.cost)}</div></div>`;
 }).join('')||'<div class="empty">Không có sản phẩm nào dùng nguyên liệu này.</div>';
}
function impactModal(ingredientId){
 const ing=db.ingredients.find(i=>i.id===ingredientId);
 openModal(`<h2>Ảnh hưởng: ${ing.name}</h2><p style="color:var(--muted)">Giá chuẩn hiện tại: <b>${money(ing.price/ing.pack)}/${ing.unit}</b></p>${ingredientImpactHtml(ingredientId)}<div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}


function inventoryTotals(){
  const out={};db.ingredients.forEach(i=>out[i.id]=0);db.batches.forEach(b=>out[b.ingredientId]=(out[b.ingredientId]||0)+Number(b.qty||0));return out;
}
function alerts(){
  const inv=inventoryTotals(), a=[], now=new Date();
  db.ingredients.forEach(i=>{
    const q=inv[i.id]||0;if(q<=0)a.push({type:'danger',title:`${i.name} đã hết`,detail:'Cần nhập thêm nguyên liệu.'});
    else if(q < i.pack*1) a.push({type:'warn',title:`${i.name} tồn thấp`,detail:`Còn ${num(q)} ${i.unit}.`});
  });
  db.batches.forEach(b=>{const d=Math.ceil((new Date(b.expiry)-now)/86400000);if(d<0)a.push({type:'danger',title:`Lô ${b.lot} đã hết hạn`,detail:`${ingName(b.ingredientId)} — HSD ${b.expiry}`});else if(d<=5)a.push({type:'warn',title:`${ingName(b.ingredientId)} sắp hết hạn`,detail:`Lô ${b.lot} — còn ${d} ngày.`})});
  db.plans.filter(x=>x.status==='draft').forEach(p=>{if(p.shortages?.length)a.push({type:'danger',title:`Kế hoạch ${p.name} đang thiếu nguyên liệu`,detail:p.shortages.map(x=>`${x.name} thiếu ${num(x.need-x.have)}${x.unit}`).join(', ')})});
  return a;
}
function ingName(id){return db.ingredients.find(x=>x.id===id)?.name||'—'}
function recipeName(id){return db.recipes.find(x=>x.id===id)?.name||'—'}
function productName(id){return db.products.find(x=>x.id===id)?.name||'—'}
function fmtDate(d){return d?new Date(d).toLocaleDateString('vi-VN'):'—'}

function render(page){
  const v=document.getElementById('view');
  if(page==='dashboard') return v.innerHTML=dashboard();
  if(page==='ingredients') return v.innerHTML=ingredients();
  if(page==='recipes') return v.innerHTML=recipes();
  if(page==='products') return v.innerHTML=products();
  if(page==='inventory') return v.innerHTML=inventory();
  if(page==='production') return v.innerHTML=production();
  if(page==='pos') return v.innerHTML=pos();
  if(page==='alerts') return v.innerHTML=alertsPage();
  if(page==='reports') return v.innerHTML=reports();
  if(page==='settings') return v.innerHTML=settings();
}
function dashboard(){
 const inv=inventoryTotals(), al=alerts(), sales=db.sales.filter(s=>s.date===today()), revenue=sales.reduce((s,x)=>s+x.total,0), cost=sales.reduce((s,x)=>s+x.cost,0);
 return `<div class="page-head"><div><h1>Xin chào 👋</h1><p>Đây là tình hình cửa hàng của bạn hôm nay.</p></div><button class="btn primary" onclick="go('production')">+ Lập kế hoạch sản xuất</button></div>
 <div class="grid stats">
  <div class="card stat"><div class="label">Doanh thu hôm nay</div><div class="value">${money(revenue)}</div><div class="sub">${sales.length} đơn hàng</div></div>
  <div class="card stat"><div class="label">Lợi nhuận tạm tính</div><div class="value">${money(revenue-cost)}</div><div class="sub">Theo các đơn đã bán</div></div>
  <div class="card stat"><div class="label">Giá trị tồn nguyên liệu</div><div class="value">${money(db.batches.reduce((s,b)=>s+b.qty*b.pricePerUnit,0))}</div><div class="sub">${db.ingredients.length} nguyên liệu</div></div>
  <div class="card stat"><div class="label">Cảnh báo</div><div class="value">${al.length}</div><div class="sub"><button class="btn small" onclick="go('alerts')">Xem cảnh báo</button></div></div>
 </div>
 <div class="grid two" style="margin-top:16px">
  <div class="card"><div class="section-title">Cảnh báo cần chú ý</div>${al.slice(0,5).map(a=>`<div class="alert ${a.type}"><div>${a.type==='danger'?'🔴':'🟠'}</div><div><b>${a.title}</b><div style="font-size:13px;margin-top:3px">${a.detail}</div></div></div>`).join('')||'<div class="empty">Không có cảnh báo 🎉</div>'}</div>
  <div class="card"><div class="section-title">Sản phẩm đang có trong kho</div>${db.products.slice(0,6).map(p=>`<div class="list-item row"><div><b>${p.name}</b><div style="font-size:12px;color:var(--muted)">${money(productCost(p))} / sản phẩm</div></div><span class="badge ${p.stock<5?'warn':'ok'}">${num(p.stock)} cái</span></div>`).join('')}</div>
 </div>`;
}
function ingredients(){
 return `<div class="page-head"><div><h1>Nguyên liệu</h1><p>Khai báo nguyên liệu và giá mua chuẩn.</p></div><button class="btn primary" onclick="ingredientModal()">+ Thêm nguyên liệu</button></div>
 <div class="card"><div class="toolbar"><input class="search" id="ingSearch" placeholder="Tìm nguyên liệu..." oninput="filterTable('ingSearch','ingTable')"></div>
 <div class="table-wrap"><table class="table" id="ingTable"><thead><tr><th>Tên</th><th>Nhóm</th><th>Đơn vị</th><th class="num">Quy cách</th><th class="num">Giá mua</th><th class="num">Giá / đơn vị</th><th></th></tr></thead><tbody>${db.ingredients.map(i=>`<tr><td><b>${i.name}</b></td><td>${i.group}</td><td>${i.unit}</td><td class="num">${num(i.pack)} ${i.packUnit}</td><td class="num">${money(i.price)}</td><td class="num">${money(i.price/i.pack)}</td><td class="num"><button class="btn small" onclick="ingredientModal('${i.id}')">Sửa</button> <button class="btn small" onclick="impactModal('${i.id}')">Ảnh hưởng</button></td></tr>`).join('')}</tbody></table></div></div>`;
}






function recipeLineV1(l,i){
 const kind=l.kind||'ingredient';
 return `<div class="recipe-line"><div class="field"><label>Loại</label><select class="rl-kind" onchange="refreshRecipeLine(this)"><option value="ingredient" ${kind==='ingredient'?'selected':''}>Nguyên liệu</option><option value="recipe" ${kind==='recipe'?'selected':''}>Công thức con</option></select></div><div class="field"><label>${kind==='recipe'?'Công thức':'Nguyên liệu'}</label><select class="rl-ref">${kind==='recipe'?db.recipes.filter(r=>r.id!==f('rId')).map(r=>`<option value="${r.id}" ${r.id===l.recipeId?'selected':''}>${r.name}</option>`).join(''):db.ingredients.map(r=>`<option value="${r.id}" ${r.id===l.ingredientId?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label>${kind==='recipe'?'Số batch':'Lượng'}</label><input class="rl-qty" type="number" min="0" step="0.0001" value="${l.qty||0}"></div><button class="btn remove" onclick="this.parentElement.remove()">×</button></div>`;
}
function refreshRecipeLine(sel){
 const row=sel.closest('.recipe-line'), kind=sel.value, ref=row.querySelector('.rl-ref'), label=row.querySelectorAll('label')[1], qtyLabel=row.querySelectorAll('label')[2];
 label.textContent=kind==='recipe'?'Công thức':'Nguyên liệu';qtyLabel.textContent=kind==='recipe'?'Số batch':'Lượng';
 ref.innerHTML=kind==='recipe'?db.recipes.filter(r=>r.id!==f('rEditId')).map(r=>`<option value="${r.id}">${r.name}</option>`).join(''):db.ingredients.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
}
function addRecipeLineV1(){document.getElementById('recipeLines').insertAdjacentHTML('beforeend',recipeLineV1({kind:'ingredient',ingredientId:db.ingredients[0]?.id||'',qty:0},Date.now()))}
function saveRecipeV1(eid){
 const lines=[...document.querySelectorAll('#recipeLines .recipe-line')].map(row=>{const kind=row.querySelector('.rl-kind').value,ref=row.querySelector('.rl-ref').value,qty=+row.querySelector('.rl-qty').value||0;return kind==='recipe'?{kind,recipeId:ref,qty}:{kind,ingredientId:ref,qty}}).filter(x=>x.qty>0);
 if(!f('rName')||!+f('rYield')||!lines.length){toast('Vui lòng nhập tên, yield và thành phần');return}
 const x={id:eid||id(),name:f('rName').trim(),yield:+f('rYield'),wastePct:+f('rWaste')||0,processTemp:f('rTemp'),processTime:f('rTime'),notes:f('rNotes'),lines,updatedAt:new Date().toISOString()};

<script>

// ===== V2.1: Đơn vị đo lường + tác động giá lô =====
const UNIT_GROUPS={
 weight:{g:1,kg:1000,mg:0.001},
 volume:{ml:1,l:1000},
 count:{cái:1,hộp:1,gói:1,chai:1,lon:1,quả:1,chiếc:1}
};
function unitInfo(u){
 const key=String(u||'').trim().toLowerCase();
 for(const [group,map] of Object.entries(UNIT_GROUPS)) if(map[key]!=null) return {group,factor:map[key],label:key};
 return {group:'custom',factor:1,label:key||'đơn vị'};
}
function unitOptions(selected, groupHint){
 const common=['g','kg','mg','ml','l','cái','hộp','gói','chai','lon','quả','chiếc'];
 return common.map(u=>`<option value="${u}" ${String(u)===String(selected)?'selected':''}>${u}</option>`).join('');
}
function convertQty(qty,from,to){
 const a=unitInfo(from),b=unitInfo(to); if(a.group!==b.group) return null; return qty*a.factor/b.factor;
}
function standardPricePerUnit(ing){
 const totalUsage=convertQty(Number(ing.pack)||0,ing.packUnit,ing.unit);
 return totalUsage?Number(ing.price)/totalUsage:0;
}
function priceInUnit(ing,pricePerUsageUnit,targetUnit){
 const q=convertQty(1,targetUnit,ing.unit); return q==null?pricePerUsageUnit:pricePerUsageUnit*q;
}
function ingredientModal(editId){
 const x=db.ingredients.find(i=>i.id===editId)||{name:'',group:'Nguyên liệu',unit:'g',pack:1000,packUnit:'g',price:0};
 openModal(`<h2>${editId?'Sửa':'Thêm'} nguyên liệu</h2><div class="form-grid">
  <div class="field full"><label>Tên nguyên liệu</label><input id="fName" value="${x.name}"></div>
  <div class="field"><label>Nhóm</label><select id="fGroup"><option ${x.group==='Nguyên liệu'?'selected':''}>Nguyên liệu</option><option ${x.group==='Bao bì'?'selected':''}>Bao bì</option></select></div>
  <div class="field"><label>Đơn vị đo lường / sử dụng</label><select id="fUnit">${unitOptions(x.unit)}</select></div>
  <div class="field"><label>Quy cách mua</label><input id="fPack" type="number" min="0" step="0.001" value="${x.pack}"></div>
  <div class="field"><label>Đơn vị quy cách</label><select id="fPackUnit">${unitOptions(x.packUnit)}</select></div>
  <div class="field full"><label>Giá mua / quy cách</label><input id="fPrice" type="number" min="0" step="0.01" value="${x.price}"></div>
 </div><div id="ingredientUnitHint" class="alert info" style="margin-top:14px"></div>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveIngredientV21('${editId||''}')">Lưu</button></div>`);
 updateIngredientUnitHint();
 ['fUnit','fPack','fPackUnit','fPrice'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateIngredientUnitHint));
 ['fUnit','fPackUnit'].forEach(id=>document.getElementById(id)?.addEventListener('change',updateIngredientUnitHint));
}
function updateIngredientUnitHint(){
 const pack=+f('fPack')||0, price=+f('fPrice')||0, unit=f('fUnit'), packUnit=f('fPackUnit');
 const q=convertQty(pack,packUnit,unit), el=document.getElementById('ingredientUnitHint');
 el.innerHTML=q==null?`⚠️ Đơn vị <b>${packUnit}</b> và <b>${unit}</b> không cùng nhóm đo lường. Hãy chọn lại.`:`Một quy cách = <b>${num(q)} ${unit}</b> · Giá chuẩn = <b>${money(q?price/q:0)}/${unit}</b>`;
}
function saveIngredientV21(eid){
 const old=db.ingredients.find(i=>i.id===eid);
 const x={id:eid||id(),name:f('fName'),group:f('fGroup'),unit:f('fUnit'),pack:+f('fPack'),packUnit:f('fPackUnit'),price:+f('fPrice')};
 const q=convertQty(x.pack,x.packUnit,x.unit);
 if(!x.name||!x.pack||!q||x.price<0){toast('Vui lòng kiểm tra tên, quy cách, đơn vị và giá');return}
 const oldUnit=old?standardPricePerUnit(old):0;
 const newUnit=standardPricePerUnit(x);
 const priceComparable=old&&old.unit===x.unit;
 const priceChanged=priceComparable&&Math.abs(newUnit-oldUnit)>1e-12;
 if(eid&&old&&priceChanged){
   const delta=newUnit-oldUnit;
   const items=impactedProducts(eid);
   const list=items.map(p=>{
     const z=productCostBreakdown(p).find(y=>y.ingredientId===eid);
     return `${p.name}: ${delta>=0?'+':''}${money((z?.qty||0)*delta)}`;
   }).join('\n')||'Không có sản phẩm bị ảnh hưởng';
   if(!confirm(`Giá chuẩn thay đổi ${delta>=0?'+':''}${money(delta)}/${x.unit}.\n\nẢnh hưởng dự kiến:\n${list}\n\nLưu thay đổi?`))return;
 }
 if(eid){
   const i=db.ingredients.findIndex(x=>x.id===eid);
   db.ingredients[i]=x;
 }else{
   db.ingredients.push(x);
 }
 // Vòng 3 dùng cùng một luồng lưu này để ghi lịch sử + cảnh báo, không cần định nghĩa lại hàm.
 if(priceChanged&&typeof r3RecordPriceChange==='function') r3RecordPriceChange(x,oldUnit,newUnit,old.unit,x.unit);
 save();closeModal();render('ingredients');
 toast(priceChanged?'Đã lưu · Đã ghi nhận biến động giá':'Đã lưu nguyên liệu');
}
function batchModal(){
 openModal(`<h2>Nhập lô nguyên liệu</h2><div class="form-grid">
  <div class="field full"><label>Nguyên liệu</label><select id="bIng" onchange="syncBatchV21()">${db.ingredients.map(i=>`<option value="${i.id}">${i.name}</option>`).join('')}</select></div>

 if(!document.getElementById('bUnit')?.options.length)populateBatchUnits();
 const selected=f('bUnit')||ing.unit, qty=+f('bQty')||0, mode=document.querySelector('input[name="priceMode"]:checked')?.value||'standard';
 const standardUsage=standardPricePerUnit(ing), standardSelected=priceInUnit(ing,standardUsage,selected), input=document.getElementById('bPrice');
 document.getElementById('batchStdPrice').textContent=`(${money(standardSelected)}/${selected})`;
 input.disabled=mode!=='custom';if(mode==='standard')input.value=standardSelected;
 const price=+input.value||0, diff=price-standardSelected,pct=standardSelected?diff/standardSelected*100:0, normalizedQty=convertQty(qty,selected,ing.unit)||0, lotValue=qty*price;
 document.getElementById('batchPriceInfo').innerHTML=mode==='standard'?`Giá chuẩn: <b>${money(standardSelected)}/${selected}</b> · Giá lô: <b>${money(price)}/${selected}</b> · Chênh lệch: <b>0đ (0%)</b>`:`Giá chuẩn: <b>${money(standardSelected)}/${selected}</b> · Giá lô: <b>${money(price)}/${selected}</b> · Chênh lệch: <b>${diff>=0?'+':''}${money(diff)}</b> (${pct>=0?'+':''}${pct.toFixed(1)}%)`;
 const existing=db.batches.filter(b=>b.ingredientId===ing.id&&b.qty>0), oldQty=existing.reduce((s,b)=>s+b.qty,0),oldValue=existing.reduce((s,b)=>s+b.qty*b.pricePerUnit,0),newQty=oldQty+normalizedQty,newValue=oldValue+lotValue,avg=newQty?newValue/newQty:0;
 document.getElementById('batchImpactInfo').innerHTML=`<b>Sau khi nhập lô này</b><div class="grid three" style="margin-top:10px"><div><small>Tồn tăng</small><div><b>+${num(normalizedQty)} ${ing.unit}</b></div></div><div><small>Giá trị kho tăng</small><div><b>+${money(lotValue)}</b></div></div><div><small>Giá vốn bình quân tồn</small><div><b>${money(avg)}/${ing.unit}</b></div></div></div><div style="font-size:12px;color:var(--muted);margin-top:8px">Giá chuẩn nguyên liệu vẫn <b>${money(standardUsage)}/${ing.unit}</b>, không tự thay đổi.</div>`;

 const standardUsage=standardPricePerUnit(ing),standardSelected=priceInUnit(ing,standardUsage,unit),price=mode==='standard'?standardSelected:+f('bPrice'),normalizedQty=convertQty(qty,unit,ing.unit);
 if(!qty||normalizedQty==null||price<0){toast('Vui lòng kiểm tra số lượng, đơn vị và giá');return}
 const x={id:id(),ingredientId:iid,qty:normalizedQty,unit:ing.unit,enteredQty:qty,enteredUnit:unit,pricePerUnit:price/priceInUnit(ing,1,unit)*standardUsage,enteredPrice:price,priceUnit:unit,priceMode:mode,standardPriceAtEntry:standardUsage,lot:f('bLot'),expiry:f('bExp'),createdAt:new Date().toISOString()};
 // For compatibility, pricePerUnit is always stored per ingredient usage unit.
 x.pricePerUnit=convertQty(1,unit,ing.unit)?price/convertQty(1,unit,ing.unit):price;
 db.batches.push(x);db.cash.push({id:id(),date:today(),type:'expense',category:'Nhập nguyên liệu',amount:qty*price,note:`${ing.name} · Lô ${x.lot||'—'}`});save();closeModal();render('inventory');toast('Đã nhập lô');
}

<script>

// ===== ROUND 1: PRODUCTION ACTUAL COST =====
function finishPlan(pid){
 const p=db.plans.find(x=>x.id===pid); if(!p)return; if(p.shortages.length){toast('Chưa thể hoàn thành vì còn thiếu nguyên liệu');return}
 openModal(`<h2>Hoàn thành sản xuất</h2><p><b>${p.name}</b> · Kế hoạch ${num(p.qty)} sản phẩm</p><div class="form-grid"><div class="field"><label>Sản lượng thực tế</label><input id="actualOutput" type="number" min="0" step="0.01" value="${p.qty}"></div><div class="field"><label>Ghi chú hao hụt</label><input id="actualWasteNote" placeholder="VD: hao hụt khi nướng"></div></div><div id="actualCostPreview" class="alert info" style="margin-top:14px">Giá vốn thực tế sẽ được tính theo giá của các lô nguyên liệu FEFO đã xuất.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="confirmFinishPlan('${pid}')">Hoàn thành</button></div>`);
 updateActualPreview(pid); document.getElementById('actualOutput').oninput=()=>updateActualPreview(pid);
}

function confirmFinishPlan(pid){
 const p=db.plans.find(x=>x.id===pid), actualOutput=+f('actualOutput')||0;if(!p||!actualOutput){toast('Nhập sản lượng thực tế');return}
 let actualCost=0; const movements=[];
 for(const [iid,need] of Object.entries(p.needs||{})){let remain=need;const lots=db.batches.filter(b=>b.ingredientId===iid&&b.qty>0).sort((a,b)=>{const ea=a.expiry||'9999-12-31',eb=b.expiry||'9999-12-31';return ea.localeCompare(eb)});for(const lot of lots){if(remain<=0)break;const take=Math.min(remain,lot.qty);lot.qty-=take;remain-=take;actualCost+=take*lot.pricePerUnit;movements.push({batchId:lot.id,ingredientId:iid,qty:take,unit:lot.unit,unitCost:lot.pricePerUnit})}if(remain>0){toast('Kho thay đổi, không còn đủ nguyên liệu để hoàn thành');return}}
 const theoretical=Object.entries(p.needs||{}).reduce((s,[iid,q])=>s+q*standardPricePerUnit(db.ingredients.find(x=>x.id===iid)),0);
 p.status='done';p.actualOutput=actualOutput;p.theoreticalCost=theoretical;p.actualCost=actualCost;p.actualUnitCost=actualCost/actualOutput;p.wasteQty=Math.max(0,p.qty-actualOutput);p.wastePct=p.qty?Math.max(0,p.qty-actualOutput)/p.qty*100:0;p.actualNote=f('actualWasteNote');p.movements=movements;p.completedAt=new Date().toISOString();
 const prod=db.products.find(x=>x.name===p.name);if(prod)prod.stock+=actualOutput;save();closeModal();render('production');toast(`Hoàn thành · cost thực tế ${money(actualCost)}`);
}

</script>
<script>

// ===== V3.1 — VÒNG 1: CÔNG THỨC & COST CHUẨN =====
// Nâng cấp trên V2.1: công thức con, hao hụt theo dòng, nhân bản, phiên bản/lịch sử,
// ghi chú & thông số sản xuất, cost lý thuyết và cost thực tế theo lô.

(function migrateRecipeData(){
  db.recipeHistory = Array.isArray(db.recipeHistory) ? db.recipeHistory : [];
  db.recipes = Array.isArray(db.recipes) ? db.recipes : [];
  db.recipes.forEach(r=>{
    r.version = Number(r.version)||1;
    r.history = Array.isArray(r.history)?r.history:[];
    r.wastePct = Number(r.wastePct)||0;
    r.notes = r.notes||'';
    r.processTemp = r.processTemp||'';
    r.processTime = r.processTime||'';
    r.lines = (r.lines||[]).map(l=>({
      kind:l.kind||'ingredient',
      ingredientId:l.ingredientId,
      recipeId:l.recipeId,
      qty:Number(l.qty)||0,
      wastePct:Number(l.wastePct)||0
    }));
  });
  save();
})();

let editingRecipeId='';
let recipeReturnDraft=null;

function recipeLineEffectiveQty(l){
  const q=Number(l.qty)||0, w=Math.min(99.99,Math.max(0,Number(l.wastePct)||0))/100;
  return w>=1?q:q/(1-w);
}
function recipeStandardCost(r, seen=[]){
  if(!r || seen.includes(r.id)) return 0;
  const next=[...seen,r.id];
  return (r.lines||[]).reduce((s,l)=>{
    if(l.kind==='recipe'){
      const child=db.recipes.find(x=>x.id===l.recipeId);
      return s+(child?recipeStandardCost(child,next)*(Number(l.qty)||0):0);
    }
    const ing=db.ingredients.find(x=>x.id===l.ingredientId);
    return s+(ing?standardPricePerUnit(ing)*recipeLineEffectiveQty(l):0);
  },0);
}
function recipeLeafNeeds(r,mult=1,seen=[]){
  if(!r||seen.includes(r.id)) return {};
  const out={}, next=[...seen,r.id];
  (r.lines||[]).forEach(l=>{
    if(l.kind==='recipe'){
      const child=db.recipes.find(x=>x.id===l.recipeId);
      const childNeeds=recipeLeafNeeds(child,mult*(Number(l.qty)||0),next);
      Object.entries(childNeeds).forEach(([iid,q])=>out[iid]=(out[iid]||0)+q);
    }else if(l.ingredientId){
      out[l.ingredientId]=(out[l.ingredientId]||0)+mult*recipeLineEffectiveQty(l);
    }
  });
  return out;
}
function recipeTheoreticalCost(r){return recipeStandardCost(r)}
function recipeEffectiveYield(r){const y=Number(r?.yield)||0,w=Math.min(99.99,Math.max(0,Number(r?.wastePct)||0))/100;return y*(1-w)}
function recipeCostPerYield(r){const y=recipeEffectiveYield(r);return y?recipeTheoreticalCost(r)/y:0}
function productCost(p){
  return (p.components||[]).reduce((s,c)=>{
    const r=db.recipes.find(x=>x.id===c.recipeId);
    return s+(r?(recipeTheoreticalCost(r)/recipeEffectiveYield(r)*Number(c.qty||0)):0);
  },0);
}
function productCostBreakdown(p){
  const out=[];
  (p.components||[]).forEach(c=>{
    const r=db.recipes.find(x=>x.id===c.recipeId); if(!r)return;
    const leaves=recipeLeafNeeds(r,Number(c.qty||0));
    Object.entries(leaves).forEach(([iid,qty])=>{
      const ing=db.ingredients.find(x=>x.id===iid); if(!ing)return;
      out.push({ingredientId:iid,name:ing.name,qty,unit:ing.unit,cost:standardPricePerUnit(ing)*qty});
    });
  });
  const map={};out.forEach(x=>{if(!map[x.ingredientId])map[x.ingredientId]={...x};else{map[x.ingredientId].qty+=x.qty;map[x.ingredientId].cost+=x.cost}});
  return Object.values(map);
}
function cloneRecipe(id0){
  const r=db.recipes.find(x=>x.id===id0); if(!r)return;
  const copy=JSON.parse(JSON.stringify(r));
  copy.id=id(); copy.name=r.name+' - Bản sao'; copy.version=1; copy.history=[]; copy.updatedAt=new Date().toISOString();
  db.recipes.push(copy);save();render('recipes');toast('Đã nhân bản công thức');
}
function recipeSnapshot(r){return JSON.parse(JSON.stringify({id:r.id,name:r.name,yield:r.yield,wastePct:r.wastePct,processTemp:r.processTemp,processTime:r.processTime,notes:r.notes,lines:r.lines,version:r.version,updatedAt:r.updatedAt}))}
function recipeVersionData(rid, version){
  const r=db.recipes.find(x=>x.id===rid);if(!r)return null;
  if(Number(version)===Number(r.version||1)) return recipeSnapshot(r);
  return (r.history||[]).find(h=>Number(h.version)===Number(version))||null;
}
function recipeDetailModal(rid, version){
  const r=db.recipes.find(x=>x.id===rid);if(!r)return;
  const currentVersion=Number(r.version)||1;
  const data=recipeVersionData(rid, version||currentVersion);if(!data)return;
  const selectedVersion=Number(data.version)||currentVersion;
  const versions=[{version:currentVersion,label:`v${currentVersion} — Hiện tại`,data:recipeSnapshot(r)},...(r.history||[]).map(h=>({version:Number(h.version)||1,label:`v${h.version}`,data:h}))]
    .filter((v,i,a)=>a.findIndex(x=>x.version===v.version)===i)
    .sort((a,b)=>b.version-a.version);
  const lines=data.lines||[];
  const cost=recipeStandardCost(data);
  const effectiveYield=recipeEffectiveYield(data);
  openModal(`<h2>${data.name||r.name} <span class="badge info">v${selectedVersion}</span></h2>
    <div class="toolbar" style="margin-bottom:16px"><label style="font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px">Xem phiên bản
      <select id="recipeVersionSelect" onchange="recipeDetailModal('${rid}',this.value)">${versions.map(v=>`<option value="${v.version}" ${v.version===selectedVersion?'selected':''}>${v.label}</option>`).join('')}</select>
    </label></div>
    <div class="grid two">
      <div class="card" style="box-shadow:none"><div class="section-title">Tổng quan</div>
        <div class="list-item row"><span>Yield chuẩn</span><b>${num(data.yield)}</b></div>
        <div class="list-item row"><span>Yield sau hao hụt</span><b>${num(effectiveYield)}</b></div>
        <div class="list-item row"><span>Hao hụt công thức</span><b>${num(data.wastePct||0)}%</b></div>
        <div class="list-item row"><span>Cost chuẩn</span><b>${money(cost)}</b></div>
        <div class="list-item row"><span>Cost / yield thực dùng</span><b style="color:var(--green)">${money(effectiveYield?cost/effectiveYield:0)}</b></div>
      </div>
      <div class="card" style="box-shadow:none"><div class="section-title">Thông số & ghi chú</div>
        <div class="list-item"><b>Nhiệt độ / thông số</b><div style="margin-top:5px;color:var(--muted)">${data.processTemp||'—'}</div></div>
        <div class="list-item"><b>Thời gian</b><div style="margin-top:5px;color:var(--muted)">${data.processTime||'—'}</div></div>
        <div class="list-item"><b>Ghi chú / quy trình</b><div style="margin-top:5px;white-space:pre-wrap;color:var(--muted)">${data.notes||'—'}</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;box-shadow:none"><div class="section-title">Thành phần</div><div class="table-wrap"><table class="table"><thead><tr><th>Loại</th><th>Tên</th><th class="num">Lượng</th><th class="num">Hao hụt</th><th class="num">Lượng tính cost</th><th class="num">Cost</th></tr></thead><tbody>${lines.map(l=>{
      if(l.kind==='recipe'){
        const child=db.recipes.find(x=>x.id===l.recipeId), qty=Number(l.qty)||0, c=child?recipeStandardCost(child)*qty:0;
        return `<tr><td><span class="badge info">Công thức con</span></td><td><b>${child?.name||'—'}</b></td><td class="num">${num(qty)} batch</td><td class="num">—</td><td class="num">${num(qty)} batch</td><td class="num">${money(c)}</td></tr>`;
      }
      const ing=db.ingredients.find(x=>x.id===l.ingredientId), qty=Number(l.qty)||0, eff=recipeLineEffectiveQty(l), c=ing?standardPricePerUnit(ing)*eff:0;
      return `<tr><td><span class="badge info">Nguyên liệu</span></td><td><b>${ing?.name||'—'}</b></td><td class="num">${num(qty)} ${ing?.unit||''}</td><td class="num">${num(l.wastePct||0)}%</td><td class="num">${num(eff)} ${ing?.unit||''}</td><td class="num">${money(c)}</td></tr>`;
    }).join('')||'<tr><td colspan="6" class="empty">Chưa có thành phần.</td></tr>'}</tbody></table></div></div>
    <div class="modal-actions"><button class="btn" onclick="recipeHistoryModal('${rid}')">Lịch sử phiên bản</button><button class="btn" onclick="closeModal()">Đóng</button>${selectedVersion===currentVersion?`<button class="btn primary" onclick="recipeModal('${rid}')">Chỉnh sửa</button>`:''}</div>`);
}
function recipeHistoryModal(rid){
  const r=db.recipes.find(x=>x.id===rid);if(!r)return;
  const rows=[recipeSnapshot(r),...(r.history||[])].sort((a,b)=>Number(b.version||0)-Number(a.version||0));
  openModal(`<h2>Lịch sử: ${r.name}</h2><p style="color:var(--muted)">Mỗi lần lưu thay đổi sẽ tạo một phiên bản mới. Bạn có thể mở bất kỳ phiên bản nào để xem lại đầy đủ dữ liệu.</p>
  <div class="table-wrap"><table class="table"><thead><tr><th>Phiên bản</th><th>Thời điểm</th><th>Yield</th><th>Hao hụt</th><th>Ghi chú</th><th></th></tr></thead><tbody>${rows.map(h=>`<tr><td><b>v${h.version}</b>${Number(h.version)===Number(r.version)?' <span class="badge ok">Hiện tại</span>':''}</td><td>${fmtDate(h.updatedAt)}</td><td>${num(h.yield)}</td><td>${num(h.wastePct||0)}%</td><td>${h.notes?'Có ghi chú/quy trình':'—'}</td><td class="num"><button class="btn small" onclick="recipeDetailModal('${rid}',${Number(h.version)})">Xem</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có phiên bản.</td></tr>'}</tbody></table></div>
  <div class="modal-actions"><button class="btn" onclick="recipeDetailModal('${rid}',${Number(r.version)||1})">Quay lại chi tiết</button><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}
function quickIngredientModal(){
  openModal(`<h2>Thêm nguyên liệu nhanh</h2><p style="color:var(--muted);margin-top:-8px">Tạo nguyên liệu ngay khi đang làm công thức.</p>
  <div class="form-grid"><div class="field full"><label>Tên nguyên liệu</label><input id="qiName"></div><div class="field"><label>Nhóm</label><select id="qiGroup"><option>Nguyên liệu</option><option>Bao bì</option></select></div><div class="field"><label>Đơn vị sử dụng</label><select id="qiUnit">${unitOptions('g')}</select></div><div class="field"><label>Quy cách mua</label><input id="qiPack" type="number" value="1000"></div><div class="field"><label>Đơn vị quy cách</label><select id="qiPackUnit">${unitOptions('g')}</select></div><div class="field full"><label>Giá mua / quy cách</label><input id="qiPrice" type="number" value="0"></div></div>
  <div class="modal-actions"><button class="btn" onclick="recipeModal(editingRecipeId)">Quay lại công thức</button><button class="btn primary" onclick="saveQuickIngredient()">Tạo nguyên liệu</button></div>`);
}
function saveQuickIngredient(){
  const x={id:id(),name:f('qiName').trim(),group:f('qiGroup'),unit:f('qiUnit'),pack:+f('qiPack'),packUnit:f('qiPackUnit'),price:+f('qiPrice')};
  const q=convertQty(x.pack,x.packUnit,x.unit);

  db.ingredients.push(x);save();toast('Đã tạo nguyên liệu');recipeModal(editingRecipeId);
}
function recipeModal(editId){
  editingRecipeId=editId||'';
  const x=db.recipes.find(r=>r.id===editId)||{name:'',yield:1,wastePct:0,notes:'',processTemp:'',processTime:'',lines:[{kind:'ingredient',ingredientId:db.ingredients[0]?.id||'',qty:0,wastePct:0}],version:1,history:[]};
  openModal(`<h2>${editId?'Sửa':'Tạo'} công thức ${editId?`<span class="badge info">v${x.version||1}</span>`:''}</h2>
  <div class="form-grid"><div class="field full"><label>Tên công thức</label><input id="rName" value="${x.name||''}"></div><div class="field"><label>Yield / sản lượng chuẩn</label><input id="rYield" type="number" min="0.0001" step="0.01" value="${x.yield||1}"></div><div class="field"><label>Hao hụt chuẩn của công thức (%)</label><input id="rWaste" type="number" min="0" max="99.99" step="0.01" value="${x.wastePct||0}"></div><div class="field"><label>Nhiệt độ / thông số</label><input id="rTemp" value="${x.processTemp||''}" placeholder="VD: 170°C"></div><div class="field"><label>Thời gian</label><input id="rTime" value="${x.processTime||''}" placeholder="VD: 35 phút"></div><div class="field full"><label>Ghi chú / quy trình</label><textarea id="rNotes" rows="3">${x.notes||''}</textarea></div></div>
  <div style="margin-top:18px"><div class="row"><b>Thành phần</b><button class="btn small" onclick="quickIngredientModal()">+ Nguyên liệu mới</button><button class="btn small" onclick="addRecipeLineV31()">+ Thêm dòng</button></div><div id="recipeLines" style="margin-top:10px">${(x.lines||[]).map((l,i)=>recipeLineV31(l,i)).join('')}</div></div>
  <div class="alert info" style="margin-top:14px">Cost chuẩn dùng giá chuẩn nguyên liệu. Hao hụt từng dòng được tính vào lượng cần chuẩn bị; công thức con được tính vào cost và tự bung ra nguyên liệu khi sản xuất.</div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button>${editId?`<button class="btn" onclick="recipeHistoryModal('${editId}')">Lịch sử</button>`:''}<button class="btn primary" onclick="saveRecipeV31('${editId||''}')">Lưu công thức</button></div>`);
}
function recipeLineV31(l,i){
  const kind=l.kind||'ingredient';
  const refs=kind==='recipe'?db.recipes.filter(r=>r.id!==editingRecipeId):db.ingredients;
  return `<div class="recipe-line" style="grid-template-columns:1fr 1.5fr .75fr .65fr auto"><div class="field"><label>Loại</label><select class="rl-kind" onchange="refreshRecipeLineV31(this)"><option value="ingredient" ${kind==='ingredient'?'selected':''}>Nguyên liệu</option><option value="recipe" ${kind==='recipe'?'selected':''}>Công thức con</option></select></div><div class="field"><label>${kind==='recipe'?'Công thức':'Nguyên liệu'}</label><select class="rl-ref">${refs.map(r=>`<option value="${r.id}" ${((kind==='recipe'?l.recipeId:l.ingredientId)===r.id)?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label>${kind==='recipe'?'Số batch':'Lượng'}</label><input class="rl-qty" type="number" min="0" step="0.0001" value="${l.qty||0}"></div><div class="field"><label>Hao hụt %</label><input class="rl-waste" type="number" min="0" max="99.99" step="0.01" value="${l.wastePct||0}" ${kind==='recipe'?'disabled':''}></div><button class="btn remove" onclick="this.parentElement.remove()">×</button></div>`;
}
function refreshRecipeLineV31(sel){
  const row=sel.closest('.recipe-line'),kind=sel.value;
  const ref=row.querySelector('.rl-ref'),labels=row.querySelectorAll('label'),waste=row.querySelector('.rl-waste');
  labels[1].textContent=kind==='recipe'?'Công thức':'Nguyên liệu';labels[2].textContent=kind==='recipe'?'Số batch':'Lượng';
  const refs=kind==='recipe'?db.recipes.filter(r=>r.id!==editingRecipeId):db.ingredients;
  ref.innerHTML=refs.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
  waste.disabled=kind==='recipe';if(kind==='recipe')waste.value=0;
}
function addRecipeLineV31(){document.getElementById('recipeLines').insertAdjacentHTML('beforeend',recipeLineV31({kind:'ingredient',ingredientId:db.ingredients[0]?.id||'',qty:0,wastePct:0},Date.now()))}
function hasRecipeCycle(recipeId,lines){
  const graph={};db.recipes.forEach(r=>graph[r.id]=(r.lines||[]).filter(l=>l.kind==='recipe').map(l=>l.recipeId));graph[recipeId]=(lines||[]).filter(l=>l.kind==='recipe').map(l=>l.recipeId);
  const seen=new Set(),stack=new Set();
  function dfs(n){if(stack.has(n))return true;if(seen.has(n))return false;seen.add(n);stack.add(n);for(const c of graph[n]||[])if(c===recipeId||dfs(c))return true;stack.delete(n);return false}
  return dfs(recipeId);
}
function saveRecipeV31(eid){
  const lines=[...document.querySelectorAll('#recipeLines .recipe-line')].map(row=>{const kind=row.querySelector('.rl-kind').value,ref=row.querySelector('.rl-ref').value,qty=+row.querySelector('.rl-qty').value||0,waste=+row.querySelector('.rl-waste').value||0;return kind==='recipe'?{kind,recipeId:ref,qty}:{kind,ingredientId:ref,qty,wastePct:waste}}).filter(x=>x.qty>0);
  const name=f('rName').trim(),yieldQty=+f('rYield'),wastePct=Math.min(99.99,Math.max(0,+f('rWaste')||0));
  if(!name||!yieldQty||!lines.length){toast('Vui lòng nhập tên, yield và thành phần');return}
  if(eid&&hasRecipeCycle(eid,lines)){toast('Không thể lưu: công thức con tạo vòng lặp');return}
  const old=db.recipes.find(r=>r.id===eid);
  const x={id:eid||id(),name,yield:yieldQty,wastePct,processTemp:f('rTemp'),processTime:f('rTime'),notes:f('rNotes'),lines,version:old?(Number(old.version)||1)+1:1,history:old?(old.history||[]).concat([recipeSnapshot(old)]):[],updatedAt:new Date().toISOString()};
  if(eid)db.recipes[db.recipes.findIndex(r=>r.id===eid)]=x;else db.recipes.push(x);
  save();closeModal();render('recipes');toast(old?`Đã lưu công thức · v${x.version}`:'Đã tạo công thức');
}
function recipes(){
  return `<div class="page-head"><div><h1>Công thức</h1><p>Định lượng, yield, công thức con và giá vốn chuẩn.</p></div><button class="btn primary" onclick="recipeModal()">+ Tạo công thức</button></div>
  <div class="grid three">${db.recipes.map(r=>{const cost=recipeTheoreticalCost(r),nested=(r.lines||[]).filter(l=>l.kind==='recipe').length;return `<div class="card recipe-card" style="cursor:pointer" onclick="recipeDetailModal('${r.id}')" title="Bấm để xem chi tiết công thức"><div class="row"><div><h3 style="margin:0">${r.name}</h3><div style="color:var(--muted);font-size:13px;margin-top:4px">v${r.version||1} · Yield: ${num(r.yield)} · Yield sau hao hụt: ${num(recipeEffectiveYield(r))} · Hao hụt: ${num(r.wastePct||0)}%</div></div><span class="badge info">${r.lines.length} dòng</span></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="row"><span>Cost chuẩn</span><b>${money(cost)}</b></div><div class="row" style="margin-top:8px"><span>Cost / yield</span><b style="color:var(--green)">${money(recipeCostPerYield(r))}</b></div><div style="font-size:12px;color:var(--muted);margin-top:8px">${nested?nested+' công thức con · ':''}${r.processTemp||r.processTime?'Có thông số sản xuất · ':''}${r.notes?'Có ghi chú/quy trình':''}</div><div style="margin-top:15px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn small" onclick="event.stopPropagation();recipeModal('${r.id}')">Chỉnh sửa</button><button class="btn small" onclick="event.stopPropagation();cloneRecipe('${r.id}')">Nhân bản</button><button class="btn small" onclick="event.stopPropagation();recipeHistoryModal('${r.id}')">Lịch sử</button></div></div>`}).join('')}</div>`;
}
function createPlan(){
  const pid=f('plProduct'),qty=+f('plQty'),p=db.products.find(x=>x.id===pid);if(!qty||!p)return;
  const needs={};
  (p.components||[]).forEach(c=>{const r=db.recipes.find(x=>x.id===c.recipeId);if(!r)return;const scale=qty*Number(c.qty||0)/recipeEffectiveYield(r);const leaves=recipeLeafNeeds(r,scale);Object.entries(leaves).forEach(([iid,q])=>needs[iid]=(needs[iid]||0)+q)});
  const inv=inventoryTotals(),shortages=Object.entries(needs).map(([iid,need])=>({name:ingName(iid),unit:db.ingredients.find(x=>x.id===iid).unit,need,have:inv[iid]||0})).filter(x=>x.have<x.need);
  const theoreticalCost=Object.entries(needs).reduce((s,[iid,q])=>s+q*standardPricePerUnit(db.ingredients.find(x=>x.id===iid)),0);
  db.plans.push({id:id(),productId:pid,name:p.name,date:f('plDate'),qty,status:'draft',shortages,needs,theoreticalCost});save();closeModal();render('production');toast(shortages.length?'Đã lưu — kế hoạch đang thiếu nguyên liệu':'Đã lưu — đủ nguyên liệu');
}
function production(){
  return `<div class="page-head"><div><h1>Kế hoạch sản xuất</h1><p>Scale công thức, kiểm tra kho và ghi nhận cost lý thuyết/thực tế.</p></div><button class="btn primary" onclick="planModal()">+ Tạo kế hoạch</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Kế hoạch</th><th>Ngày</th><th class="num">KH</th><th class="num">Thực tế</th><th>Trạng thái</th><th class="num">Cost chuẩn</th><th class="num">Cost thực tế</th><th class="num">Chênh lệch</th><th></th></tr></thead><tbody>${db.plans.length?db.plans.map(p=>{const variance=p.actualCost!=null?p.actualCost-(p.theoreticalCost||0):null;return `<tr><td><b>${p.name}</b></td><td>${fmtDate(p.date)}</td><td class="num">${num(p.qty)}</td><td class="num">${p.actualOutput!=null?num(p.actualOutput):'—'}</td><td><span class="badge ${p.status==='done'?'ok':p.shortages?.length?'danger':'info'}">${p.status==='done'?'Đã hoàn thành':p.status==='draft'?'Nháp':'Đã duyệt'}</span></td><td class="num">${p.theoreticalCost!=null?money(p.theoreticalCost):'—'}</td><td class="num">${p.actualCost!=null?money(p.actualCost):'—'}</td><td class="num">${variance==null?'—':`<span class="badge ${variance>0?'warn':'ok'}">${variance>=0?'+':''}${money(variance)}</span>`}</td><td class="num">${p.status!=='done'?`<button class="btn small" onclick="finishPlan('${p.id}')">Hoàn thành</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Chưa có kế hoạch sản xuất.</td></tr>'}</tbody></table></div></div>`;
}

// Hiển thị cost thực tế đúng theo lô FEFO; không thay đổi giá chuẩn.
function updateActualPreview(pid){
  const p=db.plans.find(x=>x.id===pid),out=+f('actualOutput')||0;if(!p)return;
  const theoretical=p.theoreticalCost!=null?p.theoreticalCost:Object.entries(p.needs||{}).reduce((s,[iid,q])=>s+q*standardPricePerUnit(db.ingredients.find(x=>x.id===iid)),0);
  const existing=Object.entries(p.needs||{}).map(([iid,q])=>{const lots=db.batches.filter(b=>b.ingredientId===iid&&b.qty>0).sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31'));let rem=q,c=0;for(const lot of lots){if(rem<=0)break;const take=Math.min(rem,lot.qty);c+=take*lot.pricePerUnit;rem-=take}return c}).reduce((a,b)=>a+b,0);
  const el=document.getElementById('actualCostPreview');if(el)el.innerHTML=`Cost chuẩn dự kiến: <b>${money(theoretical)}</b> · Cost thực tế theo lô: <b>${money(existing)}</b><br>Cost / sản phẩm thực tế: <b>${money(out?existing/out:0)}</b>${existing>theoretical?`<br><span class="badge warn">Cost thực tế cao hơn ${money(existing-theoretical)}</span>`:existing<theoretical?`<br><span class="badge ok">Cost thực tế thấp hơn ${money(theoretical-existing)}</span>`:''}${out<p.qty?`<br><span class="badge warn">Sản lượng thực tế thấp hơn kế hoạch ${num(p.qty-out)} sản phẩm</span>`:''}`;
}

<script>
// ===== VÒNG 2 — CHỐT VERSION =====
// Đây là block Vòng 2 duy nhất. Các bản V2 cũ đã được loại bỏ để tránh override chồng nhau.
// Các quyết định đã chốt: công sức theo thời gian; bao bì không cộng riêng; fixed cost phân bổ theo sản lượng; thuế + lợi nhuận theo tỷ lệ giá bán; làm tròn giá; cảnh báo và chi tiết giá.
// ===== VÒNG 2 HOÀN CHỈNH — ĐỊNH GIÁ CÓ YẾU TỐ THỜI GIAN =====
// Giữ nguyên toàn bộ Vòng 1. Chỉ thay lớp tính/hiển thị của Vòng 2.
// Bao bì không cộng riêng: đã là một loại nguyên liệu trong công thức.

(function upgradeRound2Time(){
  db.settings=db.settings||{};
  db.settings.r2=Object.assign({
    laborHourly:0,
    directLaborMinutes:0,
    // Giữ tương thích dữ liệu V2 cũ nếu người dùng đã nhập nhân công / sản phẩm.
    laborPerProduct:0,
    utilitiesPerProduct:0,
    depreciationPerProduct:0,
    variablePerProduct:0,
    fixedMonthly:0,
    expectedMonthlyUnits:100,
    tax:Number(db.settings.tax)||0,
    profit:Number(db.settings.profit)||35,
    rounding:1000
  },db.settings.r2||{});
  save();
})();

function r2(){
  db.settings.r2 = db.settings.r2 || {};
  return db.settings.r2;
}
function roundPrice(v){
  const step=Math.max(1,Number(r2().rounding)||1);
  return Math.ceil(Math.max(0,Number(v)||0)/step)*step;
}
function r2FixedPerProduct(){
  const units=Math.max(1,Number(r2().expectedMonthlyUnits)||1);
  return (Number(r2().fixedMonthly)||0)/units;
}

function r2LaborCost(){
  const s=r2();
  const hourly=Math.max(0,Number(s.laborHourly)||0);
  const minutes=Math.max(0,Number(s.directLaborMinutes)||0);
  // Khi đã khai báo cả giá trị 1 giờ công và thời gian trực tiếp, ưu tiên cách tính này.
  if(hourly>0 && minutes>0) return hourly*minutes/60;
  // Dữ liệu cũ vẫn hoạt động, không bị mất.
  return Math.max(0,Number(s.laborPerProduct)||0);
}

function r2Cost(p){
  const recipe=Number(productCost(p))||0;
  const labor=r2LaborCost();
  const utilities=Math.max(0,Number(r2().utilitiesPerProduct)||0);
  const depreciation=Math.max(0,Number(r2().depreciationPerProduct)||0);
  const variable=Math.max(0,Number(r2().variablePerProduct)||0);
  const fixed=r2FixedPerProduct();
  return {recipe,labor,utilities,depreciation,variable,fixed,total:recipe+labor+utilities+depreciation+variable+fixed};
}

function r2SuggestedRaw(p){
  const c=r2Cost(p).total;
  const tax=Math.max(0,Number(r2().tax)||0)/100;
  const profit=Math.max(0,Number(r2().profit)||0)/100;
  const denominator=1-tax-profit;
  if(denominator<=0)return Infinity;
  return c/denominator;
}
function r2Suggested(p){return roundPrice(r2SuggestedRaw(p))}
function r2CurrentMargin(p){
  const price=Number(p.price)||0,cost=r2Cost(p).total;
  return price>0?(price-cost)/price*100:0;
}
function r2CurrentProfit(p){return (Number(p.price)||0)-r2Cost(p).total}
function r2PriceStatus(p){
  const current=Number(p.price)||0,suggested=r2Suggested(p),margin=r2CurrentMargin(p),target=Number(r2().profit)||0;
  if(!current)return {type:'danger',label:'Chưa có giá bán'};
  if(!isFinite(suggested))return {type:'danger',label:'Cần kiểm tra mục tiêu'};
  if(current<suggested)return {type:'danger',label:'Giá hiện tại thấp'};
  if(margin<target)return {type:'warn',label:'Lợi nhuận thấp'};
  return {type:'ok',label:'Ổn'};
}
function r2CostLines(p){
  const c=r2Cost(p),s=r2();
  const laborNote=(Number(s.laborHourly)>0&&Number(s.directLaborMinutes)>0)
    ? `${money(Number(s.laborHourly))}/giờ × ${num(Number(s.directLaborMinutes))} phút`
    : 'Đang dùng mức nhân công cũ / sản phẩm';
  return [
    ['Nguyên liệu',c.recipe,'Theo cost chuẩn của công thức'],
    ['Công sức',c.labor,laborNote],
    ['Điện & nước',c.utilities,'Chi phí ước tính cho 1 sản phẩm'],
    ['Khấu hao',c.depreciation,'Máy móc, lò, tủ, dụng cụ...'],
    ['Chi phí biến đổi khác',c.variable,'Các khoản tăng theo sản lượng'],
    ['Chi phí cố định phân bổ',c.fixed,`Từ ${money(Number(s.fixedMonthly)||0)}/tháng ÷ ${num(Number(s.expectedMonthlyUnits)||0)} sản phẩm`]
  ];
}
function r2CostDetailHtml(p){
  const c=r2Cost(p);
  return `<div class="list">${r2CostLines(p).map(x=>`<div class="list-item row"><div><b>${x[0]}</b><div style="font-size:11px;color:var(--muted);margin-top:3px">${x[2]}</div></div><b>${money(x[1])}</b></div>`).join('')}</div>
  <div class="alert info" style="margin-top:12px"><div>💡</div><div><b>Để làm 1 ${p.name}, hiện đang tính khoảng ${money(c.total)}.</b><div style="font-size:12px;margin-top:4px">Bao bì không cộng riêng vì đã nằm trong nguyên liệu của công thức.</div></div></div>`;
}

function priceGuideModal(pid){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  const c=r2Cost(p),current=Number(p.price)||0,raw=r2SuggestedRaw(p),suggested=r2Suggested(p);
  const currentProfit=r2CurrentProfit(p),currentMargin=r2CurrentMargin(p),targetProfit=Number(r2().profit)||0,tax=Number(r2().tax)||0,status=r2PriceStatus(p);
  const diff=suggested-current;
  openModal(`<h2>${p.name}</h2>
    <div class="grid two">
      <div class="card" style="box-shadow:none">
        <div class="section-title">1. Làm 1 cái hết bao nhiêu?</div>
        ${r2CostDetailHtml(p)}
      </div>
      <div class="card" style="box-shadow:none">
        <div class="section-title">2. Giá hiện tại đang thế nào?</div>
        <div class="stat"><div class="label">Giá đang bán</div><div class="value">${money(current)}</div></div>
        <div class="list" style="margin-top:10px">
          <div class="list-item row"><span>Tổng chi phí</span><b>${money(c.total)}</b></div>
          <div class="list-item row"><span>Còn lại</span><b class="${currentProfit<0?'badge danger':'badge ok'}">${money(currentProfit)}</b></div>
          <div class="list-item row"><span>Tỷ lệ còn lại</span><b>${currentMargin.toFixed(1)}%</b></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;box-shadow:none">
      <div class="section-title">3. Giá bán đề xuất</div>
      <div style="font-size:13px;color:var(--muted)">Dựa trên toàn bộ chi phí ở trên + <b>${tax}%</b> thuế dự phòng + <b>${targetProfit}%</b> <b>lợi nhuận mong muốn</b>.</div>
      <div style="font-size:34px;font-weight:900;color:var(--green);margin-top:8px">${isFinite(suggested)?money(suggested):'—'}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Giá tính trước làm tròn: ${isFinite(raw)?money(raw):'Không thể tính'}</div>
      <div class="alert ${status.type}" style="margin-top:12px"><div>${status.type==='ok'?'🟢':status.type==='warn'?'🟠':'🔴'}</div><div><b>${status.label}</b><div style="font-size:12px;margin-top:3px">${current<suggested?'Giá hiện tại thấp hơn mức đề xuất khoảng '+money(Math.abs(diff))+'.':current>suggested?'Giá hiện tại cao hơn mức đề xuất khoảng '+money(Math.abs(diff))+'.':'Giá hiện tại đang sát mức đề xuất.'}</div></div></div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}

function productsRound2(){
  return `<div class="page-head"><div><h1>Sản phẩm</h1><p>Xem rất đơn giản: làm 1 cái hết bao nhiêu → đang bán bao nhiêu → còn lại bao nhiêu → nên bán khoảng bao nhiêu.</p></div><button class="btn primary" onclick="productModal()">+ Thêm sản phẩm</button></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Sản phẩm</th><th class="num">Làm 1 cái hết</th><th class="num">Đang bán</th><th class="num">Còn lại</th><th class="num">Giá bán đề xuất</th><th>Tình trạng</th><th></th></tr></thead><tbody>

<script>
// ===== VÒNG 3 — BIẾN ĐỘNG GIÁ & CẢNH BÁO ẢNH HƯỞNG =====
// Theo dõi lịch sử giá và cảnh báo ảnh hưởng; cảnh báo chỉ đếm khi chưa xem.

(function migrateRound3(){
  db.priceHistory = Array.isArray(db.priceHistory) ? db.priceHistory : [];
  db.priceAlerts = Array.isArray(db.priceAlerts) ? db.priceAlerts : [];
  db.priceHistory.forEach(h=>{
    h.oldPrice = Number(h.oldPrice)||0;
    h.newPrice = Number(h.newPrice)||0;
    h.delta = Number(h.delta)||0;
    h.deltaPct = Number(h.deltaPct)||0;
    h.affectedRecipes = Array.isArray(h.affectedRecipes)?h.affectedRecipes:[];
    h.affectedProducts = Array.isArray(h.affectedProducts)?h.affectedProducts:[];
  });
  db.priceAlerts.forEach(a=>{
    a.affectedRecipes = Array.isArray(a.affectedRecipes)?a.affectedRecipes:[];
    a.affectedProducts = Array.isArray(a.affectedProducts)?a.affectedProducts:[];
    a.costDelta = Number(a.costDelta)||0;
    a.profitDelta = Number(a.profitDelta)||0;
    a.read = a.read===true;
    a.readAt = a.readAt||null;
  });
  save();
})();

function r3RecipeUsesIngredient(recipeId, ingredientId, seen=[]){
  if(seen.includes(recipeId)) return false;
  const r=db.recipes.find(x=>x.id===recipeId); if(!r)return false;
  const next=[...seen,recipeId];
  return (r.lines||[]).some(l=>l.kind==='ingredient'
    ? l.ingredientId===ingredientId
    : l.kind==='recipe' && r3RecipeUsesIngredient(l.recipeId,ingredientId,next));
}
function r3AffectedRecipes(ingredientId){
  return db.recipes.filter(r=>r3RecipeUsesIngredient(r.id,ingredientId)).map(r=>({id:r.id,name:r.name}));
}
function r3AffectedProducts(ingredientId){
  return db.products.filter(p=>(productCostBreakdown(p)||[]).some(x=>x.ingredientId===ingredientId)).map(p=>({id:p.id,name:p.name}));
}
function r3ProductCostDelta(p, ingredientId, unitDelta){
  const row=(productCostBreakdown(p)||[]).find(x=>x.ingredientId===ingredientId);
  return row ? row.qty*unitDelta : 0;
}
function r3RecipeCostDelta(r, ingredientId, unitDelta){
  const needs=recipeLeafNeeds(r,1)||{};
  return Number(needs[ingredientId]||0)*unitDelta;
}
function r3RecordPriceChange(ingredient, oldPrice, newPrice, oldUnit, newUnit){
  const delta=newPrice-oldPrice;
  if(Math.abs(delta)<1e-12) return null;
  const affectedRecipes=r3AffectedRecipes(ingredient.id);
  const affectedProducts=r3AffectedProducts(ingredient.id);
  const unit=ingredient.unit;
  const recipeRows=affectedRecipes.map(r=>{
    const recipe=db.recipes.find(x=>x.id===r.id);
    const costDelta=r3RecipeCostDelta(recipe,ingredient.id,delta);
    return {id:r.id,name:r.name,costDelta};
  });
  const productRows=affectedProducts.map(p=>{
    const prod=db.products.find(x=>x.id===p.id);
    const costDelta=r3ProductCostDelta(prod,ingredient.id,delta);
    const oldCost=(r2Cost(prod)||{}).total||0;
    const newCost=oldCost+costDelta;
    return {id:p.id,name:p.name,costDelta,oldCost,newCost,profitDelta:-costDelta,oldProfit:(Number(prod.price)||0)-oldCost,newProfit:(Number(prod.price)||0)-newCost};
  });
  const entry={
    id:id(),date:new Date().toISOString(),ingredientId:ingredient.id,ingredientName:ingredient.name,
    unit,oldPrice,newPrice,delta,deltaPct:oldPrice?delta/oldPrice*100:0,
    oldUnit,newUnit,affectedRecipes:recipeRows,affectedProducts:productRows
  };
  db.priceHistory.unshift(entry);
  const direction=delta>0?'tăng':'giảm';
  productRows.forEach(p=>{
    db.priceAlerts.unshift({
      id:id(),date:entry.date,type:delta>0?'warn':'info',
      title:`${ingredient.name} ${direction} giá`,
      detail:`${delta>0?'+':''}${money(delta)}/${unit} · ${delta>=0?'+':''}${entry.deltaPct.toFixed(1)}% → ${p.name} ${delta>=0?'tăng':'giảm'} cost ${money(Math.abs(p.costDelta))}`,
      ingredientId:ingredient.id,ingredientName:ingredient.name,
      productId:p.id,productName:p.name,costDelta:p.costDelta,profitDelta:p.profitDelta,
      affectedRecipes:affectedRecipes.map(r=>r.id),affectedProducts:[p.id],
      read:false,readAt:null
    });
  });
  if(!productRows.length && affectedRecipes.length){
    db.priceAlerts.unshift({
      id:id(),date:entry.date,type:delta>0?'warn':'info',title:`${ingredient.name} ${direction} giá`,
      detail:`${delta>0?'+':''}${money(delta)}/${unit} · ${entry.deltaPct.toFixed(1)}% · Có ${affectedRecipes.length} công thức bị ảnh hưởng.`,
      ingredientId:ingredient.id,ingredientName:ingredient.name,affectedRecipes:affectedRecipes.map(r=>r.id),affectedProducts:[],costDelta:0,profitDelta:0,
      read:false,readAt:null
    });
  }
  return entry;
}
function r3PriceHistoryForIngredient(iid){return db.priceHistory.filter(h=>h.ingredientId===iid).sort((a,b)=>b.date.localeCompare(a.date));}
function r3PriceHistoryModal(iid){
  const ing=db.ingredients.find(i=>i.id===iid); if(!ing)return;
  const rows=r3PriceHistoryForIngredient(iid);
  openModal(`<h2>Lịch sử giá: ${ing.name}</h2>
    <p style="color:var(--muted)">Mỗi lần giá chuẩn thay đổi, hệ thống lưu lại giá cũ, giá mới và những công thức/sản phẩm bị ảnh hưởng.</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>Thời điểm</th><th class="num">Giá cũ</th><th class="num">Giá mới</th><th class="num">Thay đổi</th><th class="num">%</th><th>Ảnh hưởng</th></tr></thead><tbody>
    ${rows.map(h=>`<tr><td>${fmtDate(h.date)}</td><td class="num">${money(h.oldPrice)}/${h.unit}</td><td class="num"><b>${money(h.newPrice)}/${h.unit}</b></td><td class="num"><span class="badge ${h.delta>0?'warn':'info'}">${h.delta>0?'+':''}${money(h.delta)}</span></td><td class="num">${h.deltaPct>=0?'+':''}${h.deltaPct.toFixed(1)}%</td><td>${h.affectedRecipes.length} công thức · ${h.affectedProducts.length} sản phẩm</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có biến động giá.</td></tr>'}</tbody></table></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}
function r3ImpactModal(historyId){
  const h=db.priceHistory.find(x=>x.id===historyId); if(!h)return;
  openModal(`<h2>Ảnh hưởng: ${h.ingredientName}</h2>
    <div class="alert ${h.delta>0?'warn':'info'}"><div>${h.delta>0?'🟠':'🔵'}</div><div><b>${h.delta>0?'Giá tăng':'Giá giảm'} ${h.delta>0?'+':''}${money(h.delta)}/${h.unit}</b><div style="font-size:12px;margin-top:3px">${h.deltaPct>=0?'+':''}${h.deltaPct.toFixed(1)}% · ${fmtDate(h.date)}</div></div></div>

render=function(page){

<script>
// ===== VÒNG 4 — KHO + SẢN XUẤT CHUẨN =====
// Giữ nguyên Vòng 1–3. Vòng 4 bổ sung:
// Phiếu nhập · lịch sử kho · điều chỉnh tồn · FEFO · giá vốn theo lô
// · xuất nguyên liệu theo lô · nhiều sản phẩm/kế hoạch · ngày/tuần
// · Draft → Approved → Producing → Completed · sản lượng thực tế
// · hao hụt thực tế · so sánh lý thuyết/thực tế.
//
// Nguyên tắc dữ liệu:
// - Giá chuẩn của nguyên liệu không bị thay đổi khi nhập một lô.
// - Giá vốn thực tế của sản xuất lấy đúng giá của các lô đã xuất.
// - Mọi nhập/xuất/điều chỉnh đều có lịch sử kho.
// - FEFO = ưu tiên lô có HSD sớm nhất còn hạn.
// - Khi bắt đầu Producing, nguyên liệu được xuất khỏi kho theo FEFO.
// - Khi Completed, chỉ ghi nhận sản lượng/hao hụt và tính cost thực tế; không xuất kho lần nữa.

(function migrateRound4(){
  db.inventoryHistory = Array.isArray(db.inventoryHistory) ? db.inventoryHistory : [];
  db.purchaseReceipts = Array.isArray(db.purchaseReceipts) ? db.purchaseReceipts : [];
  db.plans = Array.isArray(db.plans) ? db.plans : [];
  db.plans.forEach(p=>{
    if(p.status==='done') p.status='completed';
    p.items = Array.isArray(p.items) ? p.items : (p.productId ? [{productId:p.productId,qty:Number(p.qty)||0}] : []);
    p.status = p.status || 'draft';
    p.needs = p.needs || {};
    p.shortages = Array.isArray(p.shortages) ? p.shortages : [];
    p.issued = Array.isArray(p.issued) ? p.issued : [];
    p.actualOutput = p.actualOutput==null ? null : Number(p.actualOutput);
    p.actualWasteQty = Number(p.actualWasteQty)||0;
    p.actualWastePct = Number(p.actualWastePct)||0;
  });
  save();
})();

function r4StatusLabel(s){
  return ({draft:'Nháp',approved:'Đã duyệt',producing:'Đang sản xuất',completed:'Đã hoàn thành'})[s]||'Nháp';
}
function r4StatusClass(s){
  return ({draft:'info',approved:'ok',producing:'warn',completed:'ok'})[s]||'info';
}
function r4Week(d){
  const x=new Date(d+'T00:00:00'); if(Number.isNaN(x.getTime())) return '';
  const day=x.getDay()||7; x.setDate(x.getDate()+4-day);
  const yearStart=new Date(x.getFullYear(),0,1);
  return `${x.getFullYear()}-W${String(Math.ceil((((x-yearStart)/86400000)+1)/7)).padStart(2,'0')}`;
}
function r4LotValue(b){return Number(b.qty||0)*Number(b.pricePerUnit||0);}
function r4ValidLots(iid){
  const now=today();
  return db.batches.filter(b=>b.ingredientId===iid&&Number(b.qty)>0&&(!b.expiry||b.expiry>=now))
    .sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31') || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
}
function r4ExpiredLots(iid){
  const now=today();
  return db.batches.filter(b=>b.ingredientId===iid&&Number(b.qty)>0&&b.expiry&&b.expiry<now);
}
function r4RecordMovement(type,b,qty,note,extra={}){
  const ing=db.ingredients.find(i=>i.id===b.ingredientId);
  const h={id:id(),date:new Date().toISOString(),type,
    ingredientId:b.ingredientId,ingredientName:ing?.name||'—',
    batchId:b.id,lot:b.lot||'—',qty:Number(qty)||0,unit:b.unit||ing?.unit||'',
    unitCost:Number(b.pricePerUnit)||0,value:(Number(qty)||0)*(Number(b.pricePerUnit)||0),
    note:note||'',...extra};
  db.inventoryHistory.unshift(h);
  return h;
}
function r4RecordSimpleMovement(type,ingredientId,qty,unit,note,extra={}){
  const ing=db.ingredients.find(i=>i.id===ingredientId);
  db.inventoryHistory.unshift({id:id(),date:new Date().toISOString(),type,ingredientId,ingredientName:ing?.name||'—',batchId:null,lot:'—',qty:Number(qty)||0,unit,value:0,note:note||'',...extra});
}

function r4ReceiptLine(l={}){
  const ing=db.ingredients.find(i=>i.id===l.ingredientId)||db.ingredients[0];
  const units=ing ? Object.keys(UNIT_GROUPS[unitInfo(ing.unit).group]||{[ing.unit]:1}) : ['g'];
  const selectedUnit=l.unit||ing?.unit||'g';
  return `<div class="card r4-receipt-line" style="padding:12px;margin-bottom:9px;box-shadow:none">
    <div class="form-grid">
      <div class="field full"><label>Nguyên liệu</label><select class="r4-ri">${db.ingredients.map(i=>`<option value="${i.id}" ${i.id===ing?.id?'selected':''}>${i.name}</option>`).join('')}</select></div>
      <div class="field"><label>Số lượng</label><input class="r4-rq" type="number" min="0" step="0.001" value="${l.qty||''}"></div>
      <div class="field"><label>Đơn vị nhập</label><select class="r4-ru">${units.map(u=>`<option value="${u}" ${u===selectedUnit?'selected':''}>${u}</option>`).join('')}</select></div>
      <div class="field"><label>Giá / đơn vị nhập</label><input class="r4-rp" type="number" min="0" step="0.01" value="${l.price||''}"></div>
      <div class="field"><label>Số lô</label><input class="r4-rlot" value="${l.lot||''}"></div>
      <div class="field"><label>Hạn sử dụng</label><input class="r4-rexp" type="date" value="${l.expiry||''}"></div>
      <div class="field"><label>Giá</label><select class="r4-rmode"><option value="standard" ${l.mode!=='custom'?'selected':''}>Theo giá chuẩn</option><option value="custom" ${l.mode==='custom'?'selected':''}>Giá tùy chỉnh</option></select></div>
      <div class="field" style="display:flex;justify-content:flex-end"><button class="btn small danger" onclick="this.closest('.r4-receipt-line').remove()">Xóa dòng</button></div>
    </div>
  </div>`;
}
function r4SyncReceiptLine(row){
  const ing=db.ingredients.find(i=>i.id===row.querySelector('.r4-ri').value); if(!ing)return;
  const unitSel=row.querySelector('.r4-ru'), group=unitInfo(ing.unit).group, units=Object.keys(UNIT_GROUPS[group]||{[ing.unit]:1});
  const current=unitSel.value;
  unitSel.innerHTML=units.map(u=>`<option value="${u}" ${u===current||(!units.includes(current)&&u===ing.unit)?'selected':''}>${u}</option>`).join('');
  const unit=unitSel.value, mode=row.querySelector('.r4-rmode').value;
  const std=priceInUnit(ing,standardPricePerUnit(ing),unit);
  const price=row.querySelector('.r4-rp');
  if(mode==='standard') price.value=std;
}
function addR4ReceiptLine(){
  const box=document.getElementById('r4ReceiptLines');
  box.insertAdjacentHTML('beforeend',r4ReceiptLine({ingredientId:db.ingredients[0]?.id||''}));
  const row=box.lastElementChild; row.querySelector('.r4-ri').onchange=()=>r4SyncReceiptLine(row);
  row.querySelector('.r4-rmode').onchange=()=>r4SyncReceiptLine(row);
  r4SyncReceiptLine(row);
}
function r4ReceiptModal(){
  if(!db.ingredients.length){toast('Chưa có nguyên liệu để nhập kho');return}
  const no='PN-'+today().replaceAll('-','')+'-'+String(db.purchaseReceipts.length+1).padStart(3,'0');
  openModal(`<h2>Phiếu nhập kho</h2>
    <div class="form-grid">
      <div class="field"><label>Số phiếu</label><input id="r4ReceiptNo" value="${no}"></div>
      <div class="field"><label>Ngày nhập</label><input id="r4ReceiptDate" type="date" value="${today()}"></div>
      <div class="field full"><label>Nhà cung cấp</label><input id="r4Supplier" placeholder="Không bắt buộc"></div>
      <div class="field full"><label>Ghi chú</label><textarea id="r4ReceiptNote" rows="2" placeholder="Ví dụ: nhập hàng tuần"></textarea></div>
    </div>
    <div style="margin-top:18px"><div class="row"><b>Các dòng nhập</b><button class="btn small" onclick="addR4ReceiptLine()">+ Thêm dòng</button></div>
    <div id="r4ReceiptLines" style="margin-top:10px">${r4ReceiptLine({ingredientId:db.ingredients[0]?.id||''})}</div></div>
    <div id="r4ReceiptTotal" class="alert info" style="margin-top:12px">Tổng phiếu: 0đ</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="r4SaveReceipt()">Nhập kho</button></div>`);
  const first=document.querySelector('#r4ReceiptLines .r4-receipt-line');
  first.querySelector('.r4-ri').onchange=()=>r4SyncReceiptLine(first);
  first.querySelector('.r4-rmode').onchange=()=>r4SyncReceiptLine(first);
  first.querySelector('.r4-rq').oninput=()=>r4UpdateReceiptTotal();
  first.querySelector('.r4-rp').oninput=()=>r4UpdateReceiptTotal();
  r4SyncReceiptLine(first);
  r4UpdateReceiptTotal();
}
function r4UpdateReceiptTotal(){
  const rows=[...document.querySelectorAll('#r4ReceiptLines .r4-receipt-line')];
  const total=rows.reduce((s,row)=>(s+(+row.querySelector('.r4-rq').value||0)*(+row.querySelector('.r4-rp').value||0)),0);
  const el=document.getElementById('r4ReceiptTotal');if(el)el.innerHTML=`Tổng phiếu: <b>${money(total)}</b> · ${rows.length} dòng`;
}
function r4SaveReceipt(){
  const rows=[...document.querySelectorAll('#r4ReceiptLines .r4-receipt-line')];
  const receiptNo=f('r4ReceiptNo').trim(), date=f('r4ReceiptDate')||today();
  if(!receiptNo||!rows.length){toast('Vui lòng nhập số phiếu và ít nhất một dòng');return}
  const items=[]; let total=0;
  for(const row of rows){
    const iid=row.querySelector('.r4-ri').value,ing=db.ingredients.find(i=>i.id===iid);
    const qty=+row.querySelector('.r4-rq').value||0,unit=row.querySelector('.r4-ru').value;
    const mode=row.querySelector('.r4-rmode').value, enteredPrice=+row.querySelector('.r4-rp').value||0;
    const standard=priceInUnit(ing,standardPricePerUnit(ing),unit);
    const price=mode==='standard'?standard:enteredPrice;
    const normalizedQty=convertQty(qty,unit,ing.unit);
    if(!ing||qty<=0||normalizedQty==null||price<0){toast(`Dòng ${ing?.name||''} chưa hợp lệ`);return}
    const batch={id:id(),ingredientId:iid,qty:normalizedQty,unit:ing.unit,enteredQty:qty,enteredUnit:unit,
      pricePerUnit:price/(convertQty(1,unit,ing.unit)||1),enteredPrice:price,priceUnit:unit,priceMode:mode,

function r4SaveAdjustment(){
  const iid=f('r4AdjIng'),lotId=f('r4AdjLot'),delta=+f('r4AdjQty')||0,reason=f('r4AdjReason').trim(),ing=db.ingredients.find(i=>i.id===iid);
  if(!delta||!reason){toast('Nhập số lượng thay đổi và lý do');return}
  if(lotId){
    const b=db.batches.find(x=>x.id===lotId);if(!b)return;
    if(b.qty+delta<0){toast('Không thể giảm quá số lượng của lô');return}
    b.qty+=delta;r4RecordMovement('adjust',b,Math.abs(delta),reason,{adjustment:delta});
  }else{
    if(delta<0){
      const available=r4ValidLots(iid).reduce((s,b)=>s+Number(b.qty||0),0);
      if(available+1e-9<Math.abs(delta)){toast('Không đủ tồn khả dụng để giảm');return}
      let remain=Math.abs(delta);
      for(const b of r4ValidLots(iid)){if(remain<=0)break;const take=Math.min(remain,b.qty);b.qty-=take;remain-=take;r4RecordMovement('adjust',b,take,reason,{adjustment:-take});}
    }else{
      const b={id:id(),ingredientId:iid,qty:delta,unit:ing.unit,pricePerUnit:standardPricePerUnit(ing),priceMode:'adjustment',lot:'ADJ-'+today().replaceAll('-',''),expiry:'',createdAt:new Date().toISOString()};
      db.batches.push(b);r4RecordMovement('adjust',b,delta,reason,{adjustment:delta});
    }
  }
  save();closeModal();render('inventory');toast('Đã điều chỉnh tồn');
}

function r4IssueNeeds(needs,planId,planName){
  const movements=[];
  for(const [iid,need0] of Object.entries(needs||{})){
    let remain=Number(need0)||0;
    const lots=r4ValidLots(iid);
    for(const lot of lots){
      if(remain<=0)break;
      const take=Math.min(remain,Number(lot.qty)||0);
      if(take<=0)continue;
      lot.qty-=take;remain-=take;
      const value=take*Number(lot.pricePerUnit||0);
      const mv={id:id(),batchId:lot.id,ingredientId:iid,qty:take,unit:lot.unit,unitCost:Number(lot.pricePerUnit||0),value,lot:lot.lot||'—',expiry:lot.expiry||'',planId,planName};
      const hist=r4RecordMovement('issue',lot,take,`Xuất cho ${planName||'kế hoạch sản xuất'}`,{planId,planName});
      mv.historyId=hist.id;
      movements.push(mv);
    }
    if(remain>1e-9){
      // Hoàn tác toàn bộ những gì vừa xuất trong lần gọi này.
      movements.forEach(m=>{const b=db.batches.find(x=>x.id===m.batchId);if(b)b.qty+=m.qty;});
      db.inventoryHistory=db.inventoryHistory.filter(h=>!movements.some(m=>m.historyId===h.id));
      return {ok:false,movements,missing:{ingredientId:iid,qty:remain}};
    }
  }
  return {ok:true,movements};
}
function r4IssuedCost(p){
  return (p.issued||[]).reduce((s,m)=>s+Number(m.value||m.qty*m.unitCost||0),0);
}
function r4NeedsForItems(items){
  const needs={};
  (items||[]).forEach(item=>{
    const prod=db.products.find(p=>p.id===item.productId);if(!prod)return;
    (prod.components||[]).forEach(c=>{
      const r=db.recipes.find(x=>x.id===c.recipeId);if(!r)return;
      const scale=Number(item.qty||0)*Number(c.qty||0)/Math.max(1e-9,recipeEffectiveYield(r));
      Object.entries(recipeLeafNeeds(r,scale)).forEach(([iid,q])=>needs[iid]=(needs[iid]||0)+q);
    });
  });
  return needs;
}
function r4PlanShortages(needs){
  const inv=inventoryTotals();
  return Object.entries(needs||{}).map(([iid,need])=>({ingredientId:iid,name:ingName(iid),unit:db.ingredients.find(x=>x.id===iid)?.unit||'',need,have:inv[iid]||0,short:Math.max(0,need-(inv[iid]||0))})).filter(x=>x.short>1e-9);
}

function r4CompletePlan(pid){

  if(!p||p.status!=='producing'||out<=0){toast('Nhập sản lượng thực tế hợp lệ');return}
  if(w<0){toast('Hao hụt không hợp lệ');return}
  const actualCost=r4IssuedCost(p), theoretical=Number(p.theoreticalCost)||0;
  p.status='completed';p.actualOutput=out;p.actualWasteQty=w;p.actualWastePct=(p.qty+w)>0?w/(p.qty+w)*100:0;
  p.actualCost=actualCost;p.actualUnitCost=actualCost/out;p.variance=actualCost-theoretical;
  p.actualWasteNote=f('r4ActualWasteNote');p.completedAt=new Date().toISOString();
  const producedByProduct=(p.items||[]).map(x=>({...x}));
  if(producedByProduct.length){

    producedByProduct.forEach(item=>{

}
