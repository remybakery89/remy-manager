if(document.getElementById('topTitle')?.textContent==='Báo cáo') render('reports');
</script>

<script>
/* =========================================================
   VÒNG 8 — BẢN ỔN ĐỊNH
   Không override go()/render() toàn cục.
   Chỉ gắn trực tiếp các nút V8 và cung cấp màn hình V8.
   ========================================================= */
(function V8Stable(){
  const PAGES={
    dashboard:'Trang chủ', ingredients:'Nguyên liệu', recipes:'Công thức',
    products:'Sản phẩm', inventory:'Kho', production:'Sản xuất', pos:'Bán hàng',
    cashflow:'Dòng tiền', customers:'Khách hàng', alerts:'Cảnh báo',
    reports:'Báo cáo', employees:'Nhân viên', settings:'Cài đặt'
  };

  // ---------- DATA MIGRATION ----------
  db.customers=Array.isArray(db.customers)?db.customers:[];
  db.customerGroups=Array.isArray(db.customerGroups)?db.customerGroups:[
    {id:'cg-retail',name:'Khách lẻ',discount:0,pointRate:1,minPoints:0},
    {id:'cg-member',name:'Thành viên',discount:0,pointRate:1,minPoints:100},
    {id:'cg-vip',name:'VIP',discount:0,pointRate:2,minPoints:500}
  ];
  db.customerGroups.forEach(g=>{
    g.discount=Number(g.discount)||0;
    g.pointRate=Number(g.pointRate)||1;
    g.minPoints=Number(g.minPoints)||0;
  });

  db.loyaltySettings=Object.assign({
    enabled:true,
    amountPerPoint:10000,
    calculateAfterDiscount:true,
    defaultMultiplier:1
  },db.loyaltySettings||{});

  db.roles=Array.isArray(db.roles)?db.roles:[
    {id:'role-admin',name:'Quản trị viên',permissions:['all']},
    {id:'role-sales',name:'Bán hàng',permissions:['dashboard','pos','customers']},
    {id:'role-staff',name:'Nhân viên',permissions:['dashboard','customers']}
  ];
  db.roles.forEach(r=>{
    r.permissions=Array.isArray(r.permissions)?r.permissions:[];
    if(r.id==='role-admin'||r.name==='Quản trị viên')r.permissions=['all'];
  });

  db.employees=Array.isArray(db.employees)?db.employees:[];
  if(!db.employees.length){
    db.employees.push({
      id:'emp_admin',name:'Quản trị viên',phone:'',username:'admin',
      password:'admin',roleId:'role-admin',active:true,note:''
    });
  }
  db.employees.forEach(e=>{
    e.active=e.active!==false;
    if(!e.roleId)e.roleId='role-staff';
    if(!e.username)e.username='user_'+String(e.id).slice(-4);
    if(e.password==null)e.password='';
  });
  let admin=db.employees.find(e=>e.roleId==='role-admin');
  if(!admin){
    admin=db.employees[0];
    admin.roleId='role-admin';
  }
  db.sessionEmployeeId=db.sessionEmployeeId||admin.id;

  db.debts=Array.isArray(db.debts)?db.debts:[];

  function esc(v){
    return String(v??'').replace(/[&<>"']/g,s=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }
  function currentEmployee(){
  return db.employees?.find(e=>e.id===db.sessionEmployeeId) || {
    id:'emp_admin',
    name:'Quản trị viên',
    username:'admin',
    roleId:'role-admin',
    active:true
  };
}
  function currentRole(){
    return db.roles.find(r=>r.id===currentEmployee()?.roleId)||db.roles.find(r=>r.id==='role-staff');
  }
  function isAdmin(){
    const r=currentRole();
    return currentEmployee()?.roleId==='role-admin'||r?.permissions?.includes('all');
  }
  function can(page){
    return isAdmin()||(currentRole()?.permissions||[]).includes(page);
  }
  function debtBalance(cid){
    return db.debts.filter(d=>d.customerId===cid)
      .reduce((s,d)=>s+Math.max(0,(Number(d.amount)||0)-(Number(d.paid)||0)),0);
  }
  function syncDebt(c){
    if(c)c.debt=debtBalance(c.id);
    return c?.debt||0;
  }
  function groupFor(c){
    return db.customerGroups.find(g=>g.id===c?.groupId)||db.customerGroups[0];
  }

  // ---------- CUSTOMER ----------
  function customerModal(editId){
    const x=db.customers.find(c=>c.id===editId)||{
      name:'',phone:'',groupId:db.customerGroups[0]?.id||'',points:0,note:''
    };
    openModal(`<h2>${editId?'Sửa':'Tạo'} khách hàng</h2>
      <div class="form-grid">
        <div class="field full"><label>Tên khách hàng</label><input id="v8cName" value="${esc(x.name)}"></div>
        <div class="field"><label>Số điện thoại</label><input id="v8cPhone" value="${esc(x.phone||'')}"></div>
        <div class="field"><label>Nhóm khách hàng</label><select id="v8cGroup">
          ${db.customerGroups.map(g=>`<option value="${g.id}" ${g.id===x.groupId?'selected':''}>${esc(g.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>Điểm tích lũy</label><input id="v8cPoints" type="number" min="0" value="${Number(x.points)||0}"></div>
        <div class="field full"><label>Ghi chú</label><textarea id="v8cNote" rows="3">${esc(x.note||'')}</textarea></div>
      </div>
      <div class="alert info" style="margin-top:12px">Công nợ hiện tại: <b>${money(debtBalance(editId))}</b>. Công nợ được quản lý theo từng khoản, không cộng tay vào khách.</div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn primary" onclick="v8SaveCustomer('${editId||''}')">Lưu khách hàng</button></div>`);
  }
  window.customerModalV8=customerModal;

  window.v8SaveCustomer=function(editId){
    const x={
      id:editId||id(),name:document.getElementById('v8cName').value.trim(),
      phone:document.getElementById('v8cPhone').value.trim(),
      groupId:document.getElementById('v8cGroup').value,
      points:Math.max(0,+document.getElementById('v8cPoints').value||0),
      note:document.getElementById('v8cNote').value.trim(),
      createdAt:db.customers.find(c=>c.id===editId)?.createdAt||new Date().toISOString()
    };
    if(!x.name)return toast('Vui lòng nhập tên khách hàng');
    const i=db.customers.findIndex(c=>c.id===editId);
    if(i>=0){x.debt=debtBalance(x.id);db.customers[i]=x}else{db.customers.push(x)}
    save();closeModal();renderV8Customers();toast(editId?'Đã cập nhật khách hàng':'Đã tạo khách hàng');
  };

  window.v8CustomerDebt=function(cid){
    const c=db.customers.find(x=>x.id===cid);if(!c)return;
    openModal(`<h2>Ghi công nợ · ${esc(c.name)}</h2>
      <div class="form-grid">
        <div class="field"><label>Ngày</label><input id="v8DebtDate" type="date" value="${today()}"></div>
        <div class="field"><label>Số tiền</label><input id="v8DebtAmount" type="number" min="0" value="0"></div>
        <div class="field full"><label>Ghi chú</label><input id="v8DebtNote" placeholder="VD: Đơn chưa thanh toán"></div>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn primary" onclick="v8SaveDebt('${cid}')">Ghi nợ</button></div>`);
  };
  window.v8SaveDebt=function(cid){
    const amount=+document.getElementById('v8DebtAmount').value||0;
    if(amount<=0)return toast('Nhập số tiền công nợ');
    db.debts.push({id:id(),customerId:cid,date:document.getElementById('v8DebtDate').value,
      amount,paid:0,note:document.getElementById('v8DebtNote').value.trim(),payments:[]});
    const c=db.customers.find(x=>x.id===cid);syncDebt(c);
    save();closeModal();renderV8Customers();toast('Đã ghi công nợ');
  };

  window.v8CustomerDetail=function(cid){
    const c=db.customers.find(x=>x.id===cid);if(!c)return;
    syncDebt(c);
    const orders=db.sales.filter(o=>o.customerId===cid).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const debts=db.debts.filter(d=>d.customerId===cid);
    const spent=orders.reduce((s,o)=>s+Number(o.total||0),0);
    openModal(`<h2>${esc(c.name)}</h2>
      <div class="grid stats">
        <div class="card stat"><div class="label">Số đơn</div><div class="value">${num(orders.length)}</div></div>
        <div class="card stat"><div class="label">Tổng mua</div><div class="value">${money(spent)}</div></div>
        <div class="card stat"><div class="label">Điểm</div><div class="value">${num(c.points)}</div></div>
        <div class="card stat"><div class="label">Còn nợ</div><div class="value">${money(c.debt)}</div></div>
      </div>
      <div class="card" style="margin-top:14px;box-shadow:none"><div class="section-title">Thông tin</div>
        <div class="list-item row"><span>Số điện thoại</span><b>${esc(c.phone)||'—'}</b></div>
        <div class="list-item row"><span>Nhóm</span><b>${esc(groupFor(c)?.name||'—')}</b></div>
        <div class="list-item"><b>Ghi chú</b><div style="margin-top:5px;color:var(--muted)">${esc(c.note)||'—'}</div></div>
      </div>
      <div class="card" style="margin-top:14px;box-shadow:none"><div class="row"><div class="section-title">Công nợ</div><button class="btn small" onclick="v8CustomerDebt('${cid}')">+ Ghi nợ</button></div>
        ${debts.map(d=>`<div class="list-item row"><span>${fmtDate(d.date)} · ${esc(d.note||'Công nợ')}</span><b>${money(Math.max(0,(Number(d.amount)||0)-(Number(d.paid)||0)))}</b></div>`).join('')||'<div class="empty">Không có công nợ.</div>'}
      </div>
      <div class="card" style="margin-top:14px;box-shadow:none"><div class="section-title">Lịch sử mua hàng</div>
        ${orders.map(o=>`<div class="list-item row"><span>${fmtDate(o.date)} · ${(o.items||[]).map(i=>productName(i.pid)+' × '+i.qty).join(', ')||'Đơn hàng'}</span><b>${money(o.total)}</b></div>`).join('')||'<div class="empty">Chưa có lịch sử mua.</div>'}
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
  };

  window.renderV8Customers=function(){
    db.customers.forEach(syncDebt);
    document.getElementById('topTitle').textContent='Khách hàng';
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='customers'));
    document.getElementById('view').innerHTML=`<div class="page-head"><div><h1>Khách hàng</h1><p>Thông tin, lịch sử mua, điểm và công nợ.</p></div><button class="btn primary" onclick="customerModalV8()">+ Tạo khách hàng</button></div>
      <div class="grid stats">
        <div class="card stat"><div class="label">Khách hàng</div><div class="value">${num(db.customers.length)}</div></div>
        <div class="card stat"><div class="label">Tổng điểm</div><div class="value">${num(db.customers.reduce((s,c)=>s+(Number(c.points)||0),0))}</div></div>
        <div class="card stat"><div class="label">Tổng công nợ</div><div class="value">${money(db.customers.reduce((s,c)=>s+debtBalance(c.id),0))}</div></div>
        <div class="card stat"><div class="label">Doanh số</div><div class="value">${money(db.customers.reduce((s,c)=>s+db.sales.filter(o=>o.customerId===c.id).reduce((a,o)=>a+Number(o.total||0),0),0))}</div></div>
      </div>
      <div class="card" style="margin-top:16px"><div class="toolbar"><input class="search" id="v8CustomerSearch" placeholder="Tìm tên hoặc số điện thoại..." oninput="v8FilterCustomers()"></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Khách hàng</th><th>Nhóm</th><th>SĐT</th><th class="num">Điểm</th><th class="num">Công nợ</th><th class="num">Đã mua</th><th></th></tr></thead>
      <tbody>${db.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(groupFor(c)?.name||'—')}</td><td>${esc(c.phone)||'—'}</td><td class="num">${num(c.points)}</td><td class="num">${money(debtBalance(c.id))}</td><td class="num">${money(db.sales.filter(o=>o.customerId===c.id).reduce((s,o)=>s+Number(o.total||0),0))}</td><td class="num"><button class="btn small" onclick="v8CustomerDetail('${c.id}')">Xem</button> <button class="btn small" onclick="customerModalV8('${c.id}')">Sửa</button></td></tr>`).join('')}</tbody></table></div></div>`;
  };
  window.v8FilterCustomers=function(){
    const q=(document.getElementById('v8CustomerSearch')?.value||'').toLowerCase();
    document.querySelectorAll('#view tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none');
  };

  // ---------- EMPLOYEES / ROLES ----------
  function roleOptions(selected){
    return db.roles.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.name)}</option>`).join('');
  }
  window.v8EmployeeModal=function(eid){
    const x=db.employees.find(e=>e.id===eid)||{name:'',phone:'',username:'',password:'',roleId:'role-staff',active:true,note:''};
    openModal(`<h2>${eid?'Sửa':'Thêm'} tài khoản</h2><div class="form-grid">
      <div class="field full"><label>Họ tên</label><input id="v8eName" value="${esc(x.name)}"></div>
      <div class="field"><label>Số điện thoại</label><input id="v8ePhone" value="${esc(x.phone||'')}"></div>
      <div class="field"><label>Tên tài khoản</label><input id="v8eUser" value="${esc(x.username||'')}"></div>
      <div class="field"><label>Vai trò</label><select id="v8eRole">${roleOptions(x.roleId)}</select></div>
      <div class="field"><label>Mật khẩu</label><input id="v8ePass" type="password" value="${esc(x.password||'')}"></div>
      <div class="field"><label>Trạng thái</label><select id="v8eActive"><option value="1" ${x.active!==false?'selected':''}>Đang hoạt động</option><option value="0" ${x.active===false?'selected':''}>Ngưng hoạt động</option></select></div>
      <div class="field full"><label>Ghi chú</label><textarea id="v8eNote" rows="3">${esc(x.note||'')}</textarea></div>
    </div><div class="alert info" style="margin-top:12px">Quyền được lấy theo vai trò. Admin luôn có toàn quyền.</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="v8SaveEmployee('${eid||''}')">Lưu tài khoản</button></div>`);
  };
  window.v8SaveEmployee=function(eid){
    const old=db.employees.find(e=>e.id===eid), roleId=document.getElementById('v8eRole').value;
    if(old&&old.roleId==='role-admin'&&roleId!=='role-admin')return toast('Không thể hạ quyền Admin');
    const x={id:eid||id(),name:document.getElementById('v8eName').value.trim(),phone:document.getElementById('v8ePhone').value.trim(),
      username:document.getElementById('v8eUser').value.trim(),password:document.getElementById('v8ePass').value,
      roleId,active:document.getElementById('v8eActive').value==='1',note:document.getElementById('v8eNote').value.trim(),
      createdAt:old?.createdAt||new Date().toISOString()};
    if(!x.name||!x.username)return toast('Nhập họ tên và tên tài khoản');
    if(db.employees.some(e=>e.username===x.username&&e.id!==eid))return toast('Tên tài khoản đã tồn tại');
    if(x.roleId==='role-admin')x.roleId='role-admin';
    if(old?.roleId==='role-admin'&& !x.active)return toast('Không thể vô hiệu hóa Admin');
    const i=db.employees.findIndex(e=>e.id===eid);if(i>=0)db.employees[i]=x;else db.employees.push(x);
    save();closeModal();renderV8Employees();toast(eid?'Đã cập nhật tài khoản':'Đã tạo tài khoản');
  };
  window.v8EmployeeDetail=function(eid){
    const e=db.employees.find(x=>x.id===eid),r=db.roles.find(x=>x.id===e?.roleId);if(!e)return;
    openModal(`<h2>${esc(e.name)}</h2><div class="list-item row"><span>Tài khoản</span><b>${esc(e.username)}</b></div>
      <div class="list-item row"><span>Vai trò</span><b>${esc(r?.name||'—')}</b></div>
      <div class="list-item row"><span>Trạng thái</span><span class="badge ${e.active!==false?'ok':'warn'}">${e.active!==false?'Đang hoạt động':'Ngưng hoạt động'}</span></div>
      <div class="list-item"><b>Quyền</b><div style="margin-top:6px;color:var(--muted)">${r?.permissions?.includes('all')?'Toàn quyền':(r?.permissions||[]).map(x=>PAGES[x]||x).join(' · ')||'—'}</div></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
  };
  window.renderV8Employees=function(){
    document.getElementById('topTitle').textContent='Nhân viên';
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='employees'));
    document.getElementById('view').innerHTML=`<div class="page-head"><div><h1>Nhân viên & tài khoản</h1><p>Quản lý tài khoản và vai trò.</p></div><button class="btn primary" onclick="v8EmployeeModal()">+ Thêm tài khoản</button></div>
      <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Nhân viên</th><th>SĐT</th><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>
      ${db.employees.map(e=>{const r=db.roles.find(x=>x.id===e.roleId);return `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.phone)||'—'}</td><td>${esc(e.username)}</td><td>${esc(r?.name||'—')}</td><td><span class="badge ${e.active!==false?'ok':'warn'}">${e.active!==false?'Đang hoạt động':'Ngưng hoạt động'}</span></td><td class="num"><button class="btn small" onclick="v8EmployeeDetail('${e.id}')">Xem</button> <button class="btn small" onclick="v8EmployeeModal('${e.id}')">Sửa</button></td></tr>`}).join('')}
      </tbody></table></div></div>`;
  };

  // ---------- LOYALTY SETTINGS ----------
  window.v8SaveLoyalty=function(){
    db.loyaltySettings.enabled=document.getElementById('v8LoyaltyEnabled').value==='1';
    db.loyaltySettings.amountPerPoint=Math.max(1,+document.getElementById('v8PointAmount').value||10000);
    db.loyaltySettings.calculateAfterDiscount=document.getElementById('v8PointAfterDiscount').value==='1';
    db.loyaltySettings.defaultMultiplier=Math.max(0,+document.getElementById('v8PointMultiplier').value||1);
    document.querySelectorAll('.v8Rate').forEach(el=>{const g=db.customerGroups.find(x=>x.id===el.dataset.id);if(g)g.pointRate=Math.max(0,+el.value||0)});
    save();renderV8Settings();toast('Đã lưu cài đặt tích điểm');
  };

  // ---------- ROLE SETTINGS ----------
  window.v8RoleModal=function(rid){
    const r=db.roles.find(x=>x.id===rid)||{id:'',name:'',permissions:['dashboard']};
    const admin=r.id==='role-admin';
    openModal(`<h2>${rid?'Sửa':'Tạo'} vai trò</h2>
      <div class="field"><label>Tên vai trò</label><input id="v8RoleName" value="${esc(r.name)}" ${admin?'disabled':''}></div>
      <div style="margin-top:14px"><b>Quyền truy cập</b><div class="grid three" style="margin-top:10px">
      ${Object.entries(PAGES).map(([k,v])=>`<label style="display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px"><input class="v8Perm" type="checkbox" value="${k}" ${admin||r.permissions.includes(k)?'checked':''} ${admin?'disabled':''}>${v}</label>`).join('')}
      </div></div>
      ${admin?'<div class="alert info" style="margin-top:12px">👑 Admin là cấp cao nhất và luôn có toàn quyền.</div>':''}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="v8SaveRole('${rid||''}')">Lưu vai trò</button></div>`);
  };
  window.v8SaveRole=function(rid){
    const old=db.roles.find(r=>r.id===rid);
    if(old?.id==='role-admin')return toast('Quyền Admin luôn được giữ ở mức cao nhất');
    const name=document.getElementById('v8RoleName').value.trim();
    if(!name)return toast('Nhập tên vai trò');
    if(db.roles.some(r=>r.name.toLowerCase()===name.toLowerCase()&&r.id!==rid))return toast('Tên vai trò đã tồn tại');
    const permissions=[...document.querySelectorAll('.v8Perm:checked')].map(x=>x.value);
    const x={id:rid||id(),name,permissions};
    if(old)db.roles[db.roles.findIndex(r=>r.id===rid)]=x;else db.roles.push(x);
    save();closeModal();renderV8Settings();toast('Đã lưu vai trò');
  };

  window.renderV8Settings=function(){
    document.getElementById('topTitle').textContent='Cài đặt';
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='settings'));
    const s=db.loyaltySettings;
    // QUAN TRỌNG: giữ nguyên toàn bộ Cài đặt V1–V7, sau đó mới nối phần V8.
    // settingsRound2() đã chứa: giá bán, thời gian nhân công, điện/nước,
    // khấu hao, biến đổi, cố định, thuế, lợi nhuận mong muốn, làm tròn giá
    // và toàn bộ thiết lập hóa đơn/logo/QR/nội dung hiển thị.
    let legacyHtml='';
    if(typeof settingsRound2==='function') legacyHtml=settingsRound2();
    else if(typeof settings==='function') legacyHtml=settings();

    const v8Html=`
      <div class="card" style="margin-top:16px"><div class="section-title">⭐ Tích điểm</div><div class="form-grid">
        <div class="field"><label>Tích điểm</label><select id="v8LoyaltyEnabled"><option value="1" ${s.enabled?'selected':''}>Bật</option><option value="0" ${!s.enabled?'selected':''}>Tắt</option></select></div>
        <div class="field"><label>Giá trị để nhận 1 điểm</label><input id="v8PointAmount" type="number" min="1" value="${Number(s.amountPerPoint)||10000}"></div>
        <div class="field"><label>Tính điểm</label><select id="v8PointAfterDiscount"><option value="1" ${s.calculateAfterDiscount?'selected':''}>Sau giảm giá</option><option value="0" ${!s.calculateAfterDiscount?'selected':''}>Trước giảm giá</option></select></div>
        <div class="field"><label>Hệ số mặc định</label><input id="v8PointMultiplier" type="number" min="0" step="0.1" value="${Number(s.defaultMultiplier)||1}"></div>
      </div>
      <div style="margin-top:16px"><b>Hệ số điểm theo nhóm</b><div class="table-wrap"><table class="table"><thead><tr><th>Nhóm</th><th class="num">Từ điểm</th><th class="num">Hệ số</th></tr></thead><tbody>
      ${db.customerGroups.map(g=>`<tr><td>${esc(g.name)}</td><td class="num">${num(g.minPoints||0)}</td><td class="num"><input class="v8Rate" data-id="${g.id}" type="number" min="0" step="0.1" value="${Number(g.pointRate)||1}" style="width:90px"></td></tr>`).join('')}
      </tbody></table></div></div><div class="modal-actions"><button class="btn primary" onclick="v8SaveLoyalty()">Lưu cài đặt tích điểm</button></div></div>

      <div class="card" style="margin-top:16px"><div class="row"><div><div class="section-title">🛡️ Vai trò & phân quyền</div><div style="font-size:13px;color:var(--muted)">Admin luôn có toàn quyền.</div></div><button class="btn primary" onclick="v8RoleModal()">+ Tạo vai trò</button></div>
      ${db.roles.map(r=>`<div class="list-item row"><div><b>${esc(r.name)}</b><div style="font-size:12px;color:var(--muted);margin-top:4px">${r.permissions.includes('all')?'Toàn quyền':(r.permissions.map(x=>PAGES[x]||x).join(' · ')||'Chưa cấp quyền')}</div></div>${r.id==='role-admin'?'<span class="badge info">ADMIN</span>':`<button class="btn small" onclick="v8RoleModal('${r.id}')">Sửa quyền</button>`}</div>`).join('')}</div>`;

    // settingsRound2() trả về một page-head + các card cũ. Không thay thế chúng.
    // Chỉ lấy phần nội dung bên trong để tránh lồng thêm page-head.
    const tmp=document.createElement('div');
    tmp.innerHTML=legacyHtml;
    const legacyContent=tmp.querySelector('.page-head')?.parentElement===tmp ? tmp.innerHTML : legacyHtml;
    document.getElementById('view').innerHTML=legacyContent+v8Html;
  };

  // ---------- POINTS: integrate with existing V5/V6 checkout without replacing it ----------
  const existingComplete=window.completeOrderV5;
  if(existingComplete && !window.__v8PointsWrapped){
    window.completeOrderV5=function(){
      const before=new Set(db.sales.map(o=>o.id));
      existingComplete();
      const order=db.sales.slice().reverse().find(o=>!before.has(o.id));
      if(!order||order.status==='cancelled'||order.pointsApplied||!order.customerId||!db.loyaltySettings.enabled)return;
      const c=db.customers.find(x=>x.id===order.customerId);if(!c)return;
      const g=groupFor(c);
      const base=db.loyaltySettings.calculateAfterDiscount
        ? Math.max(0,Number(order.total||0))
        : Math.max(0,Number(order.subtotal||order.total||0));
      const pts=Math.floor(base/Math.max(1,Number(db.loyaltySettings.amountPerPoint)||10000)
        *Math.max(0,Number(g?.pointRate??db.loyaltySettings.defaultMultiplier)||1));
      c.points=(Number(c.points)||0)+pts;
      order.pointsEarned=pts;order.pointsApplied=true;
      save();
    };
    window.__v8PointsWrapped=true;
  }

  // ---------- ACCOUNT SWITCH ----------
  window.v8LoginModal=function(){
    openModal(`<h2>Đổi tài khoản</h2>
      <div class="form-grid"><div class="field full"><label>Tài khoản</label><select id="v8LoginUser">
      ${db.employees.filter(e=>e.active!==false).map(e=>`<option value="${e.id}">${esc(e.username)} · ${esc(e.name)}</option>`).join('')}
      </select></div><div class="field full"><label>Mật khẩu</label><input id="v8LoginPass" type="password"></div></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="v8Login()">Đăng nhập</button></div>`);
  };
  window.v8Login=function(){
    const e=db.employees.find(x=>x.id===document.getElementById('v8LoginUser').value);
    if(!e)return;
    if(String(e.password||'')!==String(document.getElementById('v8LoginPass').value||''))return toast('Mật khẩu không đúng');
    db.sessionEmployeeId=e.id;save();closeModal();v8RefreshPermissions();go('dashboard');toast(`Đã chuyển sang ${e.name}`);
  };

  // ---------- NAV: chỉ gắn lại các nút V8, không override go/render ----------
  const nav=document.querySelector('.nav');
  if(nav){
    let section=[...nav.querySelectorAll('.nav-section')].find(x=>x.textContent.includes('Hệ thống'));
    if(!section){
      section=document.createElement('div');section.className='nav-section';section.textContent='Khách hàng & nhân viên';nav.appendChild(section);
    }
    function addNav(page,label,icon,handler){
      let b=nav.querySelector(`button[data-page="${page}"]`);
      if(!b){b=document.createElement('button');b.dataset.page=page;b.innerHTML=`<span class="icon">${icon}</span>${label}`;nav.appendChild(b)}
      b.onclick=e=>{e.preventDefault();handler()};
    }
    addNav('customers','Khách hàng','👥',()=>{
  renderV8Customers();
});

addNav('employees','Nhân viên','👤',()=>{
  renderV8Employees();
});

const settingsBtn=nav.querySelector('button[data-page="settings"]');

if(settingsBtn){
  settingsBtn.onclick=e=>{
    e.preventDefault();
    renderV8Settings();
  };
}
  }

  // Quyền được áp dụng ở giao diện menu. Admin luôn thấy tất cả.
  window.v8RefreshPermissions=function(){
  document.querySelectorAll('.nav button[data-page]').forEach(b=>{
    b.style.display='flex';
  });

  const top=document.querySelector('.topbar .top-actions:last-child');

  if(top && !document.getElementById('v8AccountBtn')){
    const b=document.createElement('button');
    b.id='v8AccountBtn';
    b.className='btn small';
    b.onclick=()=>v8LoginModal();
    top.insertBefore(b,top.firstChild);
  }

  const account=document.getElementById('v8AccountBtn');
  if(account){
    account.textContent=`👤 ${currentEmployee()?.name||'Tài khoản'}`;
  }
};
    const top=document.querySelector('.topbar .top-actions:last-child');
    if(top && !document.getElementById('v8AccountBtn')){
      const b=document.createElement('button');
      b.id='v8AccountBtn';b.className='btn small';b.onclick=()=>v8LoginModal();
      top.insertBefore(b,top.firstChild);
    }
    const account=document.getElementById('v8AccountBtn');
    if(account)account.textContent=`👤 ${currentEmployee()?.name||'Tài khoản'}`;
  };

  save();
  window.renderV8Customers=renderV8Customers;
  window.renderV8Employees=renderV8Employees;
  window.renderV8Settings=renderV8Settings;
  v8RefreshPermissions();
})();
</script>

<script src="./v10-sync.js?v=1001"></script>
