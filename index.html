<script>
// ===== VÒNG 4 - BỔ SUNG CHỨC NĂNG ĐÃ CHỐT =====
// Không dọn/gộp code cũ. Chỉ bổ sung/ghi đè đúng các hàm của Vòng 4.
// Mục tiêu: giữ nguyên Trang chủ + Vòng 1-3, đồng thời hoàn thiện kế hoạch sản xuất.
//
// Chốt:
// 1) Một kế hoạch có nhiều sản phẩm.
// 2) Có ngày, tuần, giờ bắt đầu và thời lượng dự kiến.
// 3) Scale công thức theo sản lượng; lưu snapshot công thức/version tại lúc lập kế hoạch.
// 4) Hiển thị công thức đã scale trong chi tiết kế hoạch.
// 5) Hiển thị thiếu nguyên liệu ngay trên màn hình Kế hoạch.
// 6) Luồng Draft -> Approved -> Producing -> Completed.
// 7) Bắt đầu sản xuất mới xuất kho FEFO; hoàn thành không xuất kho lần 2.
// 8) Ghi nhận sản lượng/hao hụt thực tế và cost thực tế theo đúng lô đã xuất.

(function patchRound4Chot(){
  db.plans = Array.isArray(db.plans) ? db.plans : [];
  db.plans.forEach(p=>{
    p.startTime = p.startTime || '';
    p.durationMinutes = Number(p.durationMinutes)||0;
    p.formulaSnapshot = Array.isArray(p.formulaSnapshot) ? p.formulaSnapshot : [];
  });
  save();
})();

function r4RecipeTree(r,seen=[]){
  if(!r||seen.includes(r.id)) return null;
  const next=[...seen,r.id];
  return {
    id:r.id,name:r.name,yield:Number(r.yield)||0,version:Number(r.version)||1,
    wastePct:Number(r.wastePct)||0,processTemp:r.processTemp||'',processTime:r.processTime||'',notes:r.notes||'',
    lines:(r.lines||[]).map(l=>l.kind==='recipe'
      ? {...l,child:r4RecipeTree(db.recipes.find(x=>x.id===l.recipeId),next)}
      : {...l})
  };
}

function r4FormulaRows(tree,multiplier=1,depth=0,rows=[]){
  if(!tree)return rows;
  (tree.lines||[]).forEach(l=>{
    if(l.kind==='recipe'){
      const child=l.child;
      rows.push({type:'recipe',name:child?.name||'Công thức con',depth,base:Number(l.qty)||0,scaled:Number(l.qty||0)*multiplier,unit:'batch'});
      if(child)r4FormulaRows(child,multiplier*(Number(l.qty)||0),depth+1,rows);
    }else{
      const ing=db.ingredients.find(x=>x.id===l.ingredientId);
      const base=recipeLineEffectiveQty(l);
      rows.push({type:'ingredient',ingredientId:l.ingredientId,name:ing?.name||'—',depth,base,scaled:base*multiplier,unit:ing?.unit||'',waste:Number(l.wastePct)||0});
    }
  });
  return rows;
}

function r4FormulaCard(fm){
  const tree=fm.tree, rows=r4FormulaRows(tree,fm.scale), cost=rows.filter(x=>x.type==='ingredient').reduce((s,x)=>{
    const ing=db.ingredients.find(i=>i.id===x.ingredientId);
    return s+(ing?standardPricePerUnit(ing)*x.scaled:0);
  },0);
  return `<div class="card" style="box-shadow:none;margin-top:12px">
    <div class="row"><div><b>${fm.recipeName}</b> <span class="badge info">v${fm.recipeVersion}</span></div><span class="badge ok">Làm ${num(fm.targetYield)} phần</span></div>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 12px">Scale × ${Number(fm.scale).toFixed(3)} · ${tree.processTemp?`Nhiệt độ: ${tree.processTemp} · `:''}${tree.processTime?`Thời gian: ${tree.processTime}`:''}</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>Thành phần</th><th class="num">Gốc</th><th class="num">Sau scale</th><th>Đơn vị</th></tr></thead><tbody>${rows.map(x=>x.type==='recipe'
      ? `<tr><td style="padding-left:${12+x.depth*18}px"><b>↳ ${x.name}</b></td><td class="num">${num(x.base)}</td><td class="num"><b>${num(x.scaled)}</b></td><td>${x.unit}</td></tr>`
      : `<tr><td style="padding-left:${12+x.depth*18}px">${x.name}${x.waste?` <span class="badge warn">hao hụt ${num(x.waste)}%</span>`:''}</td><td class="num">${num(x.base)}</td><td class="num"><b>${num(x.scaled)}</b></td><td>${x.unit}</td></tr>`
    ).join('')}</tbody></table></div>
    <div class="grid two" style="margin-top:10px"><div class="list-item row"><span>Yield sau hao hụt</span><b>${num(recipeEffectiveYield(tree))}</b></div><div class="list-item row"><span>Cost phần này</span><b>${money(cost)}</b></div></div>
    ${tree.notes?`<div class="alert info" style="margin-top:10px"><div>📝</div><div><b>Ghi chú / quy trình</b><div style="white-space:pre-wrap;margin-top:4px">${tree.notes}</div></div></div>`:''}
  </div>`;
}

function r4BuildFormulaSnapshot(items){
  return (items||[]).flatMap(item=>{
    const prod=db.products.find(p=>p.id===item.productId);
    return (prod?.components||[]).map(c=>{
      const r=db.recipes.find(x=>x.id===c.recipeId);
      if(!r)return null;
      const target=Number(item.qty||0)*Number(c.qty||0);
      const scale=target/Math.max(1e-9,recipeEffectiveYield(r));
      return {productId:item.productId,productQty:Number(item.qty)||0,recipeId:r.id,recipeName:r.name,recipeVersion:Number(r.version)||1,
        componentQty:Number(c.qty)||0,targetYield:target,scale,tree:r4RecipeTree(r)};
    }).filter(Boolean);
  });
}

function r4PrintTicket(pid){
  const p=db.plans.find(x=>x.id===pid);if(!p)return;
  const formula=(p.formulaSnapshot||[]).map(r4FormulaCard).join('');
  const w=window.open('','_blank','width=1000,height=800');

  w.document.write(`<html><head><title>Phiếu sản xuất · ${p.name}</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#17211d}h1{font-size:22px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{text-transform:uppercase;font-size:11px;color:#666}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.badge{border-radius:999px;padding:3px 7px;font-size:11px;background:#eef3f0}.table-wrap{overflow:visible}.num{text-align:right!important}</style></head><body><h1>PHIẾU SẢN XUẤT</h1><p><b>${p.name}</b> · ${fmtDate(p.date)} ${p.startTime?`· ${p.startTime}`:''} ${p.durationMinutes?`· dự kiến ${num(p.durationMinutes)} phút`:''}</p><p>Trạng thái: ${r4StatusLabel(p.status)} · Số lượng kế hoạch: ${num(p.qty)}</p>${p.note?`<p><b>Ghi chú:</b> ${p.note}</p>`:''}<h2>Công thức đã scale</h2>${formula}<h2>Nguyên liệu tổng</h2><table><thead><tr><th>Nguyên liệu</th><th>Số lượng cần</th><th>Tồn/đủ</th></tr></thead><tbody>${Object.entries(p.needs||{}).map(([iid,need])=>`<tr><td>${ingName(iid)}</td><td>${num(need)} ${db.ingredients.find(i=>i.id===iid)?.unit||''}</td><td>${num(inventoryTotals()[iid]||0)}</td></tr>`).join('')}</tbody></table><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
<\/script>

</body></html>`);
  w.document.close();w.focus();w.print();
}

function r4SavePlan(){
  const rows=[...document.querySelectorAll('#r4PlanItems .r4-plan-item')],items=rows.map(r=>({productId:r.querySelector('.r4-pi').value,qty:+r.querySelector('.r4-pq').value||0})).filter(x=>x.qty>0);

    durationMinutes:+f('r4PlanDuration')||0,qty:items.reduce((s,x)=>s+x.qty,0),status:'draft',note:f('r4PlanNote').trim(),

}

      <div class="card" style="box-shadow:none"><div class="section-title">Sản phẩm</div>${(p.items||[]).map(x=>`<div class="list-item row"><span>${productName(x.productId)}</span><b>${num(x.qty)}</b></div>`).join('')}</div>
      <div class="card" style="box-shadow:none"><div class="section-title">Tình trạng nguyên liệu</div>
        ${Object.entries(p.needs||{}).map(([iid,need])=>{const ing=db.ingredients.find(x=>x.id===iid),have=(p.status==='producing'||p.status==='completed')?need:(inventoryTotals()[iid]||0),short=Math.max(0,need-have);return `<div class="list-item row"><span>${ing?.name||'—'}</span><span class="badge ${short?'danger':'ok'}">${short?`Thiếu ${num(short)} ${ing?.unit||''}`:'Đủ'}</span></div>`}).join('')||'<div class="empty">Chưa có dữ liệu.</div>'}
      </div>
    </div>
    ${shortages.length?`<div class="alert danger" style="margin-top:12px"><div>🔴</div><div><b>Đang thiếu nguyên liệu</b><div style="margin-top:4px">${shortages.map(x=>`${x.name}: cần ${num(x.need)} ${x.unit} · có ${num(x.have)} · thiếu <b>${num(x.short)} ${x.unit}</b>`).join('<br>')}</div></div></div>`:''}
    <div class="card" style="box-shadow:none;margin-top:12px"><div class="section-title">Công thức đã scale — dùng để sản xuất</div>
      ${formula.length?formula.map(r4FormulaCard).join(''):'<div class="empty">Kế hoạch cũ chưa lưu snapshot công thức. Công thức hiện tại không được dùng để thay thế dữ liệu lịch sử.</div>'}
    </div>
    <div class="card" style="box-shadow:none;margin-top:12px"><div class="section-title">So sánh cost</div>
      <div class="grid three"><div class="list-item row"><span>Lý thuyết</span><b>${money(theoretical)}</b></div><div class="list-item row"><span>Thực tế</span><b>${actual==null?'—':money(actual)}</b></div><div class="list-item row"><span>Chênh lệch</span><b>${actual==null?'—':`${actual-theoretical>=0?'+':''}${money(actual-theoretical)}`}</b></div></div>
    </div>
    <div class="card" style="box-shadow:none;margin-top:12px"><div class="section-title">Xuất nguyên liệu theo lô (${issued.length} dòng)</div>${issued.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nguyên liệu</th><th>Lô</th><th>HSD</th><th class="num">SL</th><th class="num">Giá/đv</th><th class="num">Giá trị</th></tr></thead><tbody>${issued.map(x=>`<tr><td>${ingName(x.ingredientId)}</td><td>${x.lot||'—'}</td><td>${fmtDate(x.expiry)}</td><td class="num">${num(x.qty)} ${x.unit}</td><td class="num">${money(x.unitCost)}</td><td class="num">${money(x.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa xuất nguyên liệu.</div>'}</div>
    ${p.status==='completed'?`<div class="alert ${p.variance>0?'warn':'ok'}" style="margin-top:12px">Sản lượng thực tế: <b>${num(p.actualOutput)}</b> · Hao hụt: <b>${num(p.actualWasteQty)} (${Number(p.actualWastePct||0).toFixed(1)}%)</b> · Cost / SP thực tế: <b>${money(p.actualUnitCost)}</b>${p.actualWasteNote?` · ${p.actualWasteNote}`:''}</div>`:''}
    <div class="modal-actions"><button class="btn" onclick="r4PrintTicket('${pid}')">🖨️ Phiếu sản xuất</button><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}

// Render lại trang Sản xuất bằng các hàm Vòng 4 mới, không đụng các trang khác.
const _productionRound4Chot = productionRound4;
productionRound4 = function(){
  const dates=[...new Set(db.plans.map(p=>p.date).filter(Boolean))].sort().reverse();
  const currentWeek=r4Week(today());
  const weekPlans=db.plans.filter(p=>r4Week(p.date)===currentWeek);
  const counts={draft:0,approved:0,producing:0,completed:0};
  db.plans.forEach(p=>counts[p.status||'draft']++);
  return `<div class="page-head"><div><h1>Kế hoạch & lịch sản xuất</h1><p>Quản lý theo ngày/tuần, từ Nháp → Đã duyệt → Đang sản xuất → Đã hoàn thành.</p></div><button class="btn primary" onclick="r4PlanModal()">+ Tạo kế hoạch</button></div>
    <div class="grid stats">
      <div class="card stat"><div class="label">Nháp</div><div class="value">${counts.draft}</div><div class="sub">Chưa duyệt</div></div>
      <div class="card stat"><div class="label">Đã duyệt</div><div class="value">${counts.approved}</div><div class="sub">Sẵn sàng sản xuất</div></div>
      <div class="card stat"><div class="label">Đang sản xuất</div><div class="value">${counts.producing}</div><div class="sub">Đã xuất nguyên liệu</div></div>
      <div class="card stat"><div class="label">Đã hoàn thành</div><div class="value">${counts.completed}</div><div class="sub">Đã ghi nhận thực tế</div></div>
    </div>
    <div class="card" style="margin-top:16px"><div class="row"><div><div class="section-title" style="margin-bottom:3px">Lịch tuần hiện tại</div><div style="font-size:12px;color:var(--muted)">Tuần ${currentWeek}</div></div><span class="badge ${weekPlans.length?'info':'ok'}">${weekPlans.length} kế hoạch</span></div>
      ${weekPlans.length?`<div class="list">${weekPlans.sort((a,b)=>a.date.localeCompare(b.date)).map(r4PlanListItem).join('')}</div>`:'<div class="empty">Tuần này chưa có kế hoạch.</div>'}</div>
    <div class="card" style="margin-top:16px"><div class="section-title">Lịch sản xuất</div><div class="toolbar"><select id="r4PlanWeekFilter" onchange="r4RenderPlanTable()"><option value="">Tất cả tuần</option>${[...new Set(dates.map(r4Week))].map(w=>`<option value="${w}">${w}</option>`).join('')}</select><input class="search" id="r4PlanSearch" placeholder="Tìm kế hoạch/sản phẩm..." oninput="r4RenderPlanTable()"></div><div id="r4PlanTable"></div></div>`;
};

render('dashboard');
</script>

<script>
// ===== VÒNG 4 PATCH — TỔNG QUAN KẾ HOẠCH + GIỮ NGUYÊN LIỆU + SỬA NHÁP =====
// Không thay đổi dữ liệu của Vòng 1–3. Chỉ bổ sung lớp quản lý kế hoạch.

function r4PlanReservedNeeds(excludeId=''){
  const out={};
  db.plans.filter(p=>p.status==='approved' && p.id!==excludeId).forEach(p=>{
    Object.entries(p.needs||r4NeedsForItems(p.items||[])).forEach(([iid,q])=>out[iid]=(out[iid]||0)+Number(q||0));
  });
  return out;
}

function r4PlanAvailableAfterReservations(excludeId=''){
  const inv=inventoryTotals(), reserved=r4PlanReservedNeeds(excludeId), out={};
  db.ingredients.forEach(i=>out[i.id]=(inv[i.id]||0)-(reserved[i.id]||0));
  return out;
}

// Thiếu của từng kế hoạch luôn nhìn thấy cả các kế hoạch Đã duyệt khác.
// Quy tắc ưu tiên: kế hoạch Đã duyệt trước (ngày + thời điểm tạo) được giữ trước.
function r4PlanShortagesForPlan(p){
  const needs=p.needs||r4NeedsForItems(p.items||[]);
  const reservedOther=r4PlanReservedNeeds(p.id);
  const inv=inventoryTotals();
  return Object.entries(needs).map(([iid,need])=>{
    const ing=db.ingredients.find(x=>x.id===iid);
    const have=Math.max(0,(inv[iid]||0)-(reservedOther[iid]||0));
    return {ingredientId:iid,name:ing?.name||'—',unit:ing?.unit||'',need:Number(need)||0,have,short:Math.max(0,(Number(need)||0)-have)};
  }).filter(x=>x.short>1e-9);
}

// Khi duyệt: không cho một kế hoạch "chiếm" quá số nguyên liệu đã dành cho các kế hoạch duyệt trước.
function r4ApprovePlanV4(pid){
  const p=db.plans.find(x=>x.id===pid);if(!p)return;
  if(p.status!=='draft'){toast('Chỉ kế hoạch Nháp mới có thể duyệt');return}
  const freshNeeds=r4NeedsForItems(p.items||[]);
  const reserved=r4PlanReservedNeeds(pid),inv=inventoryTotals();
  const shortages=Object.entries(freshNeeds).map(([iid,need])=>{
    const ing=db.ingredients.find(x=>x.id===iid),available=Math.max(0,(inv[iid]||0)-(reserved[iid]||0));
    return {ingredientId:iid,name:ing?.name||'—',unit:ing?.unit||'',need:Number(need)||0,have:available,short:Math.max(0,(Number(need)||0)-available)};
  }).filter(x=>x.short>1e-9);
  p.needs=freshNeeds;p.shortages=shortages;
  if(shortages.length){save();render('production');toast('Chưa thể duyệt · nguyên liệu đã được giữ cho kế hoạch khác');return}
  p.status='approved';p.approvedAt=new Date().toISOString();save();render('production');toast('Đã duyệt · nguyên liệu đã được giữ cho kế hoạch này');
}
r4ApprovePlan=r4ApprovePlanV4;

function r4OpenEditDraft(pid){
  const p=db.plans.find(x=>x.id===pid);if(!p)return;
  if(p.status!=='draft'){toast('Chỉ kế hoạch Nháp mới được chỉnh sửa');return}
  const items=(p.items&&p.items.length)?p.items:[{productId:p.productId||db.products[0]?.id,qty:p.qty||1}];
  openModal(`<h2>Chỉnh sửa kế hoạch nháp</h2>
    <div class="form-grid">
      <div class="field"><label>Ngày sản xuất</label><input id="r4PlanDate" type="date" value="${p.date||today()}"></div>
      <div class="field"><label>Giờ bắt đầu dự kiến</label><input id="r4PlanTime" type="time" value="${p.startTime||'08:00'}"></div>
      <div class="field"><label>Thời gian dự kiến (phút)</label><input id="r4PlanDuration" type="number" min="0" step="5" value="${p.durationMinutes||60}"></div>
      <div class="field"><label>Ghi chú kế hoạch</label><input id="r4PlanNote" value="${p.note||''}"></div>
    </div>
    <div style="margin-top:18px"><div class="row"><b>Sản phẩm trong kế hoạch</b><button class="btn small" onclick="r4AddPlanItem()">+ Thêm sản phẩm</button></div>
    <div id="r4PlanItems" style="margin-top:10px">${items.map(r4PlanItem).join('')}</div></div>
    <div id="r4PlanPreview" class="card" style="margin-top:12px;padding:14px;box-shadow:none"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="r4UpdateDraftPlan('${pid}')">Lưu thay đổi</button></div>`);
  r4BindPlanRows();r4UpdatePlanPreview();
}

function r4UpdateDraftPlan(pid){
  const p=db.plans.find(x=>x.id===pid);if(!p||p.status!=='draft'){toast('Không thể sửa kế hoạch này');return}
  const rows=[...document.querySelectorAll('#r4PlanItems .r4-plan-item')];
  const items=rows.map(r=>({productId:r.querySelector('.r4-pi').value,qty:+r.querySelector('.r4-pq').value||0})).filter(x=>x.qty>0);
  if(!items.length){toast('Thêm ít nhất một sản phẩm');return}
  const needs=r4NeedsForItems(items), shortages=r4PlanShortagesForPlan({...p,items,needs});
  const theoreticalCost=Object.entries(needs).reduce((s,[iid,q])=>s+q*standardPricePerUnit(db.ingredients.find(x=>x.id===iid)),0);
  p.items=items;p.productId=items[0].productId;p.name=items.map(x=>productName(x.productId)).join(' + ');
  p.date=f('r4PlanDate')||today();p.startTime=f('r4PlanTime')||'';p.durationMinutes=+f('r4PlanDuration')||0;p.note=f('r4PlanNote').trim();
  p.qty=items.reduce((s,x)=>s+x.qty,0);p.needs=needs;p.shortages=shortages;p.theoreticalCost=theoreticalCost;p.formulaSnapshot=r4BuildFormulaSnapshot(items);p.updatedAt=new Date().toISOString();
  save();closeModal();render('production');toast(shortages.length?'Đã cập nhật nháp · đang thiếu nguyên liệu':'Đã cập nhật kế hoạch nháp');
}

// Ghi nhận một kế hoạch vừa được duyệt vào tổng "đã giữ".
function r4GlobalPlanOverview(){
  const inv=inventoryTotals(), reserved=r4PlanReservedNeeds(), active=db.plans.filter(p=>['draft','approved'].includes(p.status));
  const draftNeeds={}, approvedNeeds={};
  active.filter(p=>p.status==='draft').forEach(p=>Object.entries(p.needs||r4NeedsForItems(p.items||[])).forEach(([iid,q])=>draftNeeds[iid]=(draftNeeds[iid]||0)+Number(q||0)));
  active.filter(p=>p.status==='approved').forEach(p=>Object.entries(p.needs||r4NeedsForItems(p.items||[])).forEach(([iid,q])=>approvedNeeds[iid]=(approvedNeeds[iid]||0)+Number(q||0)));
  const rows=db.ingredients.map(i=>{
    const stock=Number(inv[i.id]||0),held=Number(reserved[i.id]||0),available=Math.max(0,stock-held),draft=Number(draftNeeds[i.id]||0),approved=Number(approvedNeeds[i.id]||0),allNeed=draft+approved;
    return {...i,stock,held,available,draft,approved,allNeed,totalShort:Math.max(0,allNeed-stock)};
  }).filter(x=>x.stock||x.held||x.draft||x.approved);
  return `<div class="card" style="margin-top:16px">
    <div class="row"><div><div class="section-title" style="margin-bottom:3px">Tổng quan nguyên liệu cho tất cả kế hoạch</div><div style="font-size:12px;color:var(--muted)">Mỗi kế hoạch vẫn giữ phần thiếu riêng; bảng này cho bạn thấy toàn cảnh kho và phần nguyên liệu đã được giữ.</div></div><span class="badge info">${active.length} kế hoạch đang lập/đã duyệt</span></div>
    ${rows.length?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Nguyên liệu</th><th class="num">Tồn kho</th><th class="num">Đã giữ</th><th class="num">Còn khả dụng</th><th class="num">Nhu cầu nháp</th><th class="num">Nhu cầu đã duyệt</th><th class="num">Thiếu tổng</th></tr></thead><tbody>${rows.map(x=>`<tr>
      <td><b>${x.name}</b></td><td class="num">${num(x.stock)} ${x.unit}</td><td class="num">${x.held?num(x.held):'—'} ${x.unit}</td>
      <td class="num"><span class="badge ${x.available<=0&&x.held?'warn':'ok'}">${num(x.available)} ${x.unit}</span></td>
      <td class="num">${x.draft?num(x.draft):'—'}</td><td class="num">${x.approved?num(x.approved):'—'}</td>
      <td class="num">${x.totalShort?`<span class="badge danger">Thiếu ${num(x.totalShort)} ${x.unit}</span>`:'<span class="badge ok">Đủ</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có kế hoạch cần tổng hợp.</div>'}
  </div>`;
}

// Hiển thị thiếu riêng của từng kế hoạch, cập nhật theo trạng thái.
// Draft/Approved: đối chiếu với phần khả dụng sau các kế hoạch Approved khác.
// Producing/Completed: nguyên liệu đã được xuất nên không còn báo thiếu theo kho hiện tại.
function r4PlanListItemV4(p){
  const shortages=(p.status==='draft'||p.status==='approved')?r4PlanShortagesForPlan(p):(p.shortages||[]);
  return `<div class="list-item"><div class="row"><div><b>${p.name}</b><div style="font-size:12px;color:var(--muted)">${fmtDate(p.date)}${p.startTime?` · ${p.startTime}`:''} · ${num(p.qty)} SP${p.durationMinutes?` · ~${num(p.durationMinutes)} phút`:''}</div></div><span class="badge ${r4StatusClass(p.status)}">${r4StatusLabel(p.status)}</span></div>
    <div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn small" onclick="r4PlanDetail('${p.id}')">Xem chi tiết</button>
    ${p.status==='draft'?`<button class="btn small" onclick="r4OpenEditDraft('${p.id}')">✏️ Chỉnh sửa</button><button class="btn small primary" onclick="r4ApprovePlan('${p.id}')">Duyệt</button>`:''}
    ${p.status==='approved'?`<button class="btn small primary" onclick="r4StartPlan('${p.id}')">Bắt đầu sản xuất</button>`:''}
    ${p.status==='producing'?`<button class="btn small primary" onclick="r4FinishPlan('${p.id}')">Hoàn thành</button>`:''}</div>
    ${shortages.length?`<div class="alert danger" style="margin-top:8px;padding:9px">🔴 <b>Thiếu riêng kế hoạch:</b> ${shortages.map(x=>`${x.name} thiếu ${num(x.short)} ${x.unit}`).join(' · ')}</div>`:`<div class="alert ok" style="margin-top:8px;padding:9px">🟢 Nguyên liệu theo kế hoạch đang đủ.</div>`}
  </div>`;
}
r4PlanListItem=r4PlanListItemV4;

// Bảng lịch cũng có cột thiếu riêng và nút chỉnh sửa nháp.
r4RenderPlanTable=function(){
  const week=document.getElementById('r4PlanWeekFilter')?.value||'',q=(document.getElementById('r4PlanSearch')?.value||'').toLowerCase();
  const rows=db.plans.filter(p=>(!week||r4Week(p.date)===week)&&(`${p.name} ${(p.items||[]).map(x=>productName(x.productId)).join(' ')}`).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('r4PlanTable').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Kế hoạch</th><th>Ngày</th><th>Giờ</th><th>Sản phẩm</th><th class="num">KH</th><th>Trạng thái</th><th>Thiếu riêng</th><th></th></tr></thead><tbody>${rows.map(p=>{
    const shortages=(p.status==='draft'||p.status==='approved')?r4PlanShortagesForPlan(p):(p.shortages||[]);
    return `<tr><td><b>${p.name}</b></td><td>${fmtDate(p.date)}</td><td>${p.startTime||'—'}</td><td>${(p.items||[]).map(x=>`${productName(x.productId)} × ${num(x.qty)}`).join('<br>')}</td><td class="num">${num(p.qty)}</td><td><span class="badge ${r4StatusClass(p.status)}">${r4StatusLabel(p.status)}</span></td><td>${shortages.length?shortages.map(x=>`${x.name}: ${num(x.short)} ${x.unit}`).join('<br>'):'<span class="badge ok">Đủ</span>'}</td><td class="num"><button class="btn small" onclick="r4PlanDetail('${p.id}')">Xem</button>${p.status==='draft'?` <button class="btn small" onclick="r4OpenEditDraft('${p.id}')">Sửa</button>`:''}</td></tr>`;
  }).join('')}</tbody></table></div>`:'<div class="empty">Không có kế hoạch phù hợp.</div>';
};

// Chi tiết kế hoạch cũng cho phép sửa khi còn Nháp và hiển thị thiếu riêng.
r4PlanDetail=function(pid){
  const p=db.plans.find(x=>x.id===pid);if(!p)return;
  const issued=p.issued||[],theoretical=Number(p.theoreticalCost)||0,actual=p.actualCost==null?null:Number(p.actualCost);
  const shortages=(p.status==='draft'||p.status==='approved')?r4PlanShortagesForPlan(p):(p.shortages||[]);
  const formula=p.formulaSnapshot||[];
  openModal(`<h2>Phiếu sản xuất · ${p.name}</h2>
    <div style="margin-bottom:14px"><span class="badge ${r4StatusClass(p.status)}">${r4StatusLabel(p.status)}</span> · ${fmtDate(p.date)}${p.startTime?` · ${p.startTime}`:''}${p.durationMinutes?` · dự kiến ${num(p.durationMinutes)} phút`:''}</div>
    ${p.note?`<div class="alert info" style="margin-bottom:12px"><div>📝</div><div>${p.note}</div></div>`:''}
    ${shortages.length?`<div class="alert danger" style="margin-bottom:12px"><div>🔴</div><div><b>Thiếu riêng kế hoạch</b><div style="margin-top:4px">${shortages.map(x=>`${x.name}: cần ${num(x.need)} ${x.unit} · khả dụng ${num(x.have)} · thiếu <b>${num(x.short)} ${x.unit}</b>`).join('<br>')}</div></div></div>`:`<div class="alert ok" style="margin-bottom:12px">🟢 Nguyên liệu theo kế hoạch đang đủ.</div>`}
    <div class="grid two"><div class="card" style="box-shadow:none"><div class="section-title">Sản phẩm</div>${(p.items||[]).map(x=>`<div class="list-item row"><span>${productName(x.productId)}</span><b>${num(x.qty)}</b></div>`).join('')}</div>
      <div class="card" style="box-shadow:none"><div class="section-title">Cost</div><div class="list-item row"><span>Lý thuyết</span><b>${money(theoretical)}</b></div><div class="list-item row"><span>Thực tế</span><b>${actual==null?'—':money(actual)}</b></div><div class="list-item row"><span>Chênh lệch</span><b>${actual==null?'—':`${actual-theoretical>=0?'+':''}${money(actual-theoretical)}`}</b></div></div></div>
    <div class="card" style="box-shadow:none;margin-top:12px"><div class="section-title">Công thức đã scale — dùng để sản xuất</div>${formula.length?formula.map(r4FormulaCard).join(''):'<div class="empty">Chưa có snapshot công thức.</div>'}</div>
    <div class="card" style="box-shadow:none;margin-top:12px"><div class="section-title">Xuất nguyên liệu theo lô (${issued.length} dòng)</div>${issued.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nguyên liệu</th><th>Lô</th><th>HSD</th><th class="num">SL</th><th class="num">Giá/đv</th><th class="num">Giá trị</th></tr></thead><tbody>${issued.map(x=>`<tr><td>${ingName(x.ingredientId)}</td><td>${x.lot||'—'}</td><td>${fmtDate(x.expiry)}</td><td class="num">${num(x.qty)} ${x.unit}</td><td class="num">${money(x.unitCost)}</td><td class="num">${money(x.value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa xuất nguyên liệu.</div>'}</div>
    ${p.status==='completed'?`<div class="alert ${p.variance>0?'warn':'ok'}" style="margin-top:12px">Sản lượng thực tế: <b>${num(p.actualOutput)}</b> · Hao hụt: <b>${num(p.actualWasteQty)} (${Number(p.actualWastePct||0).toFixed(1)}%)</b> · Cost / SP thực tế: <b>${money(p.actualUnitCost)}</b></div>`:''}
    <div class="modal-actions">${p.status==='draft'?`<button class="btn" onclick="closeModal();r4OpenEditDraft('${pid}')">✏️ Chỉnh sửa nháp</button>`:''}<button class="btn" onclick="r4PrintTicket('${pid}')">🖨️ Phiếu sản xuất</button><button class="btn" onclick="closeModal()">Đóng</button></div>`);
};

// Trang sản xuất: thêm tổng quan chung tách riêng, vẫn giữ từng kế hoạch.
productionRound4=function(){
  const dates=[...new Set(db.plans.map(p=>p.date).filter(Boolean))].sort().reverse(),currentWeek=r4Week(today()),weekPlans=db.plans.filter(p=>r4Week(p.date)===currentWeek);
  const counts={draft:0,approved:0,producing:0,completed:0};db.plans.forEach(p=>counts[p.status||'draft']++);
  return `<div class="page-head"><div><h1>Kế hoạch & lịch sản xuất</h1><p>Quản lý theo ngày/tuần, từ Nháp → Đã duyệt → Đang sản xuất → Đã hoàn thành.</p></div><button class="btn primary" onclick="r4PlanModal()">+ Tạo kế hoạch</button></div>
    <div class="grid stats">
      <div class="card stat"><div class="label">Nháp</div><div class="value">${counts.draft}</div><div class="sub">Chưa duyệt</div></div>
      <div class="card stat"><div class="label">Đã duyệt</div><div class="value">${counts.approved}</div><div class="sub">Đã giữ nguyên liệu</div></div>
      <div class="card stat"><div class="label">Đang sản xuất</div><div class="value">${counts.producing}</div><div class="sub">Đã xuất nguyên liệu</div></div>

    </div>
    ${r4GlobalPlanOverview()}
    <div class="card" style="margin-top:16px"><div class="row"><div><div class="section-title" style="margin-bottom:3px">Lịch tuần hiện tại</div><div style="font-size:12px;color:var(--muted)">Tuần ${currentWeek}</div></div><span class="badge ${weekPlans.length?'info':'ok'}">${weekPlans.length} kế hoạch</span></div>
      ${weekPlans.length?`<div class="list">${weekPlans.sort((a,b)=>a.date.localeCompare(b.date)).map(r4PlanListItem).join('')}</div>`:'<div class="empty">Tuần này chưa có kế hoạch.</div>'}</div>
    <div class="card" style="margin-top:16px"><div class="section-title">Lịch sản xuất</div><div class="toolbar"><select id="r4PlanWeekFilter" onchange="r4RenderPlanTable()"><option value="">Tất cả tuần</option>${[...new Set(dates.map(r4Week))].map(w=>`<option value="${w}">${w}</option>`).join('')}</select><input class="search" id="r4PlanSearch" placeholder="Tìm kế hoạch/sản phẩm..." oninput="r4RenderPlanTable()"></div><div id="r4PlanTable"></div></div>`;

// Bảo đảm khi tạo mới cũng lưu đủ giờ, thời lượng và snapshot công thức.
r4SavePlan=function(){
  const rows=[...document.querySelectorAll('#r4PlanItems .r4-plan-item')];
  const items=rows.map(r=>({productId:r.querySelector('.r4-pi').value,qty:+r.querySelector('.r4-pq').value||0})).filter(x=>x.qty>0);
  if(!items.length){toast('Thêm ít nhất một sản phẩm');return}
  const needs=r4NeedsForItems(items),shortages=r4PlanShortagesForPlan({items,needs,status:'draft'});
  const theoreticalCost=Object.entries(needs).reduce((s,[iid,q])=>s+q*standardPricePerUnit(db.ingredients.find(x=>x.id===iid)),0);
  const names=items.map(x=>productName(x.productId)).join(' + ');
  const formulaSnapshot=r4BuildFormulaSnapshot(items);
  db.plans.push({
    id:id(),name:names,productId:items[0].productId,items,
    date:f('r4PlanDate')||today(),startTime:f('r4PlanTime')||'',
    durationMinutes:+f('r4PlanDuration')||0,
    qty:items.reduce((s,x)=>s+x.qty,0),status:'draft',
    note:f('r4PlanNote').trim(),needs,shortages,theoreticalCost,formulaSnapshot,
    issued:[],actualOutput:null,actualWasteQty:0,actualWastePct:0,
    createdAt:new Date().toISOString()
  });
  save();closeModal();render('production');
  toast(shortages.length?'Đã lưu nháp · đang thiếu nguyên liệu':'Đã lưu nháp · đủ nguyên liệu');
};

<script>
// ===== ROUND 5 — POS + ĐƠN HÀNG =====
(function round5Init(){
  db.settings=db.settings||{};
  db.settings.invoice=Object.assign({
    storeName:'F&B Manager',phone:'',address:'',logo:'',bankName:'',bankAccount:'',bankOwner:'',bankQr:'',
    title:'ĐƠN BÁN HÀNG',footer:'Cảm ơn quý khách!',note:'',
    showOrderCode:true,showDate:true,showCustomer:true,showPhone:true,showDiscount:true,showShipping:true,showPayment:true,showBankQr:false,showAddress:true,showFooter:true,
    showItemUnitPrice:true,showItemTotal:true
  },db.settings.invoice||{});
  db.customers=Array.isArray(db.customers)?db.customers:[];
  db.vouchers=Array.isArray(db.vouchers)?db.vouchers:[];
  db.sales=Array.isArray(db.sales)?db.sales:[];
  db.sales.forEach(o=>{
    o.status=o.status||'completed';
    o.discount=Number(o.discount)||0;
    o.shippingFee=Number(o.shippingFee)||0;
    o.customerId=o.customerId||'';
    o.payments=Array.isArray(o.payments)?o.payments:([{method:o.paymentMethod||'cash',amount:Number(o.total)||0}]);
    o.returnedItems=Array.isArray(o.returnedItems)?o.returnedItems:[];
    o.voucherCode=o.voucherCode||'';
  });
  save();
})();

let posMode='sale';
let checkoutState={customerId:'',discountType:'fixed',discountValue:0,voucherCode:'',shippingFee:0,payments:[{method:'cash',amount:0}]};
function activeOrders(){return db.sales.filter(o=>o.status!=='cancelled');}
function orderItems(o){return Array.isArray(o.items)?o.items:[]}
function orderCustomer(o){return db.customers.find(c=>c.id===o.customerId)||null}
function orderSubtotal(o){return Number(o.subtotal)||orderItems(o).reduce((s,i)=>{const p=db.products.find(x=>x.id===i.pid);return s+(Number(i.qty)||0)*(Number(i.unitPrice??p?.price)||0)},0)}
function orderNet(o){return Number(o.total)||0}
function returnedQty(o,pid){return (o.returnedItems||[]).filter(x=>x.pid===pid).reduce((s,x)=>s+(Number(x.qty)||0),0)}
function fmtMoney(n){return money(Math.round(Number(n)||0))}
function voucherByCode(code){return db.vouchers.find(v=>String(v.code||'').trim().toLowerCase()===String(code||'').trim().toLowerCase()&&v.active!==false)}
function calcCheckout(){
  const subtotal=cart.reduce((s,c)=>{const p=db.products.find(x=>x.id===c.pid);return s+(p?Number(p.price)*c.qty:0)},0);
  let manual=0;
  if(checkoutState.discountType==='percent') manual=Math.min(subtotal,subtotal*Math.max(0,Number(checkoutState.discountValue)||0)/100);
  else manual=Math.min(subtotal,Math.max(0,Number(checkoutState.discountValue)||0));
  let voucherDiscount=0,voucher=null;
  if(checkoutState.voucherCode){
    voucher=voucherByCode(checkoutState.voucherCode);
    if(voucher&&subtotal>=Number(voucher.minOrder||0)) voucherDiscount=voucher.type==='percent'?Math.min(subtotal-manual,(subtotal-manual)*Number(voucher.value||0)/100):Math.min(subtotal-manual,Number(voucher.value)||0);
  }
  const shipping=Math.max(0,Number(checkoutState.shippingFee)||0);
  const total=Math.max(0,subtotal-manual-voucherDiscount+shipping);
  return {subtotal,manualDiscount:manual,voucherDiscount,shipping,total,voucher};
}
function paymentTotal(){return checkoutState.payments.reduce((s,p)=>s+Math.max(0,Number(p.amount)||0),0)}
function paymentLabel(m){return ({cash:'Tiền mặt',transfer:'Chuyển khoản',qr:'QR'})[m]||m}
function customerOptions(selected=''){return '<option value="">Khách lẻ</option>'+db.customers.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${c.name}${c.phone?' · '+c.phone:''}</option>`).join('')}
function pos(){
  return posMode==='history'?orderHistoryPage():posSalePage();
}
function posSalePage(){
  const c=calcCheckout();
  return `<div class="page-head"><div><h1>Bán hàng</h1><p>Chọn sản phẩm → khách hàng → giảm giá/phí giao → thanh toán.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="posMode='history';render('pos')">📋 Lịch sử đơn</button><button class="btn" onclick="customerModal()">+ Khách hàng</button><button class="btn" onclick="voucherModal()">🎟 Voucher</button></div></div>
  <div class="pos-layout"><div class="card"><div class="toolbar"><input class="search" placeholder="Tìm sản phẩm..." id="posSearch" oninput="renderPosProducts()"></div><div class="product-grid" id="posProducts">${posProducts()}</div></div>
  <div class="card"><div class="row"><div class="section-title">Đơn đang tạo</div><button class="btn small" onclick="clearCart();resetCheckout()">Xóa</button></div>
    <div class="field" style="margin-bottom:12px"><label>Khách hàng</label><select id="posCustomer" onchange="checkoutState.customerId=this.value">${customerOptions(checkoutState.customerId)}</select></div>
    <div id="cart">${cartHtmlV5()}</div>
    <div style="border-top:1px solid var(--line);margin-top:15px;padding-top:15px">
      <div class="form-grid"><div class="field"><label>Giảm giá</label><div style="display:flex;gap:6px"><select id="discountType" onchange="checkoutState.discountType=this.value;renderCheckoutBox()"><option value="fixed">Số tiền</option><option value="percent">%</option></select><input id="discountValue" type="number" min="0" value="${checkoutState.discountValue}" oninput="checkoutState.discountValue=this.value;renderCheckoutBox()"></div></div>
      <div class="field"><label>Voucher</label><div style="display:flex;gap:6px"><input id="voucherCode" placeholder="Mã voucher" value="${checkoutState.voucherCode}" oninput="checkoutState.voucherCode=this.value.toUpperCase();renderCheckoutBox()"><button class="btn small" onclick="applyVoucher()">Áp dụng</button></div></div>
      <div class="field full"><label>Phí giao hàng</label><input id="shippingFee" type="number" min="0" value="${checkoutState.shippingFee}" oninput="checkoutState.shippingFee=this.value;renderCheckoutBox()"></div></div>
      <div id="checkoutBox">${checkoutBoxHtml(c)}</div>
    </div>
  </div></div>`;
}
function cartHtmlV5(){
  if(!cart.length)return '<div class="empty">Chưa có sản phẩm.</div>';
  return cart.map(c=>{const p=db.products.find(x=>x.id===c.pid);return `<div class="cart-item"><div><b>${p?.name||'—'}</b><div style="font-size:12px;color:var(--muted)">${fmtMoney(p?.price)} / cái</div></div><div class="qty"><button onclick="changeCartV5('${c.pid}',-1)">−</button><b>${c.qty}</b><button onclick="changeCartV5('${c.pid}',1)">+</button></div><b>${fmtMoney((p?.price||0)*c.qty)}</b></div>`}).join('');
}
function checkoutBoxHtml(c){
  const paid=paymentTotal(),remaining=Math.max(0,c.total-paid);
  return `<div class="list-item"><div class="row"><span>Tạm tính</span><b>${fmtMoney(c.subtotal)}</b></div><div class="row" style="margin-top:6px"><span>Giảm giá</span><b>− ${fmtMoney(c.manualDiscount+c.voucherDiscount)}</b></div><div class="row" style="margin-top:6px"><span>Phí giao hàng</span><b>+ ${fmtMoney(c.shipping)}</b></div>${c.voucher?`<div style="font-size:12px;color:var(--ok);margin-top:7px">✓ Voucher ${c.voucher.code} · giảm ${fmtMoney(c.voucherDiscount)}</div>`:''}<div class="row" style="margin-top:10px;font-size:18px"><b>Tổng thanh toán</b><b style="color:var(--green)">${fmtMoney(c.total)}</b></div></div>
  <div style="margin-top:12px"><div class="row"><b>Thanh toán</b><button class="btn small" onclick="addPaymentRow()">+ Phương thức</button></div><div id="paymentRows" style="margin-top:8px">${checkoutState.payments.map((p,i)=>paymentRowHtml(p,i)).join('')}</div><div class="alert ${paid===c.total?'ok':paid>c.total?'warn':'danger'}" style="margin-top:10px"><div>${paid===c.total?'✓':paid>c.total?'⚠️':'💳'}</div><div><b>Đã nhập: ${fmtMoney(paid)}</b><div style="font-size:12px">${remaining>0?`Còn thiếu ${fmtMoney(remaining)}`:paid>c.total?`Dư ${fmtMoney(paid-c.total)}`:'Đủ thanh toán'}</div></div></div></div>
  <button class="btn primary" style="width:100%;margin-top:13px" onclick="completeOrderV5()" ${!cart.length||paid!==c.total?'disabled':''}>Hoàn tất đơn</button>`;
}
function paymentRowHtml(p,i){return `<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-bottom:7px"><select onchange="checkoutState.payments[${i}].method=this.value;refreshPaymentSummary()"><option value="cash" ${p.method==='cash'?'selected':''}>Tiền mặt</option><option value="transfer" ${p.method==='transfer'?'selected':''}>Chuyển khoản</option><option value="qr" ${p.method==='qr'?'selected':''}>QR</option></select><input id="paymentAmount_${i}" type="number" min="0" inputmode="numeric" value="${Number(p.amount)||0}" oninput="updatePaymentAmount(${i},this.value)"><button class="btn small" onclick="removePaymentRow(${i})">×</button></div>`}
function renderCheckoutBox(){const box=document.getElementById('checkoutBox');if(!box)return;box.innerHTML=checkoutBoxHtml(calcCheckout());const d=document.getElementById('discountType');if(d)d.value=checkoutState.discountType}
function updatePaymentAmount(i,value){checkoutState.payments[i].amount=value;refreshPaymentSummary()}
function refreshPaymentSummary(){const c=calcCheckout(),paid=paymentTotal(),remaining=Math.max(0,c.total-paid);const alert=document.querySelector('#checkoutBox .alert');if(alert){alert.className=`alert ${paid===c.total?'ok':paid>c.total?'warn':'danger'}`;alert.innerHTML=`<div>${paid===c.total?'✓':paid>c.total?'⚠️':'💳'}</div><div><b>Đã nhập: ${fmtMoney(paid)}</b><div style="font-size:12px">${remaining>0?`Còn thiếu ${fmtMoney(remaining)}`:paid>c.total?`Dư ${fmtMoney(paid-c.total)}`:'Đủ thanh toán'}</div></div>`}const btn=document.querySelector('#checkoutBox button[onclick="completeOrderV5()"]');if(btn)btn.disabled=!cart.length||paid!==c.total}
function addPaymentRow(){checkoutState.payments.push({method:'cash',amount:0});renderCheckoutBox()}
function removePaymentRow(i){if(checkoutState.payments.length===1)return;checkoutState.payments.splice(i,1);renderCheckoutBox()}
function resetCheckout(){checkoutState={customerId:'',discountType:'fixed',discountValue:0,voucherCode:'',shippingFee:0,payments:[{method:'cash',amount:0}]};render('pos')}
function applyVoucher(){const c=calcCheckout();if(!checkoutState.voucherCode){toast('Nhập mã voucher');return}if(!c.voucher){toast('Voucher không hợp lệ hoặc chưa đạt đơn tối thiểu');return}toast(`Đã áp dụng ${c.voucher.code} · giảm ${fmtMoney(c.voucherDiscount)}`);renderCheckoutBox()}
function changeCartV5(pid,d){const c=cart.find(x=>x.pid===pid);if(!c)return;const p=db.products.find(x=>x.id===pid);c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x!==c);if(c.qty>0&&c.qty>p.stock){c.qty=p.stock;toast('Không thể vượt quá tồn kho')}document.getElementById('cart').innerHTML=cartHtmlV5();renderCheckoutBox()}
function addCart(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;let c=cart.find(x=>x.pid===pid);if(c)c.qty++;else cart.push({pid,qty:1});if(c&&c.qty>p.stock){c.qty=p.stock;toast('Không đủ tồn kho')}document.getElementById('cart').innerHTML=cartHtmlV5();renderCheckoutBox()}
function clearCart(){cart=[];const e=document.getElementById('cart');if(e)e.innerHTML=cartHtmlV5();renderCheckoutBox()}
function completeOrderV5(){
  if(!cart.length)return;
  const c=calcCheckout(),paid=paymentTotal();
  if(paid!==c.total){toast('Số tiền thanh toán chưa đủ hoặc đang dư');return}
  for(const item of cart){const p=db.products.find(x=>x.id===item.pid);if(!p||item.qty>p.stock){toast(`Không đủ tồn: ${p?.name||'sản phẩm'}`);return}}
  const items=cart.map(x=>{const p=db.products.find(p=>p.id===x.pid);return {pid:x.pid,qty:x.qty,unitPrice:p.price}});
  items.forEach(x=>db.products.find(p=>p.id===x.pid).stock-=x.qty);
  const order={id:id(),date:today(),createdAt:new Date().toISOString(),customerId:checkoutState.customerId,items,subtotal:c.subtotal,discount:c.manualDiscount+c.voucherDiscount,manualDiscount:c.manualDiscount,voucherDiscount:c.voucherDiscount,voucherCode:c.voucher?.code||'',shippingFee:c.shipping,total:c.total,cost:items.reduce((s,x)=>s+productCost(db.products.find(p=>p.id===x.pid))*x.qty,0),payments:JSON.parse(JSON.stringify(checkoutState.payments)),status:'completed',returnedItems:[]};
  db.sales.push(order);save();cart=[];const id0=order.id;resetCheckout();toast('Đã hoàn tất đơn hàng');orderDetailModal(id0);
}
function customerModal(editId){const x=db.customers.find(c=>c.id===editId)||{name:'',phone:'',address:'',note:''};openModal(`<h2>${editId?'Sửa':'Thêm'} khách hàng</h2><div class="form-grid"><div class="field full"><label>Tên khách hàng</label><input id="cName" value="${x.name||''}"></div><div class="field"><label>Số điện thoại</label><input id="cPhone" value="${x.phone||''}"></div><div class="field"><label>Địa chỉ</label><input id="cAddress" value="${x.address||''}"></div><div class="field full"><label>Ghi chú</label><textarea id="cNote">${x.note||''}</textarea></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveCustomerV5('${editId||''}')">Lưu</button></div>`)}
function saveCustomerV5(eid){const x={id:eid||id(),name:f('cName').trim(),phone:f('cPhone').trim(),address:f('cAddress').trim(),note:f('cNote').trim()};if(!x.name){toast('Nhập tên khách hàng');return}if(eid)db.customers[db.customers.findIndex(c=>c.id===eid)]=x;else db.customers.push(x);save();closeModal();if(posMode==='sale'){checkoutState.customerId=x.id;render('pos')}else render('pos');toast('Đã lưu khách hàng')}
function voucherModal(){openModal(`<h2>Quản lý voucher</h2><div class="toolbar"><button class="btn primary" onclick="newVoucherForm()">+ Thêm voucher</button></div>${db.vouchers.map(v=>`<div class="list-item row"><div><b>${v.code}</b><div style="font-size:12px;color:var(--muted)">${v.type==='percent'?`Giảm ${v.value}%`:`Giảm ${fmtMoney(v.value)}`} · Đơn tối thiểu ${fmtMoney(v.minOrder||0)}</div></div><span class="badge ${v.active!==false?'ok':'warn'}">${v.active!==false?'Đang dùng':'Tắt'}</span></div>`).join('')||'<div class="empty">Chưa có voucher.</div>'}<div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`)}
function newVoucherForm(){openModal(`<h2>Thêm voucher</h2><div class="form-grid"><div class="field"><label>Mã</label><input id="vCode" placeholder="VD: GIAM10"></div><div class="field"><label>Loại</label><select id="vType"><option value="percent">%</option><option value="fixed">Số tiền</option></select></div><div class="field"><label>Giá trị giảm</label><input id="vValue" type="number" min="0"></div><div class="field"><label>Đơn tối thiểu</label><input id="vMin" type="number" min="0" value="0"></div></div><div class="modal-actions"><button class="btn" onclick="voucherModal()">Hủy</button><button class="btn primary" onclick="saveVoucherV5()">Lưu</button></div>`)}
function saveVoucherV5(){const x={id:id(),code:f('vCode').trim().toUpperCase(),type:f('vType'),value:+f('vValue')||0,minOrder:+f('vMin')||0,active:true};if(!x.code||x.value<=0){toast('Nhập mã và giá trị voucher');return}if(voucherByCode(x.code)){toast('Mã voucher đã tồn tại');return}db.vouchers.push(x);save();voucherModal();toast('Đã tạo voucher')}

 const q=(document.getElementById('orderSearch')?.value||'').toLowerCase();const rows=[...db.sales].sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date))).filter(o=>{const c=orderCustomer(o);return [o.id,o.date,c?.name,c?.phone,o.voucherCode].join(' ').toLowerCase().includes(q)});

function escapeHtmlV5(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function numberToVietnameseWordsV5(n){
  n=Math.round(Number(n)||0); if(n===0)return 'Không đồng';
  const ones=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function read3(x){const h=Math.floor(x/100),t=Math.floor((x%100)/10),u=x%10,parts=[];if(h){parts.push(ones[h]+' trăm');if(t===0&&u)parts.push('lẻ')}if(t){parts.push(ones[t]+' mươi');if(u===1)parts[parts.length-1]='mười';else if(u===5)parts.push('lăm');else if(u)parts.push(ones[u])}else if(u){parts.push(ones[u])}return parts.join(' ')}
  const units=['','nghìn','triệu','tỷ'];let groups=[];while(n){groups.unshift(n%1000);n=Math.floor(n/1000)}let out=[];groups.forEach((g,i)=>{if(g)out.push(read3(g)+' '+units[groups.length-1-i])});return out.join(' ').replace(/\s+/g,' ').trim()+' đồng';
}

function normalizeProductPricingV5(p){
  if(!p) return p;
  const retail = Number(p.retailPrice ?? p.price ?? 0) || 0;
  p.retailPrice = retail;
  p.promoPrice = Number(p.promoPrice) || 0;
  p.wholesalePrice = Number(p.wholesalePrice) || 0;
  p.customPrice = Number(p.customPrice) || 0;
  p.discountPercent = Number(p.discountPercent) || 0;
  p.activePriceMode = ['retail','promo','wholesale','custom','discount'].includes(p.activePriceMode) ? p.activePriceMode : 'retail';
  p.price = retail; // giữ tương thích dữ liệu cũ
  return p;
}
function productPriceModeLabelV5(mode){
  return ({retail:'Giá bán lẻ',promo:'Giá khuyến mãi',wholesale:'Giá bán sỉ',custom:'Giá tùy chỉnh',discount:'Giảm theo %'})[mode]||'Giá bán lẻ';
}
function productSalePriceV5(p){
  normalizeProductPricingV5(p);
  const retail=p.retailPrice;
  let price=retail;
  if(p.activePriceMode==='promo' && p.promoPrice>0) price=p.promoPrice;
  if(p.activePriceMode==='wholesale' && p.wholesalePrice>0) price=p.wholesalePrice;
  if(p.activePriceMode==='custom' && p.customPrice>0) price=p.customPrice;
  if(p.activePriceMode==='discount') price=retail*(1-Math.max(0,Math.min(100,p.discountPercent))/100);
  return Math.max(0,Math.round(price));
}

function calcCheckoutV5(){

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
}
function setCartQuickPriceV5(pid,price,label){
  const c=cart.find(x=>x.pid===pid); if(!c)return;
  c.unitPrice=Math.max(0,Math.round(Number(price)||0)); c.priceLabel=label; saveCartRefreshV5();
}
function quickInputPriceV5(pid,label,defaultValue){
  const value=prompt(`${label} cho sản phẩm này:`,String(Math.round(Number(defaultValue)||0)));
  if(value===null)return;
  const n=Number(String(value).replace(/[^0-9.-]/g,''));
  if(!isFinite(n)||n<0){toast('Giá không hợp lệ');return}
  setCartQuickPriceV5(pid,n,label);
}
function quickDiscountV5(pid,retail){
  const value=prompt('Giảm bao nhiêu %?', '10');
  if(value===null)return;
  const pct=Number(String(value).replace(',','.'));
  if(!isFinite(pct)||pct<0||pct>100){toast('Phần trăm giảm không hợp lệ');return}
  setCartQuickPriceV5(pid,retail*(1-pct/100),`Giảm ${pct}%`);
}
function saveCartRefreshV5(){closeModal();const e=document.getElementById('cart');if(e)e.innerHTML=cartHtmlV5();renderCheckoutBox();}

function calcCheckout(){
  const subtotal=cart.reduce((s,c)=>{const p=db.products.find(x=>x.id===c.pid);const unit=Number(c.unitPrice??p?.price??0)||0;return s+unit*c.qty},0);
  let manual=0;
  if(checkoutState.discountType==='percent') manual=Math.min(subtotal,subtotal*Math.max(0,Number(checkoutState.discountValue)||0)/100);
  else manual=Math.min(subtotal,Math.max(0,Number(checkoutState.discountValue)||0));
  let voucherDiscount=0,voucher=null;
  if(checkoutState.voucherCode){
    voucher=voucherByCode(checkoutState.voucherCode);
    if(voucher&&subtotal>=Number(voucher.minOrder||0)) voucherDiscount=voucher.type==='percent'?Math.min(subtotal-manual,(subtotal-manual)*Number(voucher.value||0)/100):Math.min(subtotal-manual,Number(voucher.value)||0);
  }
  const shipping=Math.max(0,Number(checkoutState.shippingFee)||0);
  const total=Math.max(0,subtotal-manual-voucherDiscount+shipping);

<script>
// ===== ROUND 6 — DÒNG TIỀN =====
// Tiền vào · Tiền ra · Chi phí · Nhập hàng · Công nợ · Chốt ca · Sổ ghi nợ · Đối soát · Báo cáo dòng tiền
(function round6Init(){
  db.cash = Array.isArray(db.cash) ? db.cash : [];
  db.debts = Array.isArray(db.debts) ? db.debts : [];
  db.shifts = Array.isArray(db.shifts) ? db.shifts : [];
  db.reconciliations = Array.isArray(db.reconciliations) ? db.reconciliations : [];
  db.cash.forEach(x=>{
    x.amount=Math.max(0,Number(x.amount)||0);
    x.type=x.type==='income'?'income':'expense';
    x.method=x.method||'cash';
    x.category=x.category||'Khác';
    x.date=x.date||today();
    x.createdAt=x.createdAt||new Date().toISOString();
  });
  db.debts.forEach(x=>{
    x.type=x.type||'receivable';
    x.amount=Math.max(0,Number(x.amount)||0);
    x.paid=Math.max(0,Number(x.paid)||0);
    x.status=x.status||((x.paid>=x.amount)?'paid':'open');
    x.date=x.date||today();
  });
  db.shifts.forEach(x=>{
    x.status=x.status||'closed';
    x.date=x.date||today();
    x.openingCash=Number(x.openingCash)||0;
    x.expectedCash=Number(x.expectedCash)||0;
    x.actualCash=Number(x.actualCash)||0;
  });

  // Bổ sung các giao dịch bán hàng cũ vào sổ dòng tiền nếu chưa có.
  db.sales.forEach(o=>{
    if(!o || !o.id) return;
    const exists=db.cash.some(x=>x.sourceId===o.id && x.sourceType==='sale');
    if(!exists && o.status!=='cancelled'){
      (o.payments||[]).forEach(p=>{
        const amount=Math.max(0,Number(p.amount)||0);
        if(amount) db.cash.push({
          id:id(),date:o.date||today(),type:'income',category:'Bán hàng',
          amount,method:p.method||'cash',sourceId:o.id,sourceType:'sale',
          customerId:o.customerId||'',note:`Đơn #${o.id.slice(-6).toUpperCase()}`,
          createdAt:o.createdAt||new Date().toISOString()
        });
      });
    }
  });
  save();
})();

function r6FmtDateTime(x){return x?new Date(x).toLocaleString('vi-VN'):'—'}

function r6CashSourceKey(x){return `${x.sourceType||'manual'}:${x.sourceId||x.id}`}
function r6CashEntries(opts={}){
  let rows=[...db.cash];
  if(opts.date) rows=rows.filter(x=>x.date===opts.date);
  if(opts.from) rows=rows.filter(x=>x.date>=opts.from);
  if(opts.to) rows=rows.filter(x=>x.date<=opts.to);
  if(opts.method) rows=rows.filter(x=>x.method===opts.method);
  if(opts.type) rows=rows.filter(x=>x.type===opts.type);
  return rows.sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));
}
function r6CashTotals(rows){
  return rows.reduce((a,x)=>{
    const n=Math.max(0,Number(x.amount)||0);
    if(x.type==='income')a.income+=n;else a.expense+=n;
    a.net=a.income-a.expense;
    a.byMethod[x.method||'cash']=(a.byMethod[x.method||'cash']||0)+(x.type==='income'?n:-n);
    return a;
  },{income:0,expense:0,net:0,byMethod:{}});
}
function r6CustomerName(id0){return db.customers?.find(c=>c.id===id0)?.name||'—'}
function r6DebtOutstanding(d){return Math.max(0,Number(d.amount||0)-Number(d.paid||0))}
function r6DebtStatus(d){const o=r6DebtOutstanding(d);return o<=0?'paid':Number(d.paid)>0?'partial':'open'}
function r6DebtBadge(d){const s=r6DebtStatus(d);return s==='paid'?'<span class="badge ok">Đã trả</span>':s==='partial'?'<span class="badge warn">Đang trả</span>':'<span class="badge danger">Còn nợ</span>'}
function r6CurrentShift(){
  return db.shifts.find(x=>x.status==='open')||null;
}
function r6ShiftTotals(shift){
  if(!shift)return {income:0,expense:0,net:0,cashIncome:0,cashExpense:0};
  const rows=r6CashEntries({from:shift.openedAt?.slice(0,10)||shift.date,to:shift.closedAt?.slice(0,10)||today()})
    .filter(x=>x.method==='cash' && (!shift.openedAt || String(x.createdAt)>=String(shift.openedAt)) && (!shift.closedAt || String(x.createdAt)<=String(shift.closedAt)));
  const t=r6CashTotals(rows);
  return {income:t.income,expense:t.expense,net:t.net,cashIncome:rows.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),cashExpense:rows.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)};
}

// Tự động ghi doanh thu từ đơn V5 vào sổ dòng tiền.
const _r6CompleteOrderV5=completeOrderV5;
completeOrderV5=function(){
  const beforeCount=db.sales.length;
  _r6CompleteOrderV5();
  if(db.sales.length>beforeCount){
    const o=db.sales[db.sales.length-1];
    const exists=db.cash.some(x=>x.sourceId===o.id&&x.sourceType==='sale');
    if(!exists){
      (o.payments||[]).forEach(p=>{
        const amount=Math.max(0,Number(p.amount)||0);if(!amount)return;
        db.cash.push({id:id(),date:o.date,type:'income',category:'Bán hàng',amount,method:p.method||'cash',sourceId:o.id,sourceType:'sale',customerId:o.customerId||'',note:`Đơn #${o.id.slice(-6).toUpperCase()}`,createdAt:o.createdAt||new Date().toISOString()});
      });
      save();
    }
  }
};

const _r6CancelOrderV5=cancelOrderV5;
cancelOrderV5=function(oid){
  const o=db.sales.find(x=>x.id===oid);if(!o)return;
  _r6CancelOrderV5(oid);
  const updated=db.sales.find(x=>x.id===oid);
  if(updated?.status==='cancelled'&&!db.cash.some(x=>x.sourceId===oid&&x.sourceType==='sale-cancel')){
    (updated.payments||[]).forEach(p=>{const amount=Math.max(0,Number(p.amount)||0);if(amount)db.cash.push({id:id(),date:today(),type:'expense',category:'Hoàn tiền hủy đơn',amount,method:p.method||'cash',sourceId:oid,sourceType:'sale-cancel',note:`Hủy đơn #${oid.slice(-6).toUpperCase()}`,createdAt:new Date().toISOString()})});
    save();
  }
};

const _r6ConfirmReturnV5=confirmReturnV5;
confirmReturnV5=function(oid){
  const o=db.sales.find(x=>x.id===oid);const before=Number(o?.returnedTotal)||0;
  _r6ConfirmReturnV5(oid);
  const updated=db.sales.find(x=>x.id===oid);const after=Number(updated?.returnedTotal)||0,refund=Math.max(0,after-before);
  if(refund>0){
    const key=`return:${oid}:${after}`;
    if(!db.cash.some(x=>x.sourceType==='sale-return'&&x.sourceId===key)){
      db.cash.push({id:id(),date:today(),type:'expense',category:'Hoàn tiền trả hàng',amount:refund,method:(updated?.payments?.[0]?.method||'cash'),sourceId:key,sourceType:'sale-return',note:`Trả hàng · đơn #${oid.slice(-6).toUpperCase()}`,createdAt:new Date().toISOString()});
      save();
    }
  }
};

<script>
// ===== VÒNG 7 — BÁO CÁO (PATCH AN TOÀN, GIỮ NGUYÊN VÒNG 6) =====
// Không thay thế các module cũ. Chỉ thay cách render riêng trang Báo cáo.
// Mục tiêu: bấm "Báo cáo" phải mở ngay, không vòng lặp, không phụ thuộc thư viện ngoài.

function r7DateValue(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')) ? String(v) : ''; }
function r7StartDate(){ return r7DateValue(document.getElementById('r7From')?.value) || ''; }
function r7EndDate(){ return r7DateValue(document.getElementById('r7To')?.value) || ''; }
function r7InRange(date,from,to){
  const d=String(date||'').slice(0,10);
  if(from && d<from) return false;
  if(to && d>to) return false;
  return true;
}
function r7Sales(){
  const from=r7StartDate(),to=r7EndDate();
  return (Array.isArray(db.sales)?db.sales:[]).filter(o=>o?.status!=='cancelled' && r7InRange(o.date||o.createdAt,from,to));
}
function r7CompletedPlans(){
  const from=r7StartDate(),to=r7EndDate();
  return (Array.isArray(db.plans)?db.plans:[]).filter(p=>p?.status==='done' && r7InRange(p.completedAt||p.date||p.createdAt,from,to));
}
function r7InventoryValue(){
  return (Array.isArray(db.batches)?db.batches:[]).reduce((s,b)=>s+(Number(b.qty)||0)*(Number(b.pricePerUnit)||0),0);
}
function r7SalesQty(sales){
  const out={};
  sales.forEach(o=>orderItems(o).forEach(it=>{
    const q=Number(it.qty)||0;
    if(q) out[it.pid]=(out[it.pid]||0)+q;
  }));
  return out;
}
function r7RevenueByDay(sales){
  const out={};
  sales.forEach(o=>{
    const d=String(o.date||o.createdAt||'').slice(0,10)||today();
    out[d]=(out[d]||0)+Number(o.total)||0;
  });
  return out;
}
function r7IngredientConsumption(plans){
  const out={};
  plans.forEach(p=>{
    if(p.movements?.length){
      p.movements.forEach(m=>{
        const q=Number(m.qty)||0;
        if(q) out[m.ingredientId]=(out[m.ingredientId]||0)+q;
      });
    }else{
      Object.entries(p.needs||{}).forEach(([iid,q])=>out[iid]=(out[iid]||0)+(Number(q)||0));
    }
  });
  return out;
}
function r7PurchaseRows(){
  const from=r7StartDate(),to=r7EndDate();
  return (Array.isArray(db.cash)?db.cash:[]).filter(x=>x?.type==='expense' && ['Nhập nguyên liệu','Nhập hàng'].includes(x.category||'') && r7InRange(x.date||x.createdAt,from,to));
}
function r7PriceHistory(){
  const raw=[];
  (Array.isArray(db.priceHistory)?db.priceHistory:[]).forEach(x=>{
    raw.push({
      date:x.date||x.createdAt||x.timestamp,
      ingredientId:x.ingredientId||x.id,
      oldPrice:Number(x.oldPrice??x.oldUnitPrice??x.fromPrice)||0,
      newPrice:Number(x.newPrice??x.newUnitPrice??x.toPrice)||0
    });
  });
  const from=r7StartDate(),to=r7EndDate();
  return raw.filter(x=>r7InRange(x.date,from,to));
}
function r7Bar(value,max){
  const pct=max>0?Math.max(0,Math.min(100,value/max*100)):0;
  return `<div class="progress"><span style="width:${pct}%"></span></div>`;
}
function r7SvgChart(days){
  if(!days.length) return '<div class="empty">Chưa có dữ liệu trong khoảng đã chọn.</div>';
  const W=760,H=260,P=42, iw=W-P*1.2, ih=H-70;
  const vals=days.map(x=>Number(x[1])||0), max=Math.max(1,...vals);
  const pts=days.map((x,i)=>{const xx=P+(days.length===1?iw/2:i*iw/(days.length-1));const yy=20+ih-(vals[i]/max)*ih;return [xx,yy]});
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L '+pts[pts.length-1][0].toFixed(1)+' '+(20+ih)+' L '+pts[0][0].toFixed(1)+' '+(20+ih)+' Z';
  const grid=[0,.25,.5,.75,1].map(t=>{const y=20+ih-ih*t;return `<line x1="${P}" y1="${y}" x2="${W-12}" y2="${y}" stroke="#e4e9e6"/><text x="${P-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#718078">${fmtMoney(max*t)}</text>`}).join('');
  const labels=days.map((x,i)=>{const xx=pts[i][0];return `<text x="${xx}" y="${H-18}" text-anchor="middle" font-size="10" fill="#718078">${String(x[0]).slice(5)}</text>`}).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="white" stroke="var(--green)" stroke-width="3"><title>${days[i][0]}: ${fmtMoney(vals[i])}</title></circle>`).join('');
  return `<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="260" role="img" aria-label="Biểu đồ doanh thu theo ngày">${grid}<path d="${area}" fill="#eaf5f0"/><path d="${line}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg></div>`;
}
function r7ProfitByTime(sales){
  const out={};
  sales.forEach(o=>{
    const d=String(o.date||o.createdAt||'').slice(0,10)||today();
    const revenue=Number(o.total)||0, cost=Number(o.cost)||0;
    if(!out[d]) out[d]={revenue:0,cost:0,profit:0,orders:0};
    out[d].revenue+=revenue; out[d].cost+=cost; out[d].profit+=revenue-cost; out[d].orders++;
  });
  return Object.entries(out).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);
}
function r7ProfitChart(rows){
  if(!rows.length) return '<div class="empty">Chưa có lợi nhuận trong khoảng đã chọn.</div>';
  const W=760,H=270,P=42,iw=W-P*1.2,ih=H-76;
  const max=Math.max(1,...rows.map(x=>Math.abs(x[1].profit)||0));
  const min=Math.min(0,...rows.map(x=>x[1].profit||0));
  const range=Math.max(1,max-min), zero=20+ih-((0-min)/range)*ih;
  const pts=rows.map((x,i)=>{const xx=P+(rows.length===1?iw/2:i*iw/(rows.length-1));const yy=20+ih-(((x[1].profit||0)-min)/range)*ih;return [xx,yy]});
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const grid=[0,.25,.5,.75,1].map(t=>{const v=min+range*t,y=20+ih-((v-min)/range)*ih;return `<line x1="${P}" y1="${y}" x2="${W-12}" y2="${y}" stroke="#e4e9e6"/><text x="${P-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#718078">${fmtMoney(v)}</text>`}).join('');
  const labels=rows.map((x,i)=>`<text x="${pts[i][0]}" y="${H-18}" text-anchor="middle" font-size="10" fill="#718078">${String(x[0]).slice(5)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="white" stroke="${rows[i][1].profit<0?'#c93b3b':'var(--green)'}" stroke-width="3"><title>${rows[i][0]}: ${fmtMoney(rows[i][1].profit)}</title></circle>`).join('');
  return `<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="270" role="img" aria-label="Biểu đồ lợi nhuận theo ngày">${grid}<line x1="${P}" y1="${zero}" x2="${W-12}" y2="${zero}" stroke="#cfd8d3" stroke-dasharray="5 5"/><path d="${line}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg></div>`;
}
function r7ReportHtml(){
  const sales=r7Sales(),plans=r7CompletedPlans(),qty=r7SalesQty(sales);
  const revenue=sales.reduce((s,x)=>s+(Number(x.total)||0),0),cost=sales.reduce((s,x)=>s+(Number(x.cost)||0),0),profit=revenue-cost;
  const purchase=r7PurchaseRows().reduce((s,x)=>s+(Number(x.amount)||0),0),inventory=r7InventoryValue();
  const ranked=[...db.products].map(p=>{let q=0,rev=0; sales.forEach(o=>orderItems(o).forEach(i=>{if(i.pid===p.id){q+=Number(i.qty)||0;rev+=(Number(i.qty)||0)*(Number(i.unitPrice??p.price)||0)}}));const c=(productCost(p)||0)*q;return {p,q,revenue:rev,cost:c}}).sort((a,b)=>b.q-a.q);
  const consumption=r7IngredientConsumption(plans),consRows=Object.entries(consumption).map(([iid,q])=>({i:db.ingredients.find(x=>x.id===iid),q})).filter(x=>x.i).sort((a,b)=>b.q-a.q),maxCons=consRows[0]?.q||0;
  const priceRows=r7PriceHistory(),revenueDays=r7RevenueByDay(sales),days=Object.entries(revenueDays).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14),profitDays=r7ProfitByTime(sales);
  return `<div class="page-head"><div><h1>Báo cáo</h1><p>Nhìn nhanh doanh thu, lợi nhuận, sản xuất, kho và biến động giá.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="r7ExportCSV()">Xuất Excel</button><button class="btn" onclick="r7PrintPDF()">Xuất PDF</button></div></div>
  <div class="card" style="margin-bottom:16px"><div class="toolbar" style="margin:0"><div class="field" style="min-width:170px;flex:0 0 auto"><label>Từ ngày</label><input id="r7From" type="date" value="${r7DateValue(window.r7FilterFrom)||''}"></div><div class="field" style="min-width:170px;flex:0 0 auto"><label>Đến ngày</label><input id="r7To" type="date" value="${r7DateValue(window.r7FilterTo)||''}"></div><div style="display:flex;align-items:flex-end;gap:8px"><button class="btn primary" onclick="r7Apply()">Xem báo cáo</button><button class="btn" onclick="r7Clear()">Tất cả</button></div></div></div>
  <div class="grid stats"><div class="card stat"><div class="label">Doanh thu</div><div class="value">${fmtMoney(revenue)}</div><div class="sub">${sales.length} đơn</div></div><div class="card stat"><div class="label">Giá vốn</div><div class="value">${fmtMoney(cost)}</div><div class="sub">Theo đơn đã bán</div></div><div class="card stat"><div class="label">Lợi nhuận gộp</div><div class="value">${fmtMoney(profit)}</div><div class="sub">${revenue?((profit/revenue)*100).toFixed(1):'0.0'}% doanh thu</div></div><div class="card stat"><div class="label">Giá trị tồn nguyên liệu</div><div class="value">${fmtMoney(inventory)}</div><div class="sub">Chi phí nhập kỳ: ${fmtMoney(purchase)}</div></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title">Biểu đồ doanh thu theo ngày</div>${r7SvgChart(days)}</div><div class="card"><div class="section-title">Biểu đồ lợi nhuận theo thời gian</div>${r7ProfitChart(profitDays)}</div></div>
  <div class="card" style="margin-top:16px"><div class="section-title">Lợi nhuận theo ngày</div><div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th class="num">Đơn</th><th class="num">Doanh thu</th><th class="num">Giá vốn</th><th class="num">Lợi nhuận</th><th class="num">Biên LN</th></tr></thead><tbody>${profitDays.map(([d,x])=>`<tr><td><b>${fmtDate(d)}</b></td><td class="num">${num(x.orders)}</td><td class="num">${fmtMoney(x.revenue)}</td><td class="num">${fmtMoney(x.cost)}</td><td class="num"><b>${fmtMoney(x.profit)}</b></td><td class="num">${x.revenue?(x.profit/x.revenue*100).toFixed(1):'0.0'}%</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Chưa có dữ liệu.</div></td></tr>'}</tbody></table></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title">Sản phẩm bán chạy</div>${ranked.length?ranked.slice(0,8).map(x=>`<div class="list-item"><div class="row"><b>${x.p.name}</b><b>${num(x.q)} cái</b></div><div style="font-size:12px;color:var(--muted);margin-top:4px">Doanh thu ${fmtMoney(x.revenue)} · Lợi nhuận gộp ${fmtMoney(x.revenue-x.cost)}</div></div>`).join(''):'<div class="empty">Chưa có dữ liệu bán hàng.</div>'}</div><div class="card"><div class="section-title">Nguyên liệu tiêu thụ</div>${consRows.length?consRows.slice(0,10).map(x=>`<div class="list-item"><div class="row"><b>${x.i.name}</b><span>${num(x.q)} ${x.i.unit}</span></div>${r7Bar(x.q,maxCons)}</div>`).join(''):'<div class="empty">Chưa có dữ liệu sản xuất hoàn thành.</div>'}</div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title">Tồn kho nguyên liệu</div>${db.ingredients.map(i=>{const q=(db.batches||[]).filter(b=>b.ingredientId===i.id).reduce((s,b)=>s+(Number(b.qty)||0),0),val=(db.batches||[]).filter(b=>b.ingredientId===i.id).reduce((s,b)=>s+(Number(b.qty)||0)*(Number(b.pricePerUnit)||0),0);return `<div class="list-item"><div class="row"><b>${i.name}</b><span>${num(q)} ${i.unit}</span></div><div style="font-size:12px;color:var(--muted);margin-top:4px">${fmtMoney(val)}</div></div>`}).join('')||'<div class="empty">Chưa có nguyên liệu.</div>'}</div><div class="card"><div class="section-title">Sản xuất & nhập hàng</div><div class="list-item row"><span>Kế hoạch đã hoàn thành</span><b>${num(plans.length)}</b></div><div class="list-item row"><span>Chi phí nhập hàng trong kỳ</span><b>${fmtMoney(purchase)}</b></div><div class="list-item row"><span>Giá trị tồn hiện tại</span><b>${fmtMoney(inventory)}</b></div></div></div>
  <div class="card" style="margin-top:16px"><div class="section-title">Lợi nhuận theo sản phẩm</div><div class="table-wrap"><table class="table"><thead><tr><th>Sản phẩm</th><th class="num">Đã bán</th><th class="num">Doanh thu</th><th class="num">Giá vốn</th><th class="num">Lợi nhuận</th><th class="num">Biên LN</th></tr></thead><tbody>${ranked.map(x=>`<tr><td><b>${x.p.name}</b></td><td class="num">${num(x.q)}</td><td class="num">${fmtMoney(x.revenue)}</td><td class="num">${fmtMoney(x.cost)}</td><td class="num">${fmtMoney(x.revenue-x.cost)}</td><td class="num">${x.revenue?((x.revenue-x.cost)/x.revenue*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card" style="margin-top:16px"><div class="section-title">Biến động giá nguyên liệu</div>${priceRows.length?priceRows.slice().reverse().slice(0,10).map(x=>`<div class="list-item row"><span>${ingName(x.ingredientId)}<small style="display:block;color:var(--muted)">${fmtDate(x.date)}</small></span><span>${fmtMoney(x.oldPrice)} → <b>${fmtMoney(x.newPrice)}</b></span></div>`).join(''):'<div class="empty">Chưa có biến động giá trong khoảng đã chọn.</div>'}</div>`;

window.r7FilterFrom='';
window.r7FilterTo='';

    rows.push([p.name,q,revenue,c,revenue-c]);

  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');

  w.document.close();
