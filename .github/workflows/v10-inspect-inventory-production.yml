name: V10 inspect inventory production
on:
  push:
    branches: [v10-clean-architecture]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List domain functions
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          names=[]
          for m in re.finditer(r'(?<![\w$])function\s+([A-Za-z_$][\w$]*)\s*\(',s):
              n=m.group(1)
              if re.search(r'(inventory|production|stock|batch|plan)',n,re.I):
                  names.append(n)
          seen=[]
          for n in names:
              if n not in seen: seen.append(n)
          print('DOMAIN FUNCTIONS:')
          print('\n'.join(seen))
          for n in ('inventoryRound4','productionRound4'):
              print(f'\n=== {n} occurrences ===')
              for m in re.finditer(r'(?<![\w$])function\s+'+re.escape(n)+r'\s*\(',s):
                  print('offset',m.start())
