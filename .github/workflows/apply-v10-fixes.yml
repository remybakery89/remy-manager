name: Apply V10 bugfixes
on:
  push:
    branches:
      - v10-clean-architecture
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('v10-sync.js')
          s=p.read_text(encoding='utf-8')
          marker='  /* V10_TARGETED_FIXES_20260908 */'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          code=r'''  /* V10_TARGETED_FIXES_20260908 */
  function v10RenderPricingSettings(){
    try{
      const html=typeof settingsRound2==='function' ? settingsRound2() : '';
      if(!html){ toast('Không tải được màn Giá bán'); return; }
      const v=document.getElementById('view');
      if(v) v.innerHTML=html;
      document.getElementById('topTitle').textContent='Cài đặt';
      document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='settings'));
    }catch(e){ console.error('pricing settings',e); toast('Không mở được phần Giá bán'); }
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest?.('button[data-page="settings"]');
    if(!b) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    v10RenderPricingSettings();
  },true);

  function v10CaptureRecipeDraft(){
    if(typeof editingRecipeId==='undefined' || !editingRecipeId && !document.getElementById('rName')) return null;
    const rows=[...document.querySelectorAll('#recipeLines .recipe-line')];
    return {
      id: editingRecipeId || '',
      name: document.getElementById('rName')?.value || '',
      yield: document.getElementById('rYield')?.value || '1',
      wastePct: document.getElementById('rWaste')?.value || '0',
      processTemp: document.getElementById('rTemp')?.value || '',
      processTime: document.getElementById('rTime')?.value || '',
      notes: document.getElementById('rNotes')?.value || '',
      lines: rows.map(row=>{
        const kind=row.querySelector('.rl-kind')?.value||'ingredient';
        const ref=row.querySelector('.rl-ref')?.value||'';
        const qty=row.querySelector('.rl-qty')?.value||'0';
        const waste=row.querySelector('.rl-waste')?.value||'0';
        return kind==='recipe' ? {kind,recipeId:ref,qty:+qty||0} : {kind:'ingredient',ingredientId:ref,qty:+qty||0,wastePct:+waste||0};
      })
    };
  }
  function v10RestoreRecipeDraft(draft){
    if(!draft) return;
    if(typeof window.recipeModal!=='function') return;
    window.recipeModal(draft.id||'');
    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val??''};
    set('rName',draft.name); set('rYield',draft.yield); set('rWaste',draft.wastePct); set('rTemp',draft.processTemp); set('rTime',draft.processTime); set('rNotes',draft.notes);
    const holder=document.getElementById('recipeLines');
    if(holder) holder.innerHTML=(draft.lines||[]).map((l,i)=>typeof recipeLineV31==='function'?recipeLineV31(l,i):'').join('');
  }
  const v10OriginalQuickIngredientModal=window.quickIngredientModal;
  window.quickIngredientModal=function(){
    window.__v10RecipeDraft=v10CaptureRecipeDraft();
    if(typeof v10OriginalQuickIngredientModal==='function') return v10OriginalQuickIngredientModal();
  };
  window.saveQuickIngredient=function(){
    const before=window.__v10RecipeDraft;
    const x={id:id(),name:f('qiName').trim(),group:f('qiGroup'),unit:f('qiUnit'),pack:+f('qiPack'),packUnit:f('qiPackUnit'),price:+f('qiPrice')};
    const q=convertQty(x.pack,x.packUnit,x.unit);
    if(!x.name||!x.pack||!q||x.price<0){toast('Vui lòng kiểm tra thông tin nguyên liệu');return}
    db.ingredients.push(x); save(); toast('Đã tạo nguyên liệu'); closeModal();
    if(before){
      v10RestoreRecipeDraft(before);
      const rows=[...document.querySelectorAll('#recipeLines .recipe-line')];
      const holder=document.getElementById('recipeLines');
      if(holder && typeof recipeLineV31==='function') holder.insertAdjacentHTML('beforeend',recipeLineV31({kind:'ingredient',ingredientId:x.id,qty:0,wastePct:0},rows.length));
    }
    window.__v10RecipeDraft=null;
  };

  window.deleteIngredient=function(iid){
    const ing=(db.ingredients||[]).find(i=>i.id===iid);
    if(!ing){toast('Không tìm thấy nguyên liệu');return}
    const recipeRefs=(db.recipes||[]).filter(r=>(r.lines||[]).some(l=>l.kind==='ingredient'&&l.ingredientId===iid));
    const batchRefs=(db.batches||[]).filter(b=>b.ingredientId===iid);
    const inventoryRefs=(db.inventoryHistory||[]).filter(h=>h.ingredientId===iid);
    const receiptRefs=(db.purchaseReceipts||[]).filter(r=>r.ingredientId===iid);
    if(recipeRefs.length||batchRefs.length||inventoryRefs.length||receiptRefs.length){
      const parts=[];
      if(recipeRefs.length) parts.push(recipeRefs.length+' công thức');
      if(batchRefs.length) parts.push(batchRefs.length+' lô kho');
      if(inventoryRefs.length) parts.push(inventoryRefs.length+' giao dịch kho');
      if(receiptRefs.length) parts.push(receiptRefs.length+' phiếu nhập');
      toast('Không thể xóa: nguyên liệu đang được dùng trong '+parts.join(', ')); return;
    }
    if(!confirm('Xóa nguyên liệu “'+ing.name+'”?')) return;
    db.ingredients=(db.ingredients||[]).filter(i=>i.id!==iid); save();
    if(typeof render==='function') render('ingredients');
    toast('Đã xóa nguyên liệu');
  };
  if(typeof r3IngredientRowActions==='function'){
    const _r3IngredientRowActions=r3IngredientRowActions;
    window.r3IngredientRowActions=function(i){return _r3IngredientRowActions(i)+` <button class="btn small danger" onclick="deleteIngredient('${i.id}')">Xóa</button>`;};
  }
  '''
          needle='})();'
          if needle not in s: raise SystemExit('closing marker not found')
          s=s.replace(needle,code+'\n'+needle,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v10-sync.js
          git commit -m 'Fix pricing, recipe draft, and ingredient deletion' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-v10-fixes.yml || true
          git commit -m 'Remove temporary patch workflow' || true
          git push || true
