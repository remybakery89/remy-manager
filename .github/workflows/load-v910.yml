name: Load V9.10 foundation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/v910-trigger'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load v9.10.js from index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./v9.10.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html does not contain </body>')
              text = text.replace(marker, '\n' + tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Injected v9.10.js')
          else:
              print('v9.10.js already loaded')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git add index.html
          git commit -m 'fix: load V9.10 multi-device foundation'
          git push
