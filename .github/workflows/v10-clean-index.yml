name: V10 Clean Index

on:
  push:
    branches: [v10-clean-architecture]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, 'V10: clean index') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flatten legacy V9 entry points and dead bootstrap data
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove all external legacy V9 entry points.
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10(?:\.js)?(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10-ui-fix\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.11-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)

          # Remove the obsolete V1 local persistence key and sample bootstrap database.
          s, key_count = re.subn(r"\nconst KEY='fnb_manager_v1';", '', s, count=1)
          s, sample_count = re.subn(r'\nconst legacySampleData=\{.*?\n\};\nlet db=', '\nlet db=', s, count=1, flags=re.S)
          if key_count and sample_count:
              print('Removed obsolete V1 key and sample bootstrap data')

          # Keep exactly one V10 entry point. Do not inject or rewrite runtime persistence.
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v10-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          tag = '<script src="./v10-sync.js?v=1001"></script>'
          if '</body>' in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          else:
              s += '\n' + tag

          # Hard assertions: fail instead of publishing a partial migration.
          forbidden = [
              r'<script\b[^>]*src=["\'][^"\']*v9\.10(?:\.js)?',
              r'<script\b[^>]*src=["\'][^"\']*v9\.10-ui-fix\.js',
              r'<script\b[^>]*src=["\'][^"\']*v9\.11-sync\.js',
          ]
          for pattern in forbidden:
              if re.search(pattern, s, re.I):
                  raise SystemExit('Legacy V9 loader still present')
          if s.count('v10-sync.js?v=1001') != 1:
              raise SystemExit('V10 sync entry point count is not exactly 1')
          if 'fnb_manager_v1' in s:
              raise SystemExit('Obsolete V1 persistence key still present')
          if 'legacySampleData' in s:
              raise SystemExit('Legacy sample bootstrap data still present')
          if 'localStorage' in s or 'sessionStorage' in s or 'indexedDB' in s:
              raise SystemExit('Legacy client-side persistence still present in index.html')

          p.write_text(s, encoding='utf-8')
          print('index.html:', len(original), '->', len(s), 'bytes')

      - name: Commit clean index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V10: clean index'
          git push
