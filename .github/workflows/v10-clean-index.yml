name: V10 Clean Index

on:
  push:
    branches: [v10-clean-architecture]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean legacy bootstrap and entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10(?:\.js)?(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10-ui-fix\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.11-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\n\s*const KEY\s*=\s*["\']fnb_manager_v1["\']\s*;\s*\n', '\n', s, count=1)
          s = re.sub(r'\n\s*const legacySampleData\s*=\s*\{.*?\n\};\s*\n(?=let\s+db\s*=)', '\n', s, count=1, flags=re.S)

          # Keep this small compatibility helper because historical inline
          # renderers still execute before the V10 modules are loaded.
          helper = "function inventoryTotals(){const out={};db.ingredients.forEach(i=>out[i.id]=0);db.batches.forEach(b=>out[b.ingredientId]=(out[b.ingredientId]||0)+Number(b.qty||0));return out;}\n\n"
          if 'function inventoryTotals(){' not in s:
              marker = '\nfunction save(){'
              if marker not in s:
                  raise SystemExit('Clean-index assertion failed: save() marker not found')
              s = s.replace(marker, '\n' + helper + 'function save(){', 1)

          # Prevent an old inline production override from executing before
          # the extracted V10 production facade has been loaded.
          s = s.replace(
              'const _productionRound4Chot = productionRound4;',
              "const _productionRound4Chot = typeof productionRound4==='function' ? productionRound4 : null;",
              1
          )

          # Remove any existing V10 entry tag, including a mistakenly injected
          # copy inside a JavaScript template string, then add exactly one tag
          # immediately before the final HTML </body>.
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v10-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          tag = '<script src="./v10-sync.js?v=1001"></script>'
          if '</body>' in s:
              head, tail = s.rsplit('</body>', 1)
              s = head.rstrip() + '\n' + tag + '\n</body>' + tail
          else:
              s += '\n' + tag

          checks = {
              'V9 loaders': [r'v9\.10(?:\.js)?', r'v9\.10-ui-fix\.js', r'v9\.11-sync\.js'],
              'V1 key': [r'fnb_manager_v1'],
              'sample bootstrap': [r'legacySampleData'],
              'legacy persistence': [r'localStorage', r'sessionStorage', r'indexedDB'],
          }
          for label, patterns in checks.items():
              for pattern in patterns:
                  if re.search(pattern, s, re.I):
                      raise SystemExit(f'Clean-index assertion failed: {label}: {pattern}')
          if s.count('v10-sync.js?v=1001') != 1:
              raise SystemExit('Clean-index assertion failed: V10 sync entry point count is not exactly 1')
          if not s.rstrip().endswith('</html>'):
              raise SystemExit('Clean-index assertion failed: malformed HTML tail')
          if s.rfind(tag) < s.rfind('</body>') - 200:
              raise SystemExit('Clean-index assertion failed: V10 sync entry point is not at the final body boundary')

          p.write_text(s, encoding='utf-8')
          print('Clean-index migration completed')
          PY

      - name: Commit clean index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already clean'
            exit 0
          fi
          git commit -m 'V10: restore legacy runtime compatibility helpers'
          git push

      # Phase 9 runtime restoration marker: preserve only the minimal helpers
      # still required by historical inline renderers until their domains move.
