name: V10 one-time online cleanup
on:
  push:
    branches: [v10-clean-architecture]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-clean-architecture
      - name: Remove legacy local data and sync layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;"
          new="let db=defaultData;"
          if old not in s:
              raise SystemExit('Expected local-data initializer not found')
          s=s.replace(old,new,1)
          old_save="function save(){\nlocalStorage.setItem(KEY,JSON.stringify(db));\nwindow.dispatchEvent(new CustomEvent('fnb:data-saved'));\n}"
          new_save="function save(){\nwindow.dispatchEvent(new CustomEvent('fnb:data-saved'));\n}"
          if old_save not in s:
              raise SystemExit('Expected legacy save() not found')
          s=s.replace(old_save,new_save,1)
          p.write_text(s)
          PY
          rm -f v9.11-sync.js v9.10-ui-fix.js
          rm -f .github/workflows/clean-v10-online.yml
      - name: Commit cleaned V10
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "V10: remove legacy local data and sync layers" || exit 0
          git push origin HEAD:v10-clean-architecture
