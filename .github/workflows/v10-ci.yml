name: V10 Architecture Check

on:
  push:
    branches:
      - v10-clean-architecture
  pull_request:
    branches:
      - v10-clean-architecture

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check V10 entry point
        shell: python
        run: |
          from pathlib import Path
          import re

          s = Path("index.html").read_text(encoding="utf-8")

          legacy = re.findall(
              r'<script\b[^>]*src=["\'][^"\']*(?:v9\.10(?:\.js)?|v9\.10-ui-fix\.js|v9\.11-sync\.js)[^"\']*["\'][^>]*></script>',
              s,
              re.I
          )

          print("Legacy loaders:", legacy)

          if legacy:
              raise SystemExit("Legacy V9 loader still exists in index.html")

          if s.count("v10-sync.js?v=1001") != 1:
              raise SystemExit(
                  "Expected exactly one v10-sync.js?v=1001 entry point"
              )

      - name: Syntax check V10
        run: node --check v10-sync.js

      - name: Syntax check service worker
        run: node --check sw.js
