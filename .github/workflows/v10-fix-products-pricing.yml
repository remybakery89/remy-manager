name: V10 fix products pricing

on:
  push:
    branches:
      - v10-clean-architecture

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/v10-clean-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical product editor bridge
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('v10/ui/pricing.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('window.productModal=productModal;', 'window.productModal=window.productModalV5;')
          s=s.replace('onclick=\\"productModalNormalV5()\\"', 'onclick=\\"productModalV5()\\"')
          s=s.replace('onclick=\\"productModalNormalV5(\\\'${p.id}\\\')\\"', 'onclick=\\"productModalV5(\\\'${p.id}\\\')\\"')
          s=s.replace('onclick=\\"productModalNormalV5(\\\'${editId||\\\'\\\'}\\\')\\"', 'onclick=\\"productModalV5(\\\'${editId||\\\'\\\'}\\\')\\"')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/v10-fix-products-pricing.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','v10/ui/pricing.js','.github/workflows/v10-fix-products-pricing.yml'],check=True)
          subprocess.run(['git','commit','-m','V10: preserve final product editor bridge'],check=True)
          subprocess.run(['git','push'],check=True)
