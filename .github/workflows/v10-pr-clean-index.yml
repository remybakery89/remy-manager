name: V10 PR Clean Index

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.ref, 'cleaned')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Clean index entry points
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove legacy V9 loaders from the HTML itself.
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10(?:\.js)?(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.10-ui-fix\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v9\.11-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)

          # Make the core save function emit exactly one explicit V10 save event.
          new_save = """function save(){
          localStorage.setItem(KEY,JSON.stringify(db));
          window.dispatchEvent(new CustomEvent('fnb:data-saved'));
          }"""
          pattern = r'function\s+save\s*\(\)\s*\{\s*localStorage\.setItem\(KEY,JSON\.stringify\(db\)\);?\s*\}'
          s, n = re.subn(pattern, new_save, s, count=1)
          if n != 1 and 'fnb:data-saved' not in s:
              raise SystemExit('Could not locate save() for V10 event migration')

          # Keep exactly one explicit V10 sync loader.
          s = re.sub(r'\s*<script\b[^>]*src=["\'](?:\./)?v10-sync\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)
          tag = '<script src="./v10-sync.js?v=1001"></script>'
          if '</body>' in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          else:
              s += '\n' + tag

          if re.search(r'<script\b[^>]*src=["\'][^"\']*v9\.(?:10|11)', s, re.I):
              raise SystemExit('Legacy V9 loader still present')
          if s.count('v10-sync.js?v=1001') != 1:
              raise SystemExit('Expected exactly one V10 sync loader')
          if 'fnb:data-saved' not in s:
              raise SystemExit('Missing fnb:data-saved hook')

          p.write_text(s, encoding='utf-8')

      - name: Commit cleaned index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V10: clean index for PR test'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
