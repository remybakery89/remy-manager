name: V10 final online cleanup
on:
  push:
    branches: [v10-clean-architecture]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-clean-architecture
      - name: Remove embedded legacy V9 and wire one sync engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          start=s.find('V9 — ONLINE / SYNC / LOGIN')
          end=s.find('<!-- FNB_V9_EXTENSION_END -->')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Legacy V9 extension markers not found')
          block_start=s.rfind('/*',0,start)
          if block_start < 0:
              raise SystemExit('Legacy V9 block start not found')
          end += len('<!-- FNB_V9_EXTENSION_END -->')
          s=s[:block_start]+s[end:]
          tag='<script src="./v9.10.js?v=1010"></script>'
          if tag not in s:
              marker='<script src="./v10-sync.js?v=1001"></script>'
              if marker not in s:
                  raise SystemExit('V10 sync script marker not found')
              s=s.replace(marker,tag+'\n'+marker,1)
          if 'localStorage' in s:
              raise SystemExit('localStorage still remains in index.html')
          if 'AKfycbyzdZRb6RfFl7gR7M-XrwF8H5m6jD5STkREYUE6aiEGDL7O-9zE1i4JGKEccpz7A5tLtQ' in s:
              raise SystemExit('Old Apps Script URL still remains in index.html')
          p.write_text(s)
          PY
          rm -f v9.11-sync.js v9.10-ui-fix.js .github/workflows/clean-v10-online.yml .github/workflows/final-v10-clean.yml
      - name: Commit final cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "V10: remove embedded V9 and use single online sync engine" || exit 0
          git push origin HEAD:v10-clean-architecture
