name: V10 Extract Inventory Production
on:
  push:
    branches: [v10-clean-architecture]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-clean-architecture
      - name: Extract domain functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          start=s.find('<script>'); end=s.rfind('</script>')
          if start<0 or end<0: raise SystemExit('inline script not found')
          js=s[start+len('<script>'):end]
          def find_blocks(src,prefixes):
              out=[]; rem=[]; n=len(src); i=0; depth=0; q=None; esc=False; line=False; block=False
              while i<n:
                  c=src[i]; d=src[i+1] if i+1<n else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and d=='/': block=False; i+=2; continue
                      i+=1; continue
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                      i+=1; continue
                  if c in "'\"`": q=c; i+=1; continue
                  if c=='/' and d=='/': line=True; i+=2; continue
                  if c=='/' and d=='*': block=True; i+=2; continue
                  if c=='{': depth+=1; i+=1; continue
                  if c=='}': depth=max(0,depth-1); i+=1; continue
                  if depth==0:
                      m=re.match(r'function\s+([A-Za-z_$][\w$]*)\s*\(',src[i:])
                      if m and any(m.group(1).lower().startswith(x) for x in prefixes):
                          a=i; brace=src.find('{',i+m.end()); j=brace+1; dep=1; qq=None; ee=False; ln=False; bl=False
                          while j<n and dep:
                              ch=src[j]; nx=src[j+1] if j+1<n else ''
                              if ln:
                                  if ch=='\n': ln=False
                              elif bl:
                                  if ch=='*' and nx=='/': bl=False; j+=1
                              elif qq:
                                  if ee: ee=False
                                  elif ch=='\\': ee=True
                                  elif ch==qq: qq=None
                              else:
                                  if ch in "'\"`": qq=ch
                                  elif ch=='/' and nx=='/': ln=True; j+=1
                                  elif ch=='/' and nx=='*': bl=True; j+=1
                                  elif ch=='{': dep+=1
                                  elif ch=='}': dep-=1
                              j+=1
                          out.append((m.group(1),src[a:j].strip())); rem.append((a,j)); i=j; continue
                  i+=1
              return out,rem
          inv,ri=find_blocks(js,['inventory']); prod,rp=find_blocks(js,['production'])
          def extract_vars(src,prefixes):
              found=[]; rem=[]; pat=re.compile(r'(?m)^\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=')
              for m in list(pat.finditer(src)):
                  name=m.group(1)
                  if not any(name.lower().startswith(x) for x in prefixes): continue
                  j=m.end(); dep=0; q=None; e=False; ln=False; bl=False
                  while j<len(src):
                      ch=src[j]; nx=src[j+1] if j+1<len(src) else ''
                      if ln:
                          if ch=='\n': ln=False
                      elif bl:
                          if ch=='*' and nx=='/': bl=False; j+=1
                      elif q:
                          if e:e=False
                          elif ch=='\\':e=True
                          elif ch==q:q=None
                      else:
                          if ch in "'\"`":q=ch
                          elif ch=='/' and nx=='/':ln=True;j+=1
                          elif ch=='/' and nx=='*':bl=True;j+=1
                          elif ch in '([{':dep+=1
                          elif ch in ')]}':dep=max(0,dep-1)
                          elif ch==';' and dep==0:
                              text=src[m.start():j+1]
                              if '=>' in text or 'function' in text: found.append((name,text.strip())); rem.append((m.start(),j+1))
                              break
                      j+=1
              return found,rem
          iv,rv=extract_vars(js,['inventory']); pv,rpv=extract_vars(js,['production'])
          all_inv=inv+iv; all_prod=prod+pv
          if not all_inv or not all_prod: raise SystemExit(f'Extraction incomplete: inventory={len(all_inv)} production={len(all_prod)}')
          for a,b in sorted(ri+rv+rp+rpv,key=lambda x:x[0],reverse=True): js=js[:a]+'\n'+js[b:]
          p.write_text(s[:start+len('<script>')]+js+s[end:])
          def write_mod(path,title,items,exports):
              body = "/* F&B Manager V10 — " + title + " domain UI\n   Phase 8: Inventory + Production domain extracted.\n*/\n(function(){\n  'use strict';\n\n"
              body += "\n\n".join(x[1] for x in items)
              body += "\n\n" + exports + "\n})();\n"
              Path(path).write_text(body)
          write_mod('v10/ui/inventory.js','Inventory',all_inv,"window.inventoryRound4=inventoryRound4;\n  window.FNB_INVENTORY_UI={renderInventory:function(){const html=inventoryRound4();const v=document.getElementById('view');if(v)v.innerHTML=html;document.getElementById('topTitle').textContent='Kho';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='inventory'));}};")
          write_mod('v10/ui/production.js','Production',all_prod,"window.productionRound4=productionRound4;\n  window.FNB_PRODUCTION_UI={renderProduction:function(){const html=productionRound4();const v=document.getElementById('view');if(v)v.innerHTML=html;document.getElementById('topTitle').textContent='Sản xuất';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='production'));}};")
          print('Inventory extracted:',[x[0] for x in all_inv]); print('Production extracted:',[x[0] for x in all_prod])
          PY
      - name: Syntax check
        run: |
          node --check v10/ui/inventory.js
          node --check v10/ui/production.js
          node --check v10-sync.js
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v10/ui/inventory.js v10/ui/production.js
          git diff --cached --quiet && exit 0
          git commit -m 'V10: extract inventory and production domains'
          git push origin v10-clean-architecture
